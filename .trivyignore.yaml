# Trivy suppressions for the CYO Adventure container image.
#
# Migrated from the plain-text `.trivyignore` on 2026-08-17. The plain format
# cannot carry an expiry, so a suppression written in it was permanent by
# construction: the finding left every scan and nothing forced a second look.
# `expired_at` fixes that at the mechanism level rather than by documentation
# discipline, because Trivy STOPS HONOURING an entry once the date passes. An
# expired acceptance puts its finding back in the gate on its own.
#
# Scope: base-image (Debian trixie) OS-package CVEs with no fixed version on the
# trixie track. `linux-libc-dev` was once accepted at package scope in
# `.trivy/ignore-policy.rego` instead; that policy was removed on 2026-10-02
# because the base image no longer ships the package. See
# docs/known-vulnerabilities.md, "Resolution detail: `linux-libc-dev`
# package-scoped acceptance". If the package returns, full-scope scans (push,
# schedule, manual) surface its findings unsuppressed, which is intended;
# pull-request and merge-queue scans still omit any finding without a fixed
# version, because the workflow sets `ignore-unfixed` for those two events.
#
# Two rules govern every entry here, both machine-enforced:
#
#   1. `expired_at` must be present and within the 90-day horizon. Enforced by
#      the `Suppression Revisit Dates` job in the org reusable workflow
#      (ByronWilliamsCPA/.github PR #293) via check_trivy_ignore_expiry.py.
#   2. Every id must have a matching entry in docs/known-vulnerabilities.md, and
#      its `expired_at` must equal that entry's `Reassessment Due`. Enforced by
#      scripts/check_known_vulnerabilities.py, so the operative date and the
#      written assessment cannot drift apart.
#
# The `statement` below each id is a summary. The assessment that justifies the
# suppression, including reachability, lives in docs/known-vulnerabilities.md
# and is the thing to read before renewing a date.
#
# IMPORTANT: Trivy does NOT auto-detect this filename. Its built-in default is
# the plain-text `.trivyignore`, so this file is only honoured because it is
# passed explicitly: the reusable workflow resolves it and passes `trivyignores`,
# and `trivy.yaml` sets `ignorefile` for local runs. Renaming this file without
# updating both is a silent, total loss of suppression.

vulnerabilities:
  # Retired on 2026-09-03: 16 of the 20 suppressions this file once carried were
  # deleted in one pass because every one of them was already dead against the
  # base digest. Six named Expat CVEs that Debian fixed in
  # `expat 2.8.2-1~deb13u1` (DSA-6404-1), and the image ships 2.8.3; nine named
  # `gawk` and `perl-base`, which the image does not contain at all; and
  # CVE-2026-53615 on `libuuid1`, the one entry here that ever had an upstream
  # fix, which the refreshed digest now carries (`util-linux 2.41.5`). A
  # suppressed finding and an absent finding look identical from outside, so the
  # only way to tell them apart is to read the image rather than the scan report;
  # see docs/known-vulnerabilities.md, "Resolution detail: the six Expat CVEs,
  # `gawk` and `perl-base`".
  #
  # CVE-2026-66046, the seventh Expat CVE, outlived that pass and was retired on
  # 2026-10-31 by the base-image refresh to digest d3f085aa, which ships
  # `expat 2.9.0-1~deb13u1+dhi0`, the trixie-security fix (DSA-6566-1). See
  # docs/known-vulnerabilities.md, "Resolution detail: CVE-2026-66046 and the
  # 2026-10-31 base-image refresh".
  #
  # #ASSUME: security: the seven below still describe findings that EXIST in the
  # image and are UNFIXED upstream. Both halves were checked on 2026-09-03, and
  # both are the kind of fact that goes stale silently.
  # #VERIFY: at each reassessment, confirm the package is still in
  # `var/lib/dpkg/status.d/` of the pinned base image and that the Debian tracker
  # still shows no trixie-track fix. Do not infer either from a green scan.

  # --- libsqlite3-0 (sqlite3 source package); no Debian fix on the trixie track ---
  # Both were Medium when this file was written, and were described here as
  # suppressing nothing because the workflow is called with CRITICAL,HIGH. That
  # is no longer true: Trivy 0.70.0's feed rates BOTH HIGH as of 2026-09-03, so
  # these two entries are inside the threshold and are load-bearing.
  - id: CVE-2026-11822
    statement: >-
      SQLite < 3.53.2 memory corruption. This project uses PostgreSQL via
      asyncpg and never imports sqlite3, so the parser is handed no input.
    expired_at: 2026-11-08
  - id: CVE-2026-11824
    statement: >-
      SQLite < 3.53.2 heap buffer overflow. Same non-reachability as
      CVE-2026-11822.
    expired_at: 2026-11-08

  # --- ncurses family; no Debian fix on the trixie track ---
  - id: CVE-2025-69720
    statement: >-
      ncurses buffer overflow reachable only through attacker-controlled
      terminfo data. The runtime image has no shell, no TUI and no controlling
      terminal; nothing links or calls ncurses.
    expired_at: 2026-11-08

  # --- libuuid1 (util-linux source package); no Debian fix on the trixie track ---
  # All four are mount/nsenter defects that Debian tracks against the util-linux
  # source package, so Trivy reports them on libuuid1, the image's only
  # util-linux binary package. None of the vulnerable tools ships in the image.
  - id: CVE-2026-76642
    statement: >-
      util-linux mount helper post-hook privilege issue. Reported against
      libuuid1 2.41.5-0+deb13u1+dhi3; Debian trixie is <no-dsa> (Minor). The
      image contains no mount/libmount and nothing shells out.
    expired_at: 2027-01-29
  - id: CVE-2026-78408
    statement: >-
      util-linux nsenter --join-cgroup descriptor leak. Same package, Debian
      status and non-reachability as CVE-2026-76642; no nsenter in the image.
    expired_at: 2027-01-29
  - id: CVE-2026-78409
    statement: >-
      util-linux X-mount.subdir symlink escape. Same package, Debian status and
      non-reachability as CVE-2026-76642.
    expired_at: 2027-01-29
  - id: CVE-2026-78410
    statement: >-
      util-linux restricted bind-mount source race. Same package, Debian status
      and non-reachability as CVE-2026-76642.
    expired_at: 2027-01-29
