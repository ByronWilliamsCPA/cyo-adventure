# Docker Compose configuration for CYO Adventure
# Development and production-ready setup with common services

version: '3.9'

services:
  # =============================================================================
  # Application Service
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${ENVIRONMENT:-development}
    image: cyo_adventure:${VERSION:-latest}
    container_name: cyo_adventure-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Core settings (valid: local | dev | staging | production; non-local
      # activates the api/deps.py auth-stub guard and the database_url fail-fast)
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}

      # Database configuration. Must use the asyncpg driver: core/database.py
      # builds the engine via create_async_engine(), which rejects a bare
      # postgresql:// (sync) URL.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cyo_adventure:password@db:5432/cyo_adventure}

      # Backend token-signing secrets (core/config.py). Without a value the
      # mint endpoints (POST /api/v1/child-sessions, POST /api/v1/device-grants)
      # fail with a 400 ConfigurationError, so this LOCAL stack ships benign
      # defaults, mirroring the POSTGRES_PASSWORD `password` default above;
      # the Postman/newman suite (docs/api/README.md) exercises both mints
      # against this stack in CI. Non-local deployments can never rely on
      # these: core/config.py fails startup outside `local` when a secret is
      # missing or weak, and it rejects these two exact repository-known
      # values by name, so running this compose file with
      # ENVIRONMENT=dev/staging/production refuses to boot rather than sign
      # forgeable tokens (docker-compose.prod.yml supplies real secrets).
      CHILD_SESSION_SECRET: ${CHILD_SESSION_SECRET:-local-dev-child-session-secret-not-for-production}
      DEVICE_GRANT_SECRET: ${DEVICE_GRANT_SECRET:-local-dev-device-grant-secret-not-for-production}
      # Redis: backs the RQ generation queue (worker service below) and, when
      # RATE_LIMIT_BACKEND=redis, the rate limiter (core/config.py's redis_url
      # AliasChoices binds this unprefixed name; ADR-021 Phase 1).
      CYO_ADVENTURE_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Sentry (error tracking)
      # SENTRY_DSN: ${SENTRY_DSN:-}
      # SENTRY_ENVIRONMENT: ${ENVIRONMENT:-development}

      # Google Cloud credentials (if using Assured OSS)
      # GOOGLE_APPLICATION_CREDENTIALS_B64: ${GOOGLE_APPLICATION_CREDENTIALS_B64:-}
      # GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}

      # Task E1 (audit Group A: A1/A2): trust boundary for X-Forwarded-For/
      # -Proto (uvicorn --forwarded-allow-ips below). Defaults to this stack's
      # OWN pinned subnet (see the `networks:` block at the bottom of this
      # file), not the wider 172.16.0.0/12 Docker-bridge umbrella: this
      # network's subnet IS pinned here, so trusting anything broader would
      # needlessly cover addresses that can never legitimately be this
      # backend's reverse-proxy peer in dev. Production uses the broader /12
      # default instead (docker-compose.prod.yml, Dockerfile CMD) because the
      # homelab-infra backend-net there has no pinned subnet; see those files'
      # comments and issue #138. See core/config.py's forwarded_allow_ips
      # docstring for the full rationale; never set this to "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.26.0.0/16}

    # Overrides the Dockerfile's hardcoded CMD default so this env var actually
    # takes effect: the DHI hardened runtime image ships no shell, so the
    # Dockerfile's own exec-form CMD cannot expand ${FORWARDED_ALLOW_IPS:-...}
    # itself (see the Dockerfile's CMD comment). Compose resolves this
    # substitution client-side before the container starts, so no in-container
    # shell is needed.
    command:
      - uvicorn
      - cyo_adventure.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-172.26.0.0/16}

    volumes:
      # Development: Mount source code for hot reload
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      # Logs (optional)
      # - ./logs:/app/logs

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Use Python stdlib: the production image deliberately omits curl to avoid
      # its CVE surface. This matches the HEALTHCHECK in the Dockerfile exactly.
      # Canonical `/api/v1/health/live`; the un-prefixed alias is reserved for
      # out-of-repo probes (see app.py's include_router calls).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

    # Security: Run as non-root user
    user: "1000:1000"

    # `backend` alias lets frontend/nginx.conf's /api proxy resolve this
    # service consistently with the homelab R1 deploy stack (services/
    # cyo-adventure/ in homelab-infra), which names it `backend`.
    networks:
      cyo_adventure-network:
        aliases:
          - backend

# =============================================================================
  # Generation Worker Service (RQ, ADR-021 Phase 1)
  # =============================================================================
  # Runs the same image as `app` but as a blocking RQ worker process instead
  # of the uvicorn server, so generation jobs enqueued by the API are
  # actually consumed. Previously undefined in this repo (deployed only via
  # homelab-infra), which is why prior worker-down incidents (schema drift,
  # #VERIFY api/health.py::check_generation_queue) went unnoticed locally.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${ENVIRONMENT:-development}
    image: cyo_adventure:${VERSION:-latest}
    container_name: cyo_adventure-worker
    command: ["python", "-m", "cyo_adventure.generation.worker_main"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cyo_adventure:password@db:5432/cyo_adventure}
      # ADR-021: the worker's own least-privilege credential (the cyo_worker
      # role post-cutover). Left empty here on purpose: core/config.py's
      # worker_database_url_effective treats "" exactly like unset and falls
      # back to DATABASE_URL, so local dev keeps its single credential while
      # a deployed environment can split the two by setting this alone. An
      # operator who never sets it has NOT completed the ADR-021 cutover for
      # the worker process, and the fallback makes that silent.
      # #CRITICAL: security: /health/ready's database_privilege check does NOT
      # surface a forgotten value here. That check runs in the API process and
      # inspects the API engine's connection (settings.database_url), so an
      # environment whose API is correctly on cyo_api reports state="ok" while
      # the worker still shares the API credential.
      # #VERIFY: read the worker's own startup line instead
      # (generation/worker_main.py probes the worker engine once at startup),
      # or the pg_stat_activity query in docs/operations/runbook.md section
      # 11.2. The readiness check is not the worker-side cutover signal.
      # Read the FIELDS, not just the event name: the probe reports the
      # connected role, and cyo_api is itself least-privileged, so a forgotten
      # value here emits generation_worker.role_least_privileged rather than
      # role_bypasses_rls. worker_dsn_explicitly_set: false (equivalently
      # role != "cyo_worker") is what identifies the fallback.
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      CHILD_SESSION_SECRET: ${CHILD_SESSION_SECRET:-local-dev-child-session-secret-not-for-production}
      DEVICE_GRANT_SECRET: ${DEVICE_GRANT_SECRET:-local-dev-device-grant-secret-not-for-production}
      CYO_ADVENTURE_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No container healthcheck: the DHI base image ships no shell (see the
    # `app` service's `command:` comment above) and an RQ worker exposes no
    # HTTP endpoint to probe. Liveness is instead observed via
    # /health/ready's non-gating generation_queue check (api/health.py,
    # docs/operations/runbook.md).
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - cyo_adventure-network

# =============================================================================
  # Frontend Service (React + Vite)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: cyo_adventure-frontend:${VERSION:-latest}
    container_name: cyo_adventure-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # #CRITICAL: external-resources: vite.config.ts proxies /api to
      # `process.env.VITE_API_URL`, and that lookup runs INSIDE this container,
      # where `localhost` is the container's own loopback rather than the host.
      # Pointing it at localhost made every /api call 502, which the frontend
      # reports as `backend-unreachable`: the guardian signs in successfully and
      # is then dropped on "We can't reach CYO Adventure" instead of the console.
      # host-gateway resolves to the host in both supported setups, since the
      # `app` service publishes the same port on the host when it is running.
      #
      # The HOST-side knob is DEV_API_PROXY_TARGET, not VITE_API_URL, on
      # purpose. docker-compose.prod.yml:160 already spends the name
      # VITE_API_URL on a production BUILD ARG that is baked into the shipped
      # bundle (`${VITE_API_URL:-/api}`). If this dev target reused that name,
      # a developer who exported it (or uncommented it in the root .env, which
      # compose auto-loads for interpolation) would silently bake
      # `host.docker.internal` into a production build. The CONTAINER-side
      # variable stays VITE_API_URL because that is the name vite.config.ts
      # reads; only the interpolation source is renamed.
      #
      # Dev-target-only: this must never be aimed at a production backend. The
      # value also reaches the dev bundle's `import.meta.env.VITE_API_URL`,
      # because Vite's loadEnv merges every VITE_-prefixed process.env var into
      # the client env. src/hooks/apiBaseUrl.ts:18 ignores it today (it gates on
      # `import.meta.env.PROD`, and this service only ever runs an unbuilt dev
      # server), so it is inert in the browser; it would stop being inert the
      # moment this service were pointed at a production target.
      #
      # `environment:` takes precedence over `env_file:` below, so a developer
      # whose frontend/.env.local carries `VITE_API_URL=http://localhost:8000`
      # for bare `npm run dev` cannot re-break the in-container proxy.
      # #VERIFY: `curl -o /dev/null -w '%{http_code}' localhost:3000/api/v1/health/live`
      # must return 200, not 502.
      - VITE_API_URL=${DEV_API_PROXY_TARGET:-http://host.docker.internal:${APP_PORT:-8000}}
    # #CRITICAL: external-resources: auth/supabaseClient.ts throws when
    # VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY is missing, which takes out
    # the guardian lazy chunk (sign-in) while leaving the kid surface up.
    #
    # This used to be a `./frontend/.env.local:/app/.env.local:ro` bind mount,
    # and that failed SILENTLY on a fresh clone. The source path is gitignored
    # (frontend/.gitignore:41) and excluded by frontend/.dockerignore, so it
    # does not exist; Docker then creates an empty ROOT-OWNED DIRECTORY at that
    # host path, and Vite's loadEnv skips a non-file with no error at all
    # (`if (!stat || !stat.isFile() && !stat.isFIFO()) return []`). The result
    # was the exact dead-guardian-chunk symptom commit 409cf27a fixed, plus a
    # root-owned directory a non-root developer cannot remove and `git status`
    # never shows.
    #
    # `env_file:` replaces it, but deliberately as `required: false` plus the
    # startup guard below rather than as a hard requirement. A hard requirement
    # does fail loudly, and it fails FAR too widely: compose resolves env_file
    # when it PARSES the project, not when it starts this service, so an absent
    # file breaks every `docker compose` command in the repo. CI caught it on a
    # backend-only step that has no reason to own a frontend env file:
    #   docker compose exec -T db psql ...
    #   -> env file /.../frontend/.env.local not found
    # The guard checks the VARIABLES at frontend startup instead, which is both
    # narrower (nothing else in the project is affected) and more accurate (a
    # developer who supplies them another way is correctly left alone). It
    # rejects an empty value as well as an unset one, because compose's
    # `${VAR:-}` idiom yields the empty string, and Vite would carry that
    # straight through to a client that fails the same way a missing key does.
    #
    # The tradeoff accepted here is that the values now appear in
    # `docker inspect` and `docker compose config`, which the bind mount
    # avoided. Acceptable: both are publishable-by-design, since the Supabase
    # anon key ships inside the browser bundle and is guarded by RLS rather
    # than by secrecy. Do not add the service-role key to this file.
    #
    # Required prerequisite before `docker compose up frontend`:
    #   cp frontend/.env.local.example frontend/.env.local
    # #VERIFY: with frontend/.env.local absent, `docker compose up frontend`
    # must exit non-zero naming the two variables, AND `docker compose config`
    # and a backend-only `docker compose exec db true` must BOTH still succeed.
    env_file:
      - path: ./frontend/.env.local
        required: false
    # #CRITICAL: external-resources: `command:` below is NOT redundant with the
    # Dockerfile's CMD, and removing it breaks this service silently. Declaring
    # `entrypoint:` in compose CLEARS the image's default command, so `exec
    # "$$@"` would run with zero arguments: `exec` with no operands is a no-op,
    # the script falls off its end, and the container EXITS 0 having started no
    # dev server at all. That reads as success everywhere. The arg-count guard
    # turns that failure mode back into a loud one, so a future edit that drops
    # `command:` fails visibly instead of quietly serving nothing.
    # `$$` escapes compose interpolation: these are evaluated in the container.
    # #VERIFY: `docker compose run --rm --no-deps frontend` must keep running
    # (Vite banner), never exit 0 with empty output.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$${VITE_SUPABASE_URL}" ] || [ -z "$${VITE_SUPABASE_ANON_KEY}" ]; then
          echo "cyo_adventure-frontend: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are unset." >&2
          echo "The guardian sign-in chunk throws without them. Create the file compose reads:" >&2
          echo "  cp frontend/.env.local.example frontend/.env.local" >&2
          exit 1
        fi
        if [ "$$#" -eq 0 ]; then
          echo "cyo_adventure-frontend: no command to run. Declaring entrypoint in compose" >&2
          echo "clears the image CMD, so this service must also declare command:." >&2
          exit 1
        fi
        exec "$$@"
      - --
    # Mirrors frontend/Dockerfile's development CMD. Kept in step by the
    # arg-count guard above, which fails loudly if this is ever removed.
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Development: Mount source code for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      # #CRITICAL: external-resources: src/index.css @imports
      # '../design-system/src/*.css'. Without this mount the container serves
      # whatever design-system snapshot was baked into the image, so any
      # stylesheet added since the last `--build` makes Vite return HTTP 500
      # for src/index.css and the app renders only an HMR error overlay.
      # #VERIFY: `docker exec cyo_adventure-frontend ls /app/design-system/src`
      # must list the same .css files as ./frontend/design-system/src.
      - ./frontend/design-system:/app/design-system:ro
    depends_on:
      - app
    restart: unless-stopped

    networks:
      - cyo_adventure-network

# =============================================================================
  # Database Service (PostgreSQL)
  # =============================================================================
  db:
    image: ghcr.io/byronwilliamscpa/dhi-postgres:16-debian13
    container_name: cyo_adventure-db
    environment:
      POSTGRES_DB: cyo_adventure
      POSTGRES_USER: cyo_adventure
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    volumes:
      # Persistent data
      - postgres-data:/var/lib/postgresql/data
      # Init scripts (optional)
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyo_adventure"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - cyo_adventure-network

# =============================================================================
  # Redis Service (RQ generation queue; ADR-021 Phase 1)
  # =============================================================================
  redis:
    image: ghcr.io/byronwilliamscpa/dhi-redis:7-debian13
    container_name: cyo_adventure-redis
    command: ["redis-server", "--protected-mode", "no"]

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - cyo_adventure-network

# =============================================================================
# Volumes (Persistent Storage)
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  cyo_adventure-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

# =============================================================================
# Usage Instructions
# =============================================================================
# Development:
#   docker-compose up -d
#   docker-compose logs -f app
#   docker-compose exec app bash
#
# Production:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Rebuild after dependency changes:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f
#
# Stop services:
#   docker-compose down
#
# Clean up (including volumes):
#   docker-compose down -v
