# ZAP baseline rule configuration for .github/workflows/dast-baseline-weekly.yml
# (task D5, docs/testing/testing-improvement-plan-2026-08-27.md).
#
# Format (zap-baseline.py / zap_common.py::load_config): lines starting with
# '#' or blank are ignored; a data line is
#   <plugin_id>[,<plugin_id>...]\t<IGNORE|INFO|WARN|FAIL|OUTOFSCOPE>[\t<message>]
# tab-separated, at least two tab-separated fields. Passed to zap-baseline.py
# via -c.
#
# THIS FILE INTENTIONALLY CONTAINS ZERO DATA LINES.
#
# Every alert therefore keeps zap-baseline.py's own default: WARN. That is
# deliberate, not an oversight -- see the acceptance criterion in the task
# brief: "The acceptance criterion includes 'its findings are triaged once.'
# You cannot triage findings from a run that has not happened." Pre-loading
# IGNORE/OUTOFSCOPE entries for rules nobody has seen fire on THIS target
# would suppress the very findings the first scheduled run exists to surface,
# producing a scan that finds nothing by construction. Do not add a
# suppression here until a human has looked at an actual run's output and
# decided the finding is expected and not worth acting on; record that
# decision in the register row this task leaves for the first-run triage
# (see the workflow file's header comment for the row text), then add the
# rule here with a message citing that decision.
#
# What follows is NOT configuration; it is a prediction, written down before
# the first run per the same acceptance criterion, so the first triage pass
# can tell "expected, already understood" from "new, worth a closer look"
# without re-deriving the reasoning from scratch. If a listed rule fires,
# that is not evidence the scan is broken. If a rule fires that ISN'T listed
# below, that is the signal worth reading closely first.
#
# Target (see the workflow file for the full justification): the production
# frontend build (`npm run build && npm run preview`) proxying /api to an
# ephemeral, unauthenticated, unseeded local backend
# (`docker compose up -d --build app db`, ENVIRONMENT=local). Two response
# sources are in play, and they get different headers:
#
#   1. Vite's `preview` static file server, which serves index.html and the
#      built JS/CSS bundles. It sets no application security headers of its
#      own kind.
#   2. The FastAPI backend (proxied under /api), whose
#      `middleware/security.py::SecurityHeadersMiddleware` sets
#      X-Content-Type-Options, X-Frame-Options, X-XSS-Protection,
#      Content-Security-Policy, Referrer-Policy, and (HTTPS only)
#      Strict-Transport-Security on every response it produces.
#
# Predicted findings on source 1 (missing headers SecurityHeadersMiddleware
# would have set, had this response come from FastAPI instead of Vite's
# static server):
#   10020 (X-Frame-Options), 10021 (X-Content-Type-Options Header Missing),
#   10038 (Content Security Policy Header Not Set), 10025 (missing
#   Referrer-Policy on some vendored asset responses).
#
# Predicted findings independent of which source answered, because the app
# never sets them at all on ANY response path (grep
# `middleware/security.py::SecurityHeadersMiddleware` confirms
# Permissions-Policy is documented in the class docstring but never actually
# assigned to `response.headers`):
#   10063 (Permissions Policy Header Not Set).
#
# Predicted finding independent of source AND of this app's own code,
# because the target is plain HTTP by construction (a throwaway local
# instance, not TLS-terminated):
#   10035 (Strict-Transport-Security Header Not Set). SecurityHeadersMiddleware
# only sets HSTS for HTTPS requests, so a plain-HTTP scan target will never
# see it regardless of which backend code runs. This is a property of the
# SCAN TARGET, not a defect to chase; do not "fix" it by adding TLS to a
# throwaway CI-local stack.
#
# Predicted findings from the schema this workflow deliberately does not
# migrate (see the workflow file's "Readiness target" and corrected "What
# this CANNOT find" comments): every database-touching route (library,
# reading, profiles, and anything else that queries a real table) answers
# with a 500-class error on this target, not its normal empty/unauthenticated
# state.
#   90022 (Application Error Disclosure) is the predicted alert this
# produces, IF the error response leaks a stack trace or debug detail; the
# app's own error handlers are documented to return a sanitized message
# (core/exceptions.py, health.py's `_CHECK_FAILED_MESSAGE` pattern) rather
# than raw exception text, so this rule may fire on some routes and not
# others depending on which exception path a given 500 takes. Its absence on
# a given route is not itself a defect; its presence with LEAKED detail is
# the thing worth reading closely.
#
# Predicted observation from the SPA's own outbound calls, independent of
# this scan's rule configuration: the production build embeds
# VITE_SUPABASE_URL=https://example.supabase.co (a dummy value; see the
# workflow's "Build frontend" step), and the guardian auth chunk calls it
# directly, not through the /api proxy. Depending on how that domain
# resolves and responds from the runner, the raw ZAP report may include a
# distinct `site` entry for it alongside the `localhost:4173` entry this
# workflow's verify step filters to. That is expected and out of scope for
# this target's alert list; it is not itself a `localhost:4173` finding, and
# the verify step's `target_host` filter already excludes it from the
# summary. Do not chase it as if it were a finding about this app's own
# security posture; it is a property of the dummy build-time value, not the
# code path checked here.
#
# None of the above is pre-suppressed. Confirm each one actually appears
# (and appears where predicted) on the first real run before treating this
# list as settled; an app change could move any of these, and a mismatch
# between this list and the real output is itself worth noting in the triage.
