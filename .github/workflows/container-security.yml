# Container Security Scanning for CYO Adventure
# Scans Docker images for vulnerabilities using Trivy and lints Dockerfile with Hadolint.
#
# This is a thin caller to the org-level reusable workflow.
name: Container Security

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.trivyignore.yaml'
      - '.trivy/**'
      - 'trivy.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.trivyignore.yaml'
      - '.trivy/**'
      - 'trivy.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  # No path filter: the merge queue re-checks the merged result, and a
  # suppression that expired since the pull request was opened changes the
  # outcome without any file in the diff changing.
  merge_group:
  schedule:
    # Weekly scan on Wednesdays at 7 AM UTC
    - cron: '0 7 * * 3'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  # See ci.yml's detect-release-pr for the full rationale: release.yml's
  # propose job opens a "chore(release): vX.Y.Z" PR (branch release/v*) that
  # only ever touches pyproject.toml/uv.lock/CHANGELOG.md, which this
  # workflow's own path filters above match on every single time. This job
  # builds a real Docker image (build-image: true) to scan, the most
  # expensive step here -- skip it for release PRs (weekly schedule + the
  # next feature PR's own run remain the backstop for a `uv lock` re-resolve
  # silently picking up a newly vulnerable transitive dependency).
  detect-release-pr:
    name: Detect release-automation PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_pr: ${{ steps.check.outputs.release_pr }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check for release-automation branch/commit
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_PR=false
          case "$EVENT_NAME" in
            pull_request)
              [[ "$HEAD_REF" == release/v* ]] && RELEASE_PR=true
              ;;
            push)
              [[ "$HEAD_COMMIT_MESSAGE" == "chore(release):"* ]] && RELEASE_PR=true
              ;;
          esac
          echo "release_pr=${RELEASE_PR}" >> "$GITHUB_OUTPUT"

  container-security:
    name: Container Security Scan
    needs: detect-release-pr
    if: needs.detect-release-pr.outputs.release_pr != 'true'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@07f56c2821f88d531826cc524211be9387591a09  # v10.1.0
    with:
      dockerfile-path: 'Dockerfile'
      build-context: '.'
      image-tag: 'cyo_adventure:scan'
      build-image: true
      severity-threshold: 'CRITICAL,HIGH'
      fail-on-vulnerabilities: true
      # Scan scope by trigger (org pattern, .github PR #293). A base-image CVE
      # with no upstream patch gives a pull-request author nothing to act on, so
      # only fixable findings gate a merge. Push, schedule and manual runs keep
      # the full inventory: the SARIF upload replaces results per category and
      # ref, so a reduced-scope scan on the default branch would retire the
      # unfixed alerts under `trivy-container` until the next full run.
      ignore-unfixed: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      # Set explicitly rather than inherited. 90 is currently also the upstream
      # default, but this repository's own Release Gate Policy fixes the number
      # (docs/known-vulnerabilities.md), and scripts/check_known_vulnerabilities.py
      # enforces the same 90 on the written entries. Pinning it here means an
      # upstream default change cannot silently widen or narrow a window this
      # repository has committed to in writing.
      ignore-expiry-horizon-days: 90
      # #CRITICAL: security: this job checks out ByronWilliamsCPA/.github and
      # EXECUTES a Python script from it inside our CI. The input defaults to
      # `main`, a moving ref, which would hand a floating third party arbitrary
      # code execution in this workflow and give back most of the assurance the
      # SHA-pinned `uses:` above buys. Pinned to the same commit as that pin.
      # #VERIFY: this SHA must match the `uses:` ref above on every bump.
      central-checker-ref: 07f56c2821f88d531826cc524211be9387591a09
      run-hadolint: true
      hadolint-failure-threshold: 'warning'
      generate-sbom: true
      upload-sarif: true
      artifact-retention-days: 90
    secrets: inherit
