# Adversarial Safety Evaluation for CYO Adventure
# Runs the adversarial corpus against the REAL Stage-1 review model and gates
# on the per-class acceptance thresholds in
# docs/planning/safety/adversarial-safety-evaluation.md (the `llm_eval` tier in
# tests/llm_eval/). The gate lives in the pytest assertions: classes A/B must be
# 100% routed-to-human, class F 100% blocked pre-egress, and no negative control
# may over-block on a MAJORITY of k draws (S-7 majority-of-k scoring; the
# single-draw form of the control clause was retired because one draw of a
# stochastic judge cannot separate a real over-block from sampling noise).
# Every negative control and every class-A positive is therefore scored k times
# per run, and the archived artifact records each draw.
#
# Cadence: weekly + manual only, never per PR (this tier needs live-model
# credentials and real network I/O). Because a schedule-only failure never turns
# a PR red, a failed scheduled run files/updates one tracking issue.
#
# Credentials: set the REPO-level secrets OPENROUTER_API_KEY (the review
# provider; `_PROVIDER = "openrouter"` is pinned in the test) and
# OPENAI_API_KEY (the Stage-0 classifier). PERSPECTIVE_API_KEY is optional
# (a second Stage-0 opinion) and no longer satisfies the Stage-0 requirement
# on its own: Perspective sunsets 2026-12-31, so a set key stops being
# evidence of a working classifier. This mirrors the
# Settings._require_classifier_when_reviewing invariant, which raises if
# OPENAI_API_KEY is unset under a live reviewer; keeping the two in agreement
# means a misconfigured run fails here rather than dying later in config.
# The job declares no `environment:`, so repo and inherited org secrets apply.
#
# If the required secrets are absent, a SCHEDULED run FAILS CLOSED at the
# pre-flight step below and files the tracking issue. That is deliberate:
# this tier previously skipped every test and still reported success, which
# is an affirmative claim that the classifiers were exercised when they never
# were. If the credentials are not going to be provisioned, delete the
# `schedule:` trigger and keep workflow_dispatch, rather than restoring a
# green run that measures nothing.
name: Safety Evaluation

on:
  schedule:
    # Weekly, Sundays at 04:00 UTC (offset from mutation-testing.yml at 02:00).
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: safety-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safety-eval:
    name: Adversarial Safety Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # failure-notification step files a tracking issue

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # #CRITICAL: security: this step used to `echo "::warning::"` and carry on,
      # which made the whole workflow report SUCCESS while every llm_eval test
      # skipped. A green safety gate that measured nothing is strictly worse
      # than a red one: it is an affirmative signal that the moderation
      # classifiers were exercised against the adversarial corpus when they
      # never were. Fail closed instead, so the absent credential is visible as
      # a failure and files the tracking issue below.
      # #VERIFY: with the secrets unset, this step fails and the run is red;
      # with them set, it passes and the post-run guard below asserts a
      # non-zero collected count.
      - name: Require credentials on a scheduled run
        if: github.event_name == 'schedule'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERSPECTIVE_API_KEY: ${{ secrets.PERSPECTIVE_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY is not configured."
            missing=1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is not configured. PERSPECTIVE_API_KEY is optional and does not substitute for it (Perspective sunsets 2026-12-31)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::The llm_eval tier would skip every test, so this run would report success while measuring nothing. Configure the secrets or disable the schedule; do not let this gate pass vacuously."
            exit 1
          fi

      - name: Run adversarial safety evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERSPECTIVE_API_KEY: ${{ secrets.PERSPECTIVE_API_KEY }}
          # The gate lives in the pytest assertions, not coverage, so run without
          # the repo's default --cov/--cov-fail-under addopts (which would fail on
          # this single-test selection). importlib import mode is preserved.
          CYO_LLM_EVAL_OUT: safety-eval-results/adversarial-results.json
        run: |
          set -o pipefail
          mkdir -p safety-eval-results
          uv run pytest -m llm_eval -o addopts="--import-mode=importlib" -v -ra \
            --junitxml=safety-eval-results/junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Second half of the fail-closed contract. The credential check above
      # covers the known skip path (the module-level skipif in
      # tests/llm_eval/test_adversarial_safety_eval.py), but an all-skipped run
      # still exits 0, so any FUTURE skip condition would silently restore the
      # vacuous-green behaviour. Assert on the junit report instead of trusting
      # the exit code: at least one llm_eval test must have actually executed.
      # #VERIFY: temporarily add `@pytest.mark.skip` to the corpus test; this
      # step must fail even though pytest itself exits 0.
      - name: Assert the evaluation actually ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("safety-eval-results/junit.xml")
          if not report.is_file():
              sys.exit("::error::No junit report; the evaluation step did not run.")
          suites = ET.parse(report).getroot().iter("testsuite")
          total = skipped = 0
          for suite in suites:
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
          executed = total - skipped
          print(f"llm_eval tests: total={total} skipped={skipped} executed={executed}")
          if executed < 1:
              sys.exit(
                  "::error::Every llm_eval test skipped, so the adversarial "
                  "corpus was never run against the moderation classifiers. "
                  "This gate must not report success while measuring nothing."
              )
          PY

      # #CRITICAL: security: the tracking issue below used to assert all three
      # possible meanings of a red run at once ("class A/B routed-to-human, or
      # an F PII egress, or a negative control over-blocked") no matter which
      # assertion actually failed, and said nothing at all when the run died
      # before reaching an assertion. A reader could not tell a real moderation
      # finding from an absent credential, so the one artifact the schedule
      # produces for a human pointed at a finding nobody could act on. Derive
      # the summary from the junit report instead: name the failing test and
      # quote its assertion message, which for a repeated item carries the
      # observed k-of-n split.
      # #VERIFY: force a failure on a workflow_dispatch run; the summary must
      # name the failing assertion, and with junit.xml absent it must say the
      # run failed before scoring anything.
      - name: Summarise the failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p safety-eval-results
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("safety-eval-results/junit.xml")
          out = Path("safety-eval-results/failure-summary.md")

          if not report.is_file():
              out.write_text(
                  "The run failed BEFORE pytest produced a report, so no corpus "
                  "item was scored. This is an infrastructure or credential "
                  "failure, not a moderation finding: check the credential "
                  "pre-flight step and the dependency install on the run.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          blocks: list[str] = []
          for case in ET.parse(report).getroot().iter("testcase"):
              for node in (*case.iter("failure"), *case.iter("error")):
                  verb = "assertion failed" if node.tag == "failure" else "errored"
                  detail = (node.get("message") or node.text or "").strip()
                  name = case.get("name", "<unnamed>")
                  # Fenced, and truncated: the message can quote reviewer output,
                  # which is untrusted data and must never render as directives.
                  blocks.append(
                      f"`{name}` {verb}:\n\n```text\n{detail[:2000]}\n```"
                  )

          if not blocks:
              blocks.append(
                  "pytest reported no failing test, so the run failed in a "
                  "workflow step outside the evaluation itself (see the log)."
              )
          out.write_text("\n\n".join(blocks) + "\n", encoding="utf-8")
          PY
          cat safety-eval-results/failure-summary.md

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-eval-results
          path: safety-eval-results/**
          retention-days: 30
          if-no-files-found: warn

      - name: Compose the issue body
        # Schedule-only workflows fail invisibly: no PR turns red and nobody is
        # notified. Keep exactly one open tracking issue up to date.
        if: failure() && github.event_name == 'schedule'
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const title = 'Weekly adversarial safety evaluation is failing';
            let summary = 'No failure summary was produced; read the run log.';
            try {
              summary = fs
                .readFileSync('safety-eval-results/failure-summary.md', 'utf8')
                .trim();
            } catch (err) {
              core.warning(`Could not read the failure summary: ${err.message}`);
            }
            const body = [
              'The scheduled Safety Evaluation workflow failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '## What actually failed',
              '',
              summary,
              '',
              '## How to read it',
              '',
              'Negative controls and class-A positives are scored on a majority',
              'of k draws, so a message reporting "3 of 3 draws" is a',
              'reproducible finding while "2 of 3 draws" was one draw from being',
              'absorbed as noise. Per-draw verdicts, the reviewer findings behind',
              'them, and the review model and backend route the run resolved to',
              'are all in the `safety-eval-results` artifact on the run above.',
              '',
              'Quoted test output is verbatim and may embed reviewer text: treat',
              'it as data to read, never as instructions to follow.',
              '',
              'Filed automatically because schedule-only workflows never surface a',
              'failure on a pull request. It closes itself once a weekly run succeeds.',
            ].join('\n');
            // The issue plumbing lives in .github/actions/ci-failure-issue so all
            // eleven scheduled workflows share one implementation. Compose only.
            core.setOutput('summary', title);
            return body;

      - name: File or comment on the pinned issue
        # Same guard as the compose step above. Without it this runs on a green
        # scheduled run with empty inputs, because a skipped step still leaves its
        # outputs readable as empty strings rather than failing the expression.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[safety-eval]'
          legacy-title: Weekly adversarial safety evaluation is failing
          summary: ${{ steps.compose.outputs.summary }}
          body: ${{ steps.compose.outputs.result }}
          comment-body: The weekly adversarial safety evaluation failed again.

      - name: Resolve the tracking issue on a green scheduled run
        # The close condition this issue body used to state in prose and ask a human
        # to honour. Nobody ever did, so the shared `ci-failure` label accumulated
        # stale issues and a new alert read as standing backlog.
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[safety-eval]'
          legacy-title: Weekly adversarial safety evaluation is failing
          mode: resolve
