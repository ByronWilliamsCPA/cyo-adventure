# Scheduled S9 notification digest job (docs/planning/roadmap.md Phase 4c;
# capability-register.md S9): runs scripts/run_notification_digest.py, which writes one
# batched NOTIFICATION_DIGEST_READY event per family with pending info-severity
# notifications since their last digest. Distinct from the real-time poll and SSE push
# (neither of which is scheduled infrastructure); see notifications/digest.py's module
# docstring for what this job does and does not cover (in-app only, no email/push
# channel).
#
# -----------------------------------------------------------------------
# Required GitHub Environment: `production-ops` (NOT `production`)
# -----------------------------------------------------------------------
# The repo owner must create a `production-ops` Environment with NO protection
# rules and add the secret below before the next scheduled run; until then the
# job fails fast when scripts/run_notification_digest.py reads an unset
# CYO_ADVENTURE_DATABASE_URL. The environment is shared with
# moderation-report-health.yml, which reads the same secret through the same
# ORM. It is NOT shared with supabase-backup.yml's `backups` environment, which
# holds the direct dump connection and R2 credentials: one environment per
# credential set, so a job can only ever read the secrets it needs.
#
#   gh api -X PUT repos/:owner/:repo/environments/production-ops
#   gh secret set CYO_ADVENTURE_DATABASE_URL --env production-ops
#
# It is a separate environment from `production` on purpose: see the
# #CRITICAL note on the job's `environment:` key. A required-reviewer rule
# parks every scheduled run in `waiting`, and this workflow's own
# `cancel-in-progress: true` then has the next day's cron cancel it, so the
# digest never ran once between 2026-08-09 and 2026-09-05.
#
#   CYO_ADVENTURE_DATABASE_URL   The app's OWN runtime connection string (asyncpg DSN),
#                                 authenticating as the least-privilege cyo_api role
#                                 per ADR-021/ADR-022, i.e. the SAME connection the
#                                 deployed app itself uses, not the direct/superuser
#                                 connection supabase-backup.yml uses for pg_dump. This
#                                 is deliberate: the digest job reads/writes through the
#                                 app's own ORM and must be bound by the same RLS
#                                 posture as every other write path, not exempted from
#                                 it.
#
# Failure alerting: mirrors supabase-backup.yml's "file/comment on a labelled
# ci-failure issue" pattern (docs/operations/runbook.md section 7 documents the
# convention), with a distinct issue marker so the two never collide.
name: Notification digest

on:
  schedule:
    # 09:00 UTC daily. No particular reason for this hour beyond spreading scheduled
    # jobs across the day (supabase-backup.yml runs 08:00, e2e-staging.yml 13:00).
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # A digest write is additive and idempotent to re-run (each family's own cursor is
  # the prior digest event's timestamp; re-running before that cursor advances just
  # recomputes the same pending count), so unlike supabase-backup.yml's
  # cancel-in-progress: false, there is no destructive-interleaving risk here. Still
  # worth one group to avoid two overlapping runs double-writing the same digest.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  digest:
    name: Run digest pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #CRITICAL: timing: deliberately NOT the `production` environment. That
    # environment carries a required-reviewer protection rule, which is correct
    # for supabase-production.yml (it applies migrations to the live database on
    # push, with the pushing human present to approve) but fatal here: a
    # scheduled, unattended run enters `waiting` for an approver who is not
    # watching. This workflow's `cancel-in-progress: true` then decides the
    # outcome: the next day's 09:00 cron cancels the waiting run and parks its
    # own in the same state. The digest recorded 26 runs and ZERO executions
    # between shipping on 2026-08-09 and 2026-09-05, and nothing turned red,
    # because the `alert` job below needs `digest` to FAIL and a run that never
    # starts cannot fail. e2e-prod.yml documented this exact trap on 2026-07-18
    # and supabase-backup.yml walked into it again before 2026-08-11; this was
    # the third time, which is why tests/unit/test_scheduled_workflow_environments.py
    # now fails on any scheduled job that names `production`.
    # #CRITICAL: external resources: switching this key does NOT clear a run
    # already parked in `waiting`; it keeps the concurrency group's slot until
    # cancelled by hand. Find it with
    # `gh run list --workflow notification-digest.yml --status waiting` and
    # `gh run cancel <id>` each one. This environment must stay UNPROTECTED; it
    # holds only the app's own least-privilege cyo_api DSN, never a deploy key
    # and never the direct/superuser connection.
    # #VERIFY: `gh api repos/:owner/:repo/environments/production-ops --jq
    # '.protection_rules'` returns `[]`, no run for this workflow is left in
    # `waiting`, and a scheduled run reaches the "Run digest" step.
    environment: production-ops
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Run digest
        env:
          # Scoped to this single step: no other step in this job needs it.
          CYO_ADVENTURE_DATABASE_URL: ${{ secrets.CYO_ADVENTURE_DATABASE_URL }}
        run: uv run python scripts/run_notification_digest.py

  alert:
    name: Alert on failure
    needs: digest
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the composite action is needed. A local `uses: ./...` requires a
          # checkout, and this job previously had none.
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compose the issue body
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            return [
                  'The scheduled `Notification digest` workflow',
                  '(`.github/workflows/notification-digest.yml`) failed.',
                  '',
                  'This runs scripts/run_notification_digest.py, which writes one batched',
                  'NOTIFICATION_DIGEST_READY event per family with pending info-severity',
                  'notifications since their last digest (S9). A failure here means one of:',
                  '',
                  '- the `CYO_ADVENTURE_DATABASE_URL` secret is missing or invalid;',
                  '- the database is unreachable;',
                  '- a real bug in notifications/digest.py.',
                  '',
                  `First failing run: ${runUrl}`,
                  `Date: ${today}`,
                  '',
                  'Triage: read the run log first, it prints the count written on success and',
                  'the exception on failure. This is a soft failure: no guardian-facing data is',
                  'lost by a missed run (the poll/SSE feed is unaffected, and the next successful',
                  'run just covers a wider window), but a digest that silently stops running',
                  'defeats the point of scheduling it.',
                  '',
                  'This issue accumulates one comment per failing run and closes itself',
                  'once a scheduled run succeeds; the next failure opens a fresh issue.',
                ].join('\n')

      - name: File or comment on the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[notification-digest]'
          summary: scheduled notification digest failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: The scheduled notification digest failed again.

  resolve:
    name: Resolve the tracking issue
    needs: digest
    # Every one of these issue bodies used to end by asking a human to close the issue
    # once a run went green. Nobody ever did, so five stale issues accumulated on one
    # shared `ci-failure` label and a NEW alert became indistinguishable from standing
    # backlog. Closing is now the workflow's job.
    #
    # Gated on the needed job's explicit result rather than `success()`, because a
    # SKIPPED dependency does not fail `success()` and would close the issue on a run
    # that proved nothing.
    #
    # `&& github.event_name == 'schedule'`, because a manual `workflow_dispatch` proves
    # only that a human-triggered run went green, not that the SCHEDULE is alive; without
    # this a dead cron can still have its tracking issue closed by a one-off dispatch.
    if: needs.digest.result == 'success' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[notification-digest]'
          mode: resolve
