# Performance Regression Tests for CYO Adventure
# Runs the in-process perf tier (tests/perf/, the `perf` marker) which pins the
# complexity class of algorithmic hot paths with generous budgets. This is NOT
# the deployment load test: the capacity baseline against hosted infra is P9-13
# (docs/planning/PROJECT-PLAN.md), recorded in docs/planning/capacity-baseline.md.
#
# Cadence: weekly + manual only, never per PR. The tests are opt-in via
# CYO_RUN_PERF=1 (they skip everywhere else), so the PR gate never runs them and
# never flakes on runner jitter. A schedule-only failure files/updates one
# tracking issue since no PR turns red.
name: Performance

on:
  schedule:
    # Weekly, Sundays at 06:00 UTC (offset from mutation 02:00 and safety 04:00).
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # failure-notification step files a tracking issue

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run performance regression tests
        env:
          # Opt in to the perf tier; run without the repo's default
          # --cov/--cov-fail-under addopts (which would fail on this selection).
          CYO_RUN_PERF: '1'
        run: |
          set -o pipefail
          uv run pytest -m perf -o addopts="--import-mode=importlib" -v -ra \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: File tracking issue on scheduled failure
        # Schedule-only workflows fail invisibly: no pull request turns red, so this
        # issue IS the notification. The shared action keeps exactly one open issue
        # per workflow and ASSIGNS it: a comment on an unassigned bot-filed issue
        # notifies nobody, which is how a live outage went unread for twelve days.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[perf]'
          legacy-title: Weekly performance regression run is failing
          summary: weekly performance regression run is failing
          body: |
            The scheduled Performance workflow failed.


            A failure here means a hot path exceeded its generous complexity budget:
            likely a super-linear regression, since the budgets have a wide margin over
            normal runner jitter.

            Filed automatically because schedule-only workflows never surface a failure
            on a pull request. It closes itself once a weekly run succeeds.

      - name: Resolve the tracking issue on a green scheduled run
        # The close condition every one of these issue bodies stated in prose and
        # asked a human to honour. Nobody ever did, so the label only grew and a new
        # alert became indistinguishable from standing backlog.
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[perf]'
          legacy-title: Weekly performance regression run is failing
          mode: resolve
