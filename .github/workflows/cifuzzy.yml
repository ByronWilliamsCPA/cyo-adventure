# CYO Adventure - Continuous Fuzzing
# ClusterFuzzLite workflow for automated security testing
#
# This workflow uses Google's ClusterFuzzLite to continuously fuzz test
# the codebase for vulnerabilities, crashes, and edge cases.
#
# Fuzzing Targets (see fuzz/README.md):
#   - fuzz_condition_evaluator: the storybook condition DSL gate + evaluator
#   - fuzz_storybook_validation: Storybook.model_validate on raw LLM output
#
# Duration: 600 seconds per run
# Sanitizer: AddressSanitizer for memory safety
# Reporting: SARIF format uploaded as a workflow artifact (GitHub Advanced
#   Security / Code Security is not active on this repo, so results no
#   longer go to the Security tab)
name: Continuous Fuzzing

on:
  # Fuzzing is heavy; run it on a weekly schedule and on demand only, not on
  # every push or pull request. (Matches the AMC/cifuzzy.yml reference.)
  schedule:
    # Mondays at 07:13 UTC (off-peak minute to avoid scheduler contention).
    - cron: '13 7 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  issues: write  # failure-notification step files a tracking issue

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: ClusterFuzzLite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for fuzz targets
        id: check-fuzz
        run: |
          if [ -d "fuzz" ] && [ -n "$(find fuzz -name '*.py' -type f 2>/dev/null)" ]; then
            echo "has-targets=true" >> $GITHUB_OUTPUT
          else
            echo "has-targets=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No fuzz targets found in fuzz/ directory. Skipping fuzzing." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Fuzzers
        if: steps.check-fuzz.outputs.has-targets == 'true'
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{  matrix.sanitizer  }}

      - name: Run Fuzzers
        if: steps.check-fuzz.outputs.has-targets == 'true'
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{  secrets.GITHUB_TOKEN  }}
          fuzz-seconds: 600
          mode: 'code-change'
          sanitizer: ${{  matrix.sanitizer  }}
          output-sarif: true

      - name: Upload SARIF artifact
        # Only upload when a SARIF was actually produced. ClusterFuzzLite emits the
        # file only when the fuzz run finds a crash; with no crash it is absent and
        # an unconditional upload fails on the missing path.
        # GitHub Advanced Security (Code Security) is not active on this repo, so
        # SARIF no longer reaches the Security tab; publish it as a plain artifact
        # instead so a crash finding stays downloadable.
        #
        # #ASSUME: external resources: the path below is upstream-defined, not ours.
        # run_fuzzers passes OUTPUT_SARIF into its container and declares NO action
        # outputs, so there is no `steps.run.outputs.*` to read the location from.
        # The container writes `<workspace>/cifuzz-sarif/results.sarif`, where
        # workspace is $GITHUB_WORKSPACE:
        #   oss-fuzz infra/cifuzz/workspace_utils.py   Workspace.sarif -> cifuzz-sarif
        #   oss-fuzz infra/cifuzz/sarif_utils.py       writes results.sarif into it
        #   oss-fuzz infra/cifuzz/platform_config/github.py  workspace = GITHUB_WORKSPACE
        # A bare `results.sarif` here matches nothing, so the guard is always false
        # and this step silently never runs. Do not "simplify" the path back.
        # #VERIFY: on the first crash-finding run, confirm the artifact is attached;
        # a [fuzzing] issue with no SARIF artifact means the path drifted again.
        if: >-
          always() && steps.check-fuzz.outputs.has-targets == 'true'
          && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzing-sarif-${{  matrix.sanitizer  }}
          path: cifuzz-sarif/results.sarif
          retention-days: 90

      - name: Upload Crash Artifacts
        if: failure() && steps.check-fuzz.outputs.has-targets == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzing-crashes-${{  matrix.sanitizer  }}
          path: build/out/
          retention-days: 7

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "## Fuzzing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Sanitizer**: ${{  matrix.sanitizer  }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: 600 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{  steps.build.outcome  }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Status**: ${{  steps.run.outcome  }}" >> $GITHUB_STEP_SUMMARY

      - name: File tracking issue on scheduled failure
        # Schedule-only workflows fail invisibly: no pull request turns red, so this
        # issue IS the notification. The shared action keeps exactly one open issue
        # per workflow and ASSIGNS it: a comment on an unassigned bot-filed issue
        # notifies nobody, which is how #667 sat unread for seventeen days.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[fuzzing]'
          summary: weekly fuzzing run is failing
          body: |
            The scheduled Continuous Fuzzing workflow failed (sanitizer:
            ${{ matrix.sanitizer }}).


            A failing fuzz run either found a crash (see the
            fuzzing-sarif-${{ matrix.sanitizer }} and
            fuzzing-crashes-${{ matrix.sanitizer }} artifacts on the run) or the
            harness build broke.

            Filed automatically because schedule-only workflows never surface a failure
            on a pull request. It closes itself once a weekly run succeeds.
          # Recurrence comments must still name what failed (testing-improvement-plan
          # row A7): the pre-PR version of this step reused the same sanitizer-naming
          # body on every comment, and a bare "This failed again." default regressed
          # that. Restore the sanitizer detail here rather than dropping it.
          comment-body: |
            The scheduled Continuous Fuzzing workflow failed again (sanitizer:
            ${{ matrix.sanitizer }}).

            A failing fuzz run either found a crash (see the
            fuzzing-sarif-${{ matrix.sanitizer }} and
            fuzzing-crashes-${{ matrix.sanitizer }} artifacts on the run) or the
            harness build broke.

      - name: Resolve the tracking issue on a green scheduled run
        # The close condition every one of these issue bodies stated in prose and
        # asked a human to honour. Nobody ever did, so the label only grew and a new
        # alert became indistinguishable from standing backlog.
        #
        # `steps.check-fuzz.outputs.has-targets == 'true'` on top of that: when
        # fuzz/ is missing or empty the Build/Run Fuzzers steps SKIP, `success()`
        # is still true, and nothing was actually fuzzed. A green run that skipped
        # the work is not evidence the work succeeded, so it must not resolve the
        # `[fuzzing]` tracking issue.
        if: success() && github.event_name == 'schedule' && steps.check-fuzz.outputs.has-targets == 'true'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[fuzzing]'
          mode: resolve
