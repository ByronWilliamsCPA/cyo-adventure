# Cross-device/cross-browser e2e (frontend/e2e/cross-device.spec.ts).
#
# A dedicated workflow, not a step in ci.yml's `frontend` job, for one
# concrete reason: `playwright install --with-deps firefox webkit` apt-
# installs a much larger dependency set (gstreamer, libavcodec, etc.) than
# chromium alone, and doing that inline in the `frontend` job pushed its
# existing 15-minute timeout -- the job was killed mid-apt-install, before a
# single test ran, the first time this was tried. Isolating it here gives the
# browser installs their own timeout budget without risking the fast lint/
# typecheck/build/mocked-e2e job that every PR depends on.
#
# Informational, NOT a merge gate, same posture as e2e-real-pr-smoke.yml: this
# is new coverage (added 2026-07-24) whose per-PR reliability under a
# potentially slow apt mirror isn't proven yet. Triggers on `pull_request`
# only (no `merge_group`), and is not listed in branch-protection required
# checks. A red run is a visible signal to investigate, not a block. Promote
# to a required check later once its flakiness rate is known to be
# acceptable.
#
# Path-filtered to frontend changes (plus this file and the Playwright
# config), so docs-only and backend-only PRs don't pay this tier's cost.
name: E2E (cross-device/cross-browser)

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/cross-device-e2e.yml'

permissions:
  contents: read

concurrency:
  group: cross-device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-device:
    name: Playwright (cross-device/cross-browser)
    runs-on: ubuntu-latest
    # Generous relative to the ~2min a chromium-only install/run takes:
    # firefox + webkit's apt dependency set is large and this budget must
    # absorb a slow mirror day, not just the happy path.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium + firefox + webkit)
        run: npx playwright install --with-deps chromium firefox webkit

      # Pixel 7 (chromium) + iPad gen 7 / iPhone 14 (webkit) + Desktop
      # Firefox, each running e2e/cross-device.spec.ts's structural
      # (no-pixel-diff) checks. See the cross-device-*/cross-browser-*
      # projects in playwright.config.ts.
      - name: E2E (Playwright, cross-device/cross-browser tier)
        run: npm run test:e2e:cross-device

      - name: Upload Playwright trace on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-device-e2e-traces
          path: frontend/test-results/
          retention-days: 7
