# Skeleton promotion gate (WS-8 D4, design 4.3 point 4 / stage S7)
#
# Repo enforcement for the catalog flywheel's automation boundary. On any PR that
# touches skeletons/**, re-prove every changed skeleton shell from scratch:
# check_skeleton (gate/cell/envelope), check_theme_contract (when a contract
# sidecar is present), the WS-5 anti-clone floor, and verify_bundle-equivalent
# lineage/hash validation. A hand-tampered or stale bundle cannot ride an
# otherwise-green PR.
#
# "Every changed skeleton" is literal: no shell is filtered out of the prover's
# argv. A hand-authored original (no mutation lineage sidecar) still faces
# gate/cell/envelope and the theme contract; only the two parent-relative legs
# are skipped for it, by the prover, which logs that it did.
#
# A changed *.contract.json is not a shell and cannot be re-proven from scratch,
# so it is collected separately and validated by its own step. Without that leg,
# a PR that rewrites only theme contracts filtered every changed file out of the
# shell list, and both downstream steps skipped while the check reported green:
# the one validation that would have exercised those contracts was reachable
# only through a changed shell.
#
# The skeleton-promotion LABEL must never be auto-merged (ADR-020 decision 4; the
# release workflow's auto-merge precedent makes this a real hazard). The
# no-auto-merge job fails a labeled PR that has auto-merge enabled, so no
# label-based automation can silently merge a promotion.
name: Skeleton Promotion

on:
  pull_request:
    # auto_merge_enabled/auto_merge_disabled are included so the no-auto-merge
    # guard re-runs when auto-merge is toggled after the PR is opened; without
    # them a promotion PR could have auto-merge enabled post-check and slip past.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - auto_merge_enabled
      - auto_merge_disabled
    branches: [main, master]
    paths:
      - "skeletons/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prove-bundle:
    name: Re-prove promoted skeletons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit present so the changed-file diff resolves.
          fetch-depth: 0
          # This job only reads the tree; no pushes or credentialed git ops, so
          # the persisted token is unnecessary attack surface (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Importing cyo_adventure pulls SQLAlchemy in transitively (diversity), so
      # the `api` extra is required to import the package at all, mirroring the
      # `diversity` and `contract` jobs in ci.yml.
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Collect changed skeleton files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only added/modified (not deleted) skeleton files are proved. Fail
          # closed: if the diff cannot resolve, the prover must not be skipped.
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'skeletons/**' \
            > changed-all.txt
          # EVERY changed shell is proved, with no exceptions decided here.
          # Whether a shell has mutation lineage is the prover's business:
          # check_promotion_bundle.py runs gate/cell/envelope and the theme
          # contract unconditionally and skips only the parent-hash and
          # anti-clone-floor legs for a hand-authored original, logging that it
          # did. Deciding it at THIS layer instead silently dropped three
          # checks rather than two, and because --diff-filter=AM includes added
          # files, a brand-new hand-authored skeleton was skipped by
          # construction. Sidecars are the only files dropped from the shell
          # list; a .contract.json is not dropped from the job, it is routed to
          # its own step below, because the prover reaches a contract only
          # through a changed shell. Keep this list in sync
          # with SIDECAR_SUFFIXES in generation/skeleton.py: a sidecar suffix
          # missing here is handed to the prover as if it were a shell, which
          # is how .narrative.json first failed this job.
          : > changed-skeletons.txt
          : > changed-contracts.txt
          while IFS= read -r f; do
            case "$f" in
              *.contract.json) echo "$f" >> changed-contracts.txt ;;
              *.lineage.json|*.narrative.json) continue ;;
              *.json) echo "$f" >> changed-skeletons.txt ;;
            esac
          done < changed-all.txt
          # check_theme_contract takes the SHELL path and derives the sidecar
          # itself (generation.binding.contract_path_for), so each changed
          # contract is mapped back to its shell. A shell already on the prove
          # list runs check_theme_contract inside check_promotion_bundle, so it
          # is dropped here rather than validated twice.
          : > contract-shells.txt
          while IFS= read -r c; do
            shell="${c%.contract.json}.json"
            if grep -qxF "$shell" changed-skeletons.txt; then
              continue
            fi
            echo "$shell" >> contract-shells.txt
          done < changed-contracts.txt
          echo "count=$(wc -l < changed-skeletons.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "contract_count=$(wc -l < contract-shells.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed skeleton shells to prove:"; cat changed-skeletons.txt
          echo "Changed theme contracts to validate (listed by their shell):"
          cat contract-shells.txt

      - name: Re-prove changed skeletons from scratch
        if: ${{ steps.changed.outputs.count != '0' }}
        run: |
          # The prover filters sidecars itself, and decides per shell which
          # legs apply; passing the raw changed list is safe.
          # Read newline-delimited paths into an array so each is a single quoted
          # argument (no word-splitting on spaces, no glob expansion).
          mapfile -t changed_skeletons < changed-skeletons.txt
          uv run python scripts/check_promotion_bundle.py "${changed_skeletons[@]}"

      # The contract-only leg. A contract whose shell also changed is not
      # listed here; check_promotion_bundle already ran this same check for it.
      - name: Validate changed theme contracts
        if: ${{ steps.changed.outputs.contract_count != '0' }}
        run: |
          set -uo pipefail
          # Every contract is validated before the step exits, so one bad
          # sidecar cannot hide the rest; a single failure still fails the step.
          status=0
          while IFS= read -r shell; do
            if [ ! -f "$shell" ]; then
              # #CRITICAL: data integrity: a contract sidecar whose shell is
              # gone cannot be validated by anything, so fail rather than skip.
              # #VERIFY: exercised by deleting a shell while editing its
              # .contract.json in the same PR.
              echo "::error::${shell} is missing but its theme contract changed;" \
                "a contract without its shell cannot be validated."
              status=1
              continue
            fi
            echo "::group::check_theme_contract ${shell}"
            uv run python scripts/check_theme_contract.py "$shell" || status=1
            echo "::endgroup::"
          done < contract-shells.txt
          exit "$status"

      # Adding a skeleton invalidates two committed derived artifacts, and both
      # went stale unnoticed once already: the mutation-floor baseline (which
      # left a required check red on main) and the generated skeleton catalog
      # plus its diagrams (which is the index an author consults to ask what is
      # already in a cell). This is the natural home for the guards, since the
      # workflow already triggers on paths: skeletons/**. This stays gated on
      # the shell count: both generators skip sidecars outright (see the sidecar
      # skips in render_skeleton_diagrams.py and calibrate_mutation_floors.py),
      # so a contract-only change cannot stale either artifact.
      - name: Derived artifacts must be current
        if: ${{ steps.changed.outputs.count != '0' }}
        run: |
          uv run python scripts/calibrate_mutation_floors.py --check
          uv run python scripts/render_skeleton_diagrams.py --check

  no-auto-merge:
    name: Enforce no auto-merge on skeleton-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: contains(github.event.pull_request.labels.*.name, 'skeleton-promotion')
    permissions:
      contents: read
      # pull-requests: read lets `gh api repos/.../pulls/N` read the auto_merge
      # field on this PR; no write scope is granted, the guard only inspects.
      pull-requests: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Fail if auto-merge is enabled on a promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # A skeleton-promotion PR is human-merge-only (ADR-020 decision 4). If
          # any tooling enabled auto-merge, fail loudly so it cannot land unattended.
          AUTO_MERGE="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.auto_merge')"
          echo "auto_merge=${AUTO_MERGE}"
          if [ "$AUTO_MERGE" != "null" ] && [ -n "$AUTO_MERGE" ]; then
            echo "::error::Auto-merge is enabled on a skeleton-promotion PR;" \
              "promotion is human-merge-only (ADR-020 decision 4). Disable auto-merge."
            exit 1
          fi
          echo "No auto-merge enabled; a human must review and merge this promotion."
