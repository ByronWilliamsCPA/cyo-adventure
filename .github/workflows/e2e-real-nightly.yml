# Nightly real-backend E2E workflow (test-traceability-matrix.md, "Actions to
# reach the bar" #6: "Wire e2e-real into a nightly CI job... rather than
# leaving it developer-memory-only; keep it out of the PR path for speed.
# This also absorbs the S2 conflict-race handoff once that spec lands.").
#
# Builds a throwaway real stack (Postgres service container, migrated with
# the real Supabase migration chain and seeded with scripts/seed_dev_data.py,
# same as ci.yml's api-tests job) and a real uvicorn process, then runs the
# `real-backend` Playwright project (frontend/e2e-real/, zero route mocks)
# against it, including the new S2 conflict-race spec
# (offline-conflict-real.spec.ts). Kept off the PR path deliberately: this
# tier needs a live Postgres plus a full frontend build+preview cycle and
# would slow every PR for coverage that is not required to merge.
#
# Scheduled 09:30 UTC: offset from e2e-staging.yml's `0 13 * * *` (PR #268,
# not yet merged to this branch) and e2e-prod.yml's `30 13 * * *` so none of
# the three scheduled E2E tiers start in the same minute.
#
# -----------------------------------------------------------------------
# Redis: not required to boot (decision recorded here, not assumed)
# -----------------------------------------------------------------------
# #ASSUME: external-resources: core/config.py's redis_url has a working
# default and nothing in app.py or api/health.py opens a Redis connection at
# import/startup time (api/health.py's check_cache is a documented
# placeholder that never pings Redis). RateLimitMiddleware defaults to the
# "redis" backend but always falls back to an in-memory counter on a Redis
# error (rate_limit_redis_timeout_seconds bounds the added latency to 0.5s,
# only until the 5s cooldown kicks in), so the app boots and serves requests
# fine with no Redis running at all. This job runs a Redis service anyway:
# the cost is negligible and it removes that per-request fallback latency
# and the (currently unused by e2e-real, but future-proofing) RQ generation
# queue's dependency, matching the commented-out `redis:7-alpine` service in
# docker-compose.yml.
# #VERIFY: if RateLimitMiddleware's fallback behavior ever changes to a hard
# failure without Redis, this service becomes load-bearing instead of
# defensive; re-read middleware/security.py before removing it.
# -----------------------------------------------------------------------
name: E2E (real backend, nightly)

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Unlike e2e-prod.yml/e2e-staging.yml, this tier owns no shared external
  # resource (its Postgres/Redis are fresh per-run service containers, and
  # it authenticates no real account), so canceling a stale run in favor of
  # a newer one is safe.
  group: e2e-real-nightly
  cancel-in-progress: true

jobs:
  e2e-real:
    name: Playwright (real-backend tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    services:
      db:
        # The standard image (not the ghcr.io/byronwilliamscpa/dhi-postgres
        # hardened variant docker-compose.yml uses) because GitHub Actions
        # `services:` containers cannot run the setup steps (role creation,
        # migrations) docker-compose's `depends_on: condition: service_healthy`
        # plus a separate exec step provide.
        #
        # #ASSUME: external-resources: this comment previously claimed the image
        # "matches docker-compose.yml's Postgres major version (16)" and that
        # ci.yml verified `postgres:16-alpine` on this migration path. Both were
        # false against the line below, which is 18: the tag moved and the prose
        # did not. Corrected 2026-08-13; the migration path is now verified on 18
        # by this workflow's own runs, not by an inherited claim about 16.
        # #VERIFY: `UW-F32` tracks the real question this exposed, which is that
        # four Postgres majors are in play at once (compose 16, this workflow 18,
        # integration tests 17, production 17.6) with no stated policy.
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: cyo_adventure
          POSTGRES_USER: cyo_adventure
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyo_adventure"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The `api` extra (FastAPI, SQLAlchemy) is enough to run uvicorn and
      # scripts/seed_dev_data.py; mirrors ci.yml's api-tests job exactly.
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      # #ASSUME: external-resources: GitHub-hosted ubuntu-latest runners ship
      # postgresql-client in their default toolset, but that is a hosted-image
      # detail, not a contract; installing only when `psql` is absent keeps
      # this cheap on the common case and self-healing if the image ever
      # drops it.
      # #VERIFY: only a real run against the actual runner image confirms
      # this step is a no-op there.
      - name: Ensure psql is available
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      # The baseline dump carries Supabase's `OWNER TO "postgres"` statements;
      # the service container runs as `cyo_adventure` with no postgres role,
      # so the push fails with SQLSTATE 42704 unless the role exists.
      # Duplicate-tolerant, copied from ci.yml's api-tests job.
      - name: Create postgres role for baseline OWNER statements
        run: |
          PGPASSWORD=password psql -h localhost -U cyo_adventure -d cyo_adventure -c \
            'DO $$ BEGIN CREATE ROLE "postgres"; EXCEPTION WHEN duplicate_object THEN NULL; END $$;'

      # Applies the real Supabase migration chain (supabase/migrations/*.sql)
      # against the service container, exactly as ci.yml's api-tests job and
      # local dev (frontend/README.md's "Real-backend e2e" section) do, so
      # this tier exercises the same migrated schema staging/production run,
      # not a schema built ad hoc from ORM metadata.
      # #ASSUME: external-resources: CLI 2.109.1 attempts a TLS handshake by
      # default against plain Postgres with no plaintext fallback, and
      # ignores ?sslmode=disable in the db-url, so PGSSLMODE=disable is
      # required for the non-TLS service container (same finding as ci.yml).
      # #VERIFY: re-check on future supabase-cli upgrades whether this is
      # still needed.
      - name: Apply database migrations
        env:
          PGSSLMODE: disable
          SUPABASE_DB_URL: postgresql://cyo_adventure:password@localhost:5432/cyo_adventure
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      # Seeds the family/profiles/published stories the real-backend specs
      # read (scripts/seed_dev_data.py; idempotent). Runs after migrations
      # so it inserts into the migrated schema.
      - name: Seed dev data
        env:
          DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
        run: uv run python scripts/seed_dev_data.py

      # Starts the real backend in the background (ENVIRONMENT defaults to
      # "local", which trusts a bearer token as the authn subject and skips
      # the non-local DEVICE_GRANT_SECRET/CHILD_SESSION_SECRET fail-fast
      # checks in core/config.py). DEVICE_GRANT_SECRET must still be a
      # non-empty value even in local: real-stack.ts's authorizeDevice()
      # (used by every e2e-real spec, including the new S2 conflict spec)
      # mints a real device grant, and the mint endpoint 400s
      # (ConfigurationError) without a secret to sign it, regardless of
      # environment. Output is captured to backend.log and uploaded on
      # failure for post-mortem debugging.
      # #CRITICAL: timing: the readiness-wait step below is what makes this
      # safe; nothing here blocks until uvicorn is actually accepting
      # connections.
      - name: Start backend (uvicorn, background)
        env:
          ENVIRONMENT: local
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          CYO_ADVENTURE_REDIS_URL: redis://localhost:6379/0
          DEVICE_GRANT_SECRET: nightly-e2e-real-device-grant-secret
          # Every kid spec here picks a profile, which mints a child-session
          # token (POST /api/v1/child-sessions). That endpoint 400s
          # (ConfigurationError) without a secret to sign it, even in local,
          # so the kid library call 401s and the shelf never renders. Must be
          # non-empty and distinct from DEVICE_GRANT_SECRET (config.py enforces
          # distinctness in every environment; issue #251 audience separation).
          CHILD_SESSION_SECRET: nightly-e2e-real-child-session-secret
        run: |
          uv run uvicorn cyo_adventure.app:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      # Canonical `/api/v1/health/ready`, not the un-prefixed alias (UW-L04).
      # The alias would answer today, which is precisely why this had to change:
      # it would keep answering right up until the alias is retired, then fail
      # here for a reason unrelated to anything this workflow tests.
      # No content-type assertion here, unlike the prod/real-stack probes: this
      # hits the uvicorn process directly on loopback with no proxy in front, so
      # there is nothing that could answer 200 in the backend's place.
      - name: Wait for backend readiness
        run: |
          curl --retry 15 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/api/v1/health/ready

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # Playwright's `real-backend` project webServer (frontend/playwright.config.ts)
      # builds and serves the app itself (npm run build && vite preview on
      # :4173), proxying /api to the uvicorn started above; no manual
      # build/serve step is needed here. --workers=1 (baked into
      # `npm run test:e2e:real`) avoids tripping the backend's per-IP rate
      # limiter, which two parallel workers sharing the loopback IP would do.
      # #CRITICAL: timing: this job runs Playwright against playwright.config.ts
      # FOUR TIMES (this step, then "E2E (Playwright, full-pipeline tier)",
      # then "E2E (Playwright, full-pipeline negative tier)", then "E2E
      # (Playwright, usersim-real tier)" below; task B3a added the usersim
      # one, the issue #290 remediation added the negative one), and that
      # config's `json` reporter writes to a single path
      # unless overridden (see playwright.config.ts). A shared fixed path
      # would let a later run's report silently overwrite an earlier one's
      # before either is read, so the alert would end up naming only the
      # last-run project's failures on a run where an earlier step is what
      # actually failed, and would look correct while doing it (task A7-i).
      # `PLAYWRIGHT_JSON_REPORT_PATH` below gives each of the four its own
      # file rather than relying on step-scheduling to keep runs from
      # colliding. That matters concretely today: real-backend failing skips
      # full-pipeline entirely (the default `if:`-less step gate), but
      # usersim-real below carries an explicit `if: ${{ !cancelled() }}` and
      # so still runs in that case, meaning its report is written in the same
      # job as a real-backend failure. Distinct paths are what make that
      # safe; a shared path would not be.
      # #VERIFY: `real-backend.json`, `real-backend-pipeline.json`,
      # `real-backend-pipeline-negative.json`, and `usersim-real.json` below
      # must stay distinct paths.
      - name: E2E (Playwright, real-backend tier)
        working-directory: ./frontend
        id: playwright_real
        env:
          E2E_BACKEND_URL: http://localhost:8000
          # real-backend-setup (the reset dependency) shells out to
          # scripts/reset_e2e_real_state.py, which needs the DSN in this step's
          # own env (execFileSync inherits it); without it the script falls
          # back to the credential-less localhost default and asyncpg fails
          # auth as OS user "runner". See the same note on e2e-real-pr-smoke.yml.
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          PLAYWRIGHT_JSON_REPORT_PATH: playwright-json-report/real-backend.json
        run: npm run test:e2e:real

      # Full-pipeline tier (G1, Phase 7.1): the real-backend specs that drive
      # the real RQ generation worker run here, so the worker is started here,
      # not at job setup. This worker serves the default `safe` canned fixture
      # (core/config.py::Settings.mock_story_fixture); the BLOCKING direction
      # needs a differently configured worker and gets its own pair of steps
      # further down. It must be started immediately before this step, not
      # earlier: the worker's Redis connection uses socket_timeout=2
      # (generation/queue.py) and the blocking dequeue idle-dies after roughly
      # the worker TTL (~7 min) with "Redis connection timeout, quitting", so a
      # worker started before the multi-minute `real-backend` run above would
      # be dead by the time this step enqueues. The pipeline project rebuilds
      # its own preview under CI (reuseExistingServer is false when CI is set),
      # but that ~1-2 min build fits well inside the idle budget, so a worker
      # started right here survives to consume the enqueued job (validated:
      # the mock pipeline resolves a job in ~2s once picked up).
      # #CRITICAL: external-resources: full-pipeline-real.spec.ts's poll
      # deadline fails with an explicit worker-not-running message if this
      # worker is absent or already dead; that is the intended signal, not a
      # bare Playwright timeout.
      # #VERIFY: if the socket_timeout=2 worker fragility is ever fixed at the
      # source (a longer timeout, or burst-mode), this ordering constraint can
      # relax; until then, keep the worker start adjacent to the pipeline step.
      - name: Start generation worker (background)
        env:
          ENVIRONMENT: local
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          CYO_ADVENTURE_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python -m cyo_adventure.generation.worker_main > worker.log 2>&1 &
          echo $! > worker.pid
          # Give the reclaim sweep + worker startup a moment to attach to the
          # queue before Playwright begins its build; the spec's own 30s poll
          # then absorbs any residual startup slack.
          sleep 3

      # Own `PLAYWRIGHT_JSON_REPORT_PATH`, distinct from the real-backend
      # step's above: see that step's #CRITICAL comment for why a shared path
      # would let this run's report silently overwrite the other's.
      - name: E2E (Playwright, full-pipeline tier)
        working-directory: ./frontend
        id: playwright_pipeline
        env:
          E2E_BACKEND_URL: http://localhost:8000
          # real-backend-pipeline also depends on real-backend-setup, so its
          # reset shell-out needs the DSN in this step's env too (see the note
          # on the real-backend tier step above).
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          PLAYWRIGHT_JSON_REPORT_PATH: playwright-json-report/real-backend-pipeline.json
        run: npm run test:e2e:real:pipeline

      # Full-pipeline tier, BLOCKING direction (review finding S-5, issue
      # #290): full-pipeline-negative-real.spec.ts needs the worker to serve
      # the structurally invalid canned fixture
      # (CYO_ADVENTURE_MOCK_STORY_FIXTURE=invalid). That selector is read once
      # per worker process from settings, not per job, and the positive tier
      # above needs the default `safe` fixture from the same "generation"
      # queue, so the two directions cannot share one worker. For 37
      # consecutive nightlies the negative spec ran under the safe-fixture
      # worker and reported "expected a HARD-BLOCK terminal status, got
      # passed", which was the wiring, not the gate. The worker is therefore
      # restarted between the two pipeline steps with the invalid fixture.
      #
      # #CRITICAL: concurrency: the safe-fixture worker MUST be fully gone
      # before the invalid-fixture one starts. `uv run` does not exec its
      # child here (the job's orphan sweep lists `uv` and `python3` as two
      # pids), so killing only worker.pid leaves a python3 worker alive on the
      # queue, and two workers racing for the negative spec's job would make
      # its outcome depend on which one dequeued first. Every process matching
      # the module path is signalled, the step waits for all of them to exit,
      # and it FAILS if any survive, because a silently surviving safe worker
      # is exactly the non-deterministic state this split exists to remove.
      # RQ handles SIGTERM as a warm shutdown (finish the in-flight job, then
      # exit); by this point the positive tier's jobs are terminal, so the
      # wait is short. SIGKILL is the fallback, never the first choice, so a
      # job row is not stranded mid-transaction.
      # #VERIFY: the `pgrep` assertion at the end of this step; the negative
      # spec's own block assertion names the env var if the wrong fixture is
      # somehow still being served.
      - name: Stop generation worker (safe fixture)
        if: ${{ !cancelled() }}
        run: |
          pattern='cyo_adventure.generation.worker_main'
          kill "$(cat worker.pid)" 2>/dev/null || true
          pkill -TERM -f "$pattern" || true
          for _ in $(seq 1 30); do
            if ! pgrep -f "$pattern" > /dev/null; then break; fi
            sleep 1
          done
          if pgrep -f "$pattern" > /dev/null; then
            echo "safe-fixture worker did not exit on SIGTERM within 30s; sending SIGKILL"
            pkill -KILL -f "$pattern" || true
            sleep 2
          fi
          if pgrep -af "$pattern"; then
            echo "::error::a generation worker is still running; refusing to start the invalid-fixture worker beside it"
            exit 1
          fi

      # Same shape as "Start generation worker (background)" above, with the
      # one deliberate difference: CYO_ADVENTURE_MOCK_STORY_FIXTURE=invalid,
      # which flips build_provider's mock branch (generation/provider.py) to
      # serve `_INVALID_STORY`, a non-ending node with no choices that the
      # deterministic validator gate rejects at ERROR severity on every repair
      # attempt. This is a dev/test-only selector: it has no effect on any
      # non-mock provider, and the mock provider is never selectable outside
      # ENVIRONMENT=local (generation/allowlist.py). Own log file, uploaded
      # separately below, so a negative-tier post-mortem is not interleaved
      # with the positive tier's.
      # #CRITICAL: timing: same idle-death constraint as the first worker
      # (socket_timeout=2, ~7 min TTL); it is started immediately before the
      # step that enqueues for it, and the Playwright build in between fits
      # inside that budget.
      - name: Start generation worker (invalid fixture, background)
        if: ${{ !cancelled() }}
        env:
          ENVIRONMENT: local
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          CYO_ADVENTURE_REDIS_URL: redis://localhost:6379/0
          CYO_ADVENTURE_MOCK_STORY_FIXTURE: invalid
        run: |
          uv run python -m cyo_adventure.generation.worker_main > worker-negative.log 2>&1 &
          echo $! > worker-negative.pid
          sleep 3

      # Runs on `!cancelled()` like the usersim-real step below, for the same
      # reason: the stack is fully up by now, and a positive-tier failure says
      # nothing about whether the gate blocks. Its own report path and its own
      # outputDir (playwright.config.ts `real-backend-pipeline-negative`) keep
      # it from clobbering a sibling's evidence.
      - name: E2E (Playwright, full-pipeline negative tier)
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        id: playwright_pipeline_negative
        env:
          E2E_BACKEND_URL: http://localhost:8000
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          PLAYWRIGHT_JSON_REPORT_PATH: playwright-json-report/real-backend-pipeline-negative.json
        run: npm run test:e2e:real:pipeline:negative

      # usersim-real tier (task B3a): the same seeded random walk as the
      # usersim.yml scheduled workflow's mocked `usersim` project
      # (frontend/e2e-usersim/walk.spec.ts), run here against this job's real
      # stack instead (walk-real.spec.ts), so I1-I6 are checked against
      # genuine backend responses rather than route-mocked fixtures. Needs no
      # generation worker (unlike the full-pipeline step above): walk-real.spec.ts
      # never awaits a generation job, so it is unaffected either way by
      # whether "Start generation worker (background)" above ran or was
      # itself skipped.
      # #CRITICAL: timing: a GitHub Actions step with no explicit `if:` gets
      # the implicit `if: success()`, meaning it runs only when every prior
      # step in the job succeeded. Left ungated, this step would be skipped
      # on every night `real-backend` or `full-pipeline` fails, exactly like
      # `full-pipeline` is already skipped today when `real-backend` fails
      # (see that step's own comment below). By the time this step would
      # start, the stack is already fully up: migrations, seeding, and the
      # backend readiness probe all completed before the first Playwright
      # step ran, so an earlier suite's failure says nothing about whether
      # this walk can run. `if: ${{ !cancelled() }}` makes the step run
      # regardless of the siblings' outcome while still correctly skipping on
      # a genuine job cancellation or timeout; `success()`/`failure()` alone
      # would not escape the implicit gate, and `always()` would additionally
      # run on cancellation, which `!cancelled()` avoids.
      # #VERIFY: if a future edit removes this `if:`, this step goes back to
      # being silently skipped every time an earlier Playwright step fails.
      # `usersim-real`'s `dependencies: ['real-backend-setup']`
      # (playwright.config.ts) means this step's own CLI invocation re-runs
      # the DB reset before it starts, same as the two steps above, so the
      # review story is back at a known `in_review` state (I5's
      # guardian-only canary lives on its moderation report; see
      # frontend/e2e-usersim/support/real-canaries.ts) before the walk's
      # `test.beforeAll` proves both I5 canary rows exist. This DB reset runs
      # regardless of whether `real-backend` or `full-pipeline` left the
      # database in a torn-down or partially-mutated state, since the reset
      # is unconditional on `dependencies`, not on the sibling steps' status.
      # #CRITICAL: security: this tier's walk reads across the guardian/admin
      # role and family boundary (I5) but must never write across it; see
      # real-canaries.ts and walk-real.spec.ts's own header comments. An I5
      # failure discovered here is a security finding, not something to
      # patch by weakening the invariant.
      # Own `PLAYWRIGHT_JSON_REPORT_PATH`, distinct from both steps above:
      # see the #CRITICAL comment on the real-backend tier step for why a
      # shared path would let one run's report silently overwrite another's.
      #
      # #CRITICAL: data-integrity: this step runs on `!cancelled()`, so it
      # ALWAYS runs after `real-backend` and `real-backend-pipeline` above,
      # even when one of them failed and left trace/screenshot evidence
      # behind. Playwright deletes its entire configured `outputDir` at the
      # start of every invocation, so without a project-specific `outputDir`
      # this step would silently wipe that evidence before the single
      # "Upload Playwright trace on failure" step below (which runs once, for
      # the whole job) ever reads `frontend/test-results/`. Task B3b review,
      # Important 1, same defect class as accessibility-compliance-weekly.yml.
      # The fix lives in playwright.config.ts: `real-backend`,
      # `real-backend-pipeline`, and `usersim-real` each declare their own
      # `outputDir` subdirectory, so no invocation in this job can clear
      # another's evidence.
      # #VERIFY: all three real-tier projects in `frontend/playwright.config.ts`
      # keep distinct `outputDir` values.
      - name: E2E (Playwright, usersim-real tier)
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        id: playwright_usersim_real
        env:
          E2E_BACKEND_URL: http://localhost:8000
          # usersim-real also depends on real-backend-setup, so its reset
          # shell-out needs the DSN in this step's own env too (see the note
          # on the real-backend tier step above).
          CYO_ADVENTURE_DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
          PLAYWRIGHT_JSON_REPORT_PATH: playwright-json-report/usersim-real.json
        run: npm run test:e2e:usersim:real

      - name: Upload worker log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-nightly-worker-log
          path: worker.log
          retention-days: 7

      - name: Upload negative-tier worker log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-nightly-worker-negative-log
          path: worker-negative.log
          retention-days: 7

      - name: Upload backend log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-nightly-backend-log
          path: backend.log
          retention-days: 7

      - name: Upload Playwright trace on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-nightly-traces
          path: frontend/test-results/
          retention-days: 7

      # #CRITICAL: security: reads ONLY frontend/playwright-json-report/real-backend.json
      # (this step's own `json` reporter output; see the `PLAYWRIGHT_JSON_REPORT_PATH`
      # env on the "E2E (Playwright, real-backend tier)" step above), never
      # frontend/test-results/, which is uploaded wholesale as a public
      # artifact above because THIS REPOSITORY IS PUBLIC. Runs unconditionally
      # on job failure (not gated on `playwright_real`'s own outcome): if the
      # real-backend step passed and the pipeline step below is what failed,
      # this file still exists (with zero failing specs) and the script's
      # output is simply unused by the compose step's `pipelineFailed`
      # branch. scripts/extract-failing-specs.mjs reads only `spec.file` and
      # `test.title`, never an error message, a stack trace, or any
      # attachment, and it always exits 0 (a missing or unparseable report
      # degrades to an explanatory line), so this step cannot itself fail the
      # job.
      # #VERIFY: a future edit to that script that reads any other field must
      # be rejected in review; see its own header comment.
      - name: Extract failing specs from the real-backend report
        if: ${{ failure() }}
        id: extract_specs
        working-directory: ./frontend
        run: |
          {
            echo 'result<<EXTRACT_SPECS_EOF'
            node scripts/extract-failing-specs.mjs playwright-json-report/real-backend.json
            echo 'EXTRACT_SPECS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Same extraction, against the full-pipeline step's own report. That
      # step is skipped entirely (default `if:`-less step gating) whenever the
      # real-backend step above already failed, so its report will not exist
      # in that case; scripts/extract-failing-specs.mjs's own missing-report
      # branch covers that, not a special case here.
      - name: Extract failing specs from the full-pipeline report
        if: ${{ failure() }}
        id: extract_pipeline_specs
        working-directory: ./frontend
        run: |
          {
            echo 'result<<EXTRACT_PIPELINE_SPECS_EOF'
            node scripts/extract-failing-specs.mjs playwright-json-report/real-backend-pipeline.json
            echo 'EXTRACT_PIPELINE_SPECS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Same extraction, against the full-pipeline negative step's own report.
      # That step runs on `!cancelled()`, so its report exists whenever the
      # job got as far as the Playwright steps at all.
      - name: Extract failing specs from the full-pipeline negative report
        if: ${{ failure() }}
        id: extract_pipeline_negative_specs
        working-directory: ./frontend
        run: |
          {
            echo 'result<<EXTRACT_PIPELINE_NEGATIVE_SPECS_EOF'
            node scripts/extract-failing-specs.mjs playwright-json-report/real-backend-pipeline-negative.json
            echo 'EXTRACT_PIPELINE_NEGATIVE_SPECS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Same extraction, against the usersim-real step's own report (task
      # B3a). Unlike full-pipeline above, the usersim-real step itself carries
      # `if: ${{ !cancelled() }}` (see that step's own #CRITICAL comment), so
      # it still runs (and writes this report) even when real-backend or
      # full-pipeline fails. This extraction step only runs on `failure()`,
      # so it never fires on a cancelled job in the first place; short of
      # that, its report will not exist only if an even earlier setup step
      # failed before any Playwright step could start.
      # scripts/extract-failing-specs.mjs's missing-report branch covers that.
      - name: Extract failing specs from the usersim-real report
        if: ${{ failure() }}
        id: extract_usersim_real_specs
        working-directory: ./frontend
        run: |
          {
            echo 'result<<EXTRACT_USERSIM_REAL_SPECS_EOF'
            node scripts/extract-failing-specs.mjs playwright-json-report/usersim-real.json
            echo 'EXTRACT_USERSIM_REAL_SPECS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compose the issue body
        # Reusable alerting pattern for scheduled E2E tiers
        # (test-traceability-matrix.md, "Actions to reach the bar" #2), copied
        # from e2e-prod.yml with the marker/copy adjusted for this tier, and
        # routed through the shared .github/actions/ci-failure-issue composite
        # (label: e2e-alert) instead of a bare github-script block: the prior
        # inline issue-listing call paged at GitHub's default 30-per-page with
        # no `!issue.pull_request` filter, so an open PR titled with this
        # marker, or a 31st-oldest open issue, could hide the real tracking
        # issue and file a duplicate.
        #
        # `FAILING_SPECS`/`PIPELINE_FAILING_SPECS` (task A7-i) are the two
        # preceding steps' output: which spec file(s) and test title(s) failed
        # in each of this job's two Playwright runs, or an explanatory line if
        # a report was absent/unparseable. Composed into the return value
        # below and passed to BOTH `body` and `comment-body`, matching
        # e2e-staging.yml: on this branch the composite action uses `body`
        # only at issue creation, so anything that goes only into `body`
        # would be visible exactly once.
        if: ${{ failure() }}
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAYWRIGHT_REAL_OUTCOME: ${{ steps.playwright_real.outcome }}
          PLAYWRIGHT_PIPELINE_OUTCOME: ${{ steps.playwright_pipeline.outcome }}
          PLAYWRIGHT_PIPELINE_NEGATIVE_OUTCOME: ${{ steps.playwright_pipeline_negative.outcome }}
          PLAYWRIGHT_USERSIM_REAL_OUTCOME: ${{ steps.playwright_usersim_real.outcome }}
          FAILING_SPECS: ${{ steps.extract_specs.outputs.result }}
          PIPELINE_FAILING_SPECS: ${{ steps.extract_pipeline_specs.outputs.result }}
          PIPELINE_NEGATIVE_FAILING_SPECS: ${{ steps.extract_pipeline_negative_specs.outputs.result }}
          USERSIM_REAL_FAILING_SPECS: ${{ steps.extract_usersim_real_specs.outputs.result }}
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            // Neither Playwright step below has an `if:`, so when `npm ci` or
            // an earlier setup step fails first, GitHub's default step
            // gating skips both of them without ever running them (task A7-i
            // review, Minor 6: `steps.<id>.outcome` was observed rendering as
            // an empty string in that case, unlike e2e-staging.yml's
            // analogous `playwright` step). The `|| 'did not run'` fallbacks
            // below exist only so the "Step outcomes:" line never renders
            // blank for an unreached step, whatever value GitHub reports for
            // it; the fallback branch further down (`!realFailed &&
            // !pipelineFailed`) already handles the "neither step reported
            // failure" case correctly regardless.
            const realOutcome = process.env.PLAYWRIGHT_REAL_OUTCOME || 'did not run'
            const pipelineOutcome = process.env.PLAYWRIGHT_PIPELINE_OUTCOME || 'did not run'
            const pipelineNegativeOutcome =
              process.env.PLAYWRIGHT_PIPELINE_NEGATIVE_OUTCOME || 'did not run'
            const usersimRealOutcome = process.env.PLAYWRIGHT_USERSIM_REAL_OUTCOME || 'did not run'
            const realFailed = realOutcome === 'failure'
            const pipelineFailed = pipelineOutcome === 'failure'
            const pipelineNegativeFailed = pipelineNegativeOutcome === 'failure'
            const usersimRealFailed = usersimRealOutcome === 'failure'
            const failingSpecs = process.env.FAILING_SPECS || 'No failing-spec detail is available for this run.'
            const pipelineFailingSpecs =
              process.env.PIPELINE_FAILING_SPECS || 'No failing-spec detail is available for this run.'
            const pipelineNegativeFailingSpecs =
              process.env.PIPELINE_NEGATIVE_FAILING_SPECS ||
              'No failing-spec detail is available for this run.'
            const usersimRealFailingSpecs =
              process.env.USERSIM_REAL_FAILING_SPECS || 'No failing-spec detail is available for this run.'

            const lines = [
              'The scheduled `E2E (real backend, nightly)` workflow',
              '(`.github/workflows/e2e-real-nightly.yml`) failed.',
              '',
              'This tier runs the `real-backend`, `full-pipeline`, and',
              '`full-pipeline-negative` Playwright projects (frontend/e2e-real/,',
              'zero route mocks), plus the',
              '`usersim-real` seeded random walk (frontend/e2e-usersim/,',
              'walk-real.spec.ts), against a throwaway Postgres-backed uvicorn',
              'built fresh each run; a failure here means either a real',
              'regression in the reader/guardian/admin flows, a real-backend',
              'spec (including the S2 conflict-race spec,',
              'offline-conflict-real.spec.ts) needs attention, a usersim-real',
              'walk step (I1-I6; see that failure for which invariant),',
              'or the migration/seed setup broke.',
              '',
              `Step outcomes: real-backend: ${realOutcome} / full-pipeline: ${pipelineOutcome} / ` +
                `full-pipeline-negative: ${pipelineNegativeOutcome} / ` +
                `usersim-real: ${usersimRealOutcome}`,
              '',
            ]

            if (realFailed) {
              lines.push('The `real-backend` Playwright run failed.', '', failingSpecs, '')
            }

            if (pipelineFailed) {
              lines.push('The `full-pipeline` Playwright run failed.', '', pipelineFailingSpecs, '')
            }

            if (pipelineNegativeFailed) {
              lines.push(
                'The `full-pipeline-negative` Playwright run failed. If its block',
                'assertion reports "got passed", check the "Stop generation worker"',
                'step: a surviving safe-fixture worker, not the gate, is the usual cause.',
                '',
                pipelineNegativeFailingSpecs,
                '',
              )
            }

            if (usersimRealFailed) {
              lines.push(
                'The `usersim-real` Playwright run failed. If the failure is an I5',
                '(role/family isolation) assertion, treat it as a security finding, not',
                'a flake to retry.',
                '',
                usersimRealFailingSpecs,
                '',
              )
            }

            if (!realFailed && !pipelineFailed && !pipelineNegativeFailed && !usersimRealFailed) {
              lines.push(
                'None of the tracked Playwright steps (real-backend, full-pipeline,',
                'full-pipeline-negative, usersim-real) reported failure; check the run',
                'log for a setup step outside those four (migrations, seeding,',
                'backend/worker startup or the worker restart between pipeline tiers).',
                '',
              )
            }

            lines.push(
              `This run: ${runUrl}`,
              `Date: ${today}`,
              '',
              'This issue accumulates one comment per failing run and closes itself',
              'once a scheduled run succeeds; the next failure opens a fresh issue.',
            )

            return lines.join('\n')

      - name: File or comment on the pinned issue
        if: ${{ failure() }}
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-real-nightly]'
          label: e2e-alert
          summary: scheduled real-backend nightly E2E failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: ${{ steps.compose.outputs.result }}

      - name: Resolve the tracking issue on a green scheduled run
        # Every one of these issue bodies used to end by asking a human to
        # close the issue once a run went green; nobody ever did for the other
        # scheduled workflows either, so closing is the workflow's job now
        # that the shared action makes it a one-line step.
        #
        # `&& github.event_name == 'schedule'`: a manual `workflow_dispatch`
        # proves only that a human-triggered run went green, not that the
        # SCHEDULE is alive; without this a dead cron could still have its
        # tracking issue closed by a one-off dispatch. This job's
        # `cancel-in-progress: true` (unlike e2e-prod.yml) does not weaken the
        # gate: a scheduled run cancelled in favor of a newer one reports
        # `cancelled`, not `success`, so it never satisfies this condition
        # either.
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-real-nightly]'
          label: e2e-alert
          mode: resolve
