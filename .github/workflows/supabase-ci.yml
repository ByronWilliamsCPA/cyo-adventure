# Validates that the Supabase migration chain applies cleanly to a fresh
# local stack before it can merge. Non-required check initially; promotion
# to ci-gate is deferred until it proves stable (same policy as api-tests).
name: Supabase Migrations CI

on:
  pull_request:
    paths:
      - "supabase/**"
      # The parity step below compares the CLI-built schema with the ORM, so a
      # model change or a change to the checker itself re-runs it too.
      - "src/cyo_adventure/db/**"
      - "src/cyo_adventure/core/schema_parity.py"
      - "scripts/check_schema_parity.py"

permissions:
  contents: read

jobs:
  validate-migrations:
    name: Validate migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1

      - name: Start local database and apply migrations
        run: |
          supabase db start
          supabase migration up
          supabase migration list --local

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install backend (api extra)
        run: uv sync --extra api

      # #ASSUME: external resources: this is the only place the parity script
      # meets a supabase_migrations.schema_migrations table written by the
      # real CLI (the integration tests create that table themselves), so it
      # is what proves the script reads the CLI's bookkeeping correctly. A
      # freshly migrated stack must come out IN PARITY on both halves: every
      # file recorded as applied, every ORM column present, zero warnings.
      # #VERIFY: a non-zero exit fails this job; --json output is printed in
      # the log for diagnosis. The URL is the CLI's documented local default
      # (no secret: this stack exists only inside the runner).
      - name: Schema parity against the CLI-built stack
        env:
          SCHEMA_PARITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run python scripts/check_schema_parity.py --json --fail-on-ahead
