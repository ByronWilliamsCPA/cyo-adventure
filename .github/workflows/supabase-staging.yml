# Deploys the Supabase migration chain AND the project config to the STAGING
# project on every merge to main that touches either. Secrets come from the
# `staging` GitHub Environment (set up per docs/guides/supabase-environments.md).
name: Deploy Supabase Migrations (staging)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # config.toml must be in this filter or a config-only change would never
      # deploy, which is the exact gap this workflow closed (issue #601).
      # A config-only change still runs `db push`; with no new migrations that
      # is a no-op, so the wider filter costs nothing.
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      include_all:
        description: >-
          Repair run: also apply migrations that sort BEFORE the last one
          already applied. Leave false for normal deploys.
        type: boolean
        default: false

permissions:
  contents: read

# #CRITICAL: concurrency: only one `supabase db push` may touch the staging
# migration history at a time. A human repair dispatch can otherwise overlap an
# automatic push-triggered deploy and interleave writes to
# supabase_migrations.schema_migrations. cancel-in-progress stays false: an
# aborted migration run leaves partially-applied schema, which is worse than a
# queued one.
# #VERIFY: keep this group name in sync with the runbook section "Repairing an
# out-of-order divergence" in docs/guides/supabase-environments.md.
concurrency:
  group: supabase-staging-migrations
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Push migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # #CRITICAL: security: this deploys supabase/config.toml's [auth] policy to
      # the live project. `config push` diffs first and writes nothing when the
      # remote already matches (a genuine no-op run logs "Remote <surface> config
      # is up to date."; confirmed on run 30972610902), but for any table it DOES
      # send it writes with defaults: keys omitted from config.toml are filled
      # with the CLI's own defaults and asserted on the remote, so an omission
      # means "overwrite with the default", not "leave alone". Removing a key
      # from [auth] is therefore a live policy change, not a no-op (issue #622;
      # the corrected model lives in docs/guides/supabase-environments.md).
      # Blast radius covers site_url,
      # uri_allow_list, the password floor, MFA, and the email confirmation and
      # throttle settings.
      # #VERIFY: --project-ref is REQUIRED, not redundant with `link`: it is the
      # key the CLI matches against [remotes.*].project_id. Without the right
      # ref, the base config (site_url = localhost) is what gets pushed. Confirm
      # the run log's first line reads "Loading config override: [remotes.staging]";
      # if that line is absent, the override did not match and the push used
      # local dev values. --yes is required because the CLI prompts per service.
      # That confirmation is asserted below rather than left to a human reading
      # the log, because `config push` exits 0 either way.
      # #CRITICAL: security: two controls guard this push, and they are not
      # interchangeable. The pre-flight comparison below is PREVENTION: it
      # refuses to invoke the CLI at all unless the ref this job is about to
      # push to is the same ref [remotes.staging] declares, so a wrong or empty
      # SUPABASE_PROJECT_ID never reaches a live project. The log assertion
      # after the push is DETECTION only: by the time its line can be read the
      # push has landed, so a miss there means an incident to restore from.
      # Detection is kept as a second control because it also catches a CLI
      # whose matching behaviour changes under a version bump, which the
      # pre-flight check cannot see.
      # #VERIFY: the pre-flight check is deliberately in this step rather than a
      # step of its own, so it cannot be reordered away from the push it guards.
      # It parses the TOML rather than grepping: a grep would match the ref
      # inside a comment and wave through a config the CLI would reject.
      # #VERIFY: `set -o pipefail` is load-bearing. The default shell is
      # `bash -e`, which does not set it, so without this line a failing
      # `config push` would be masked by tee's exit status.
      - name: Push project config
        run: |
          set -o pipefail
          expected=$(python3 <<'PY'
          import tomllib

          with open("supabase/config.toml", "rb") as fh:
              print(tomllib.load(fh)["remotes"]["staging"]["project_id"])
          PY
          )
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID is empty. Refusing to run config push:" \
                 "the CLI would match no [remotes.*] block and send the base config" \
                 "(site_url = http://localhost:5173) to whatever project is linked."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "$expected" ]; then
            echo "::error::SUPABASE_PROJECT_ID does not match [remotes.staging].project_id" \
                 "in supabase/config.toml. config push would have sent the base config" \
                 "(site_url = http://localhost:5173) to a live project. Refusing to push." \
                 "Reconcile the staging environment secret with config.toml before retrying."
            exit 1
          fi
          supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes 2>&1 \
            | tee "$RUNNER_TEMP/config-push.log"
          if ! grep -qF 'Loading config override: [remotes.staging]' \
              "$RUNNER_TEMP/config-push.log"; then
            echo "::error::config push did not load [remotes.staging]; the base config" \
                 "(site_url = http://localhost:5173) went out to this project instead." \
                 "Restore from the pre-push snapshot per" \
                 "docs/guides/supabase-environments.md section 4."
            exit 1
          fi

      # `supabase db push` refuses a migration whose filename timestamp sorts
      # BEFORE the last one already applied remotely, because inserting into
      # applied history is how two environments silently diverge. That guard is
      # correct and stays on for every automatic deploy; INCLUDE_ALL is the
      # documented escape hatch for repairing a divergence that already
      # happened, and it is reachable only by a human dispatching the workflow.
      #
      # Staging is the environment that hits this, and structurally so: it
      # auto-deploys on every merge touching migrations, so it can apply a
      # LATER migration before an earlier-numbered one is merged. Production
      # deploys by manual dispatch in ordered batches, so it usually sees both
      # files in one run and applies them in order. That is a property of the
      # dispatch cadence, not a guarantee. It is why staging can be red while
      # production is green on the identical migration set.
      #
      # #CRITICAL: data integrity: --include-all is NOT unconditionally safe. A
      # migration that replaces a CHECK constraint with an ABSOLUTE cumulative
      # list (see 20260729050000's #CRITICAL header) can drop values that are
      # already in the remote constraint, because each file's idempotency guard
      # only tests for its OWN new value. The danger condition is an
      # absolute-list migration that runs AFTER another absolute-list migration
      # for the same constraint is already in remote history, without carrying
      # that other file's values.
      # #VERIFY: before dispatching with include_all, read the REMOTE state
      # (`supabase migration list` plus a pg_get_constraintdef query), then walk
      # the three criteria in the "Repairing an out-of-order divergence" section
      # of docs/guides/supabase-environments.md. Do not infer the applied state
      # from which workflow runs are green, and do not dispatch on the
      # assumption the listed files are safe.
      - name: Push migrations
        env:
          # Via env, not inlined into the command: a workflow_dispatch input is
          # attacker-influenced in the general case, and the boolean type is not
          # a substitute for keeping it out of the shell's parse.
          INCLUDE_ALL: ${{ inputs.include_all }}
        run: |
          if [ "${INCLUDE_ALL}" = "true" ]; then
            echo "::warning::Repair run: applying out-of-order migrations with --include-all."
            supabase db push --include-all
          else
            supabase db push
          fi
