# Runs the e2e-staging Playwright tier against the already-deployed staging
# frontend (this repo does not build/ship that frontend itself; homelab-infra
# does, on its own cadence, see trigger-image-build.yml). Scheduled + manual
# only, never on every PR: it authenticates real seeded accounts and mints a
# real device grant against the shared staging Supabase project (see
# docs/testing/README.md for why dev and staging share one backend on the
# Supabase free plan's two-project limit).
name: E2E (staging)

on:
  schedule:
    # Daily. The staging fixtures are disposable and idempotent
    # (scripts/seed_staging.py), so a failure here means either the seed
    # drifted, the staging frontend build is broken, or a real regression.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Every run authenticates against and mints/revokes a device grant on the
  # shared staging Supabase project; two overlapping runs (a schedule firing
  # mid manual-dispatch, or two manual dispatches) could race on the same
  # seeded fixtures. Never cancel a run in favor of a newer one: let the
  # in-flight run finish and its cleanup complete before the next starts.
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e-staging:
    name: Playwright (e2e-staging tier)
    runs-on: ubuntu-latest
    # Sized against the tier's unit arithmetic in
    # playwright.e2e-staging.config.ts: 28 timeout-bearing units x 30s = 840s
    # fully-hung first pass, plus checkout/npm ci/playwright install and the
    # 60s device-grant sweep step below. Raised 20 -> 25 minutes when
    # kws-public-urls.spec.ts took the tier from 21 units to 26: at 20 minutes
    # that pathological pass left roughly 2 minutes of margin against a
    # ~13-minute run, where the original 21-unit sizing had closer to 6. This
    # is a headroom restoration, not a fix for an observed timeout. The
    # `staging-auth-setup` project added 2 more units (26 -> 28) when it took
    # over every sign-in from the specs' `beforeAll` hooks; no further budget
    # raise was needed, 840s still leaves comfortable margin against 1500s.
    timeout-minutes: 25
    environment: staging
    # Least-privilege at workflow level (contents: read); this job adds only
    # the issues: write the failure-alerting steps below need. Composite
    # actions cannot declare their own permissions, so the caller must.
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ./frontend
    env:
      E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_STAGING_GUARDIAN_PASSWORD: ${{ secrets.E2E_STAGING_GUARDIAN_PASSWORD }}
      E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, staging tier)
        id: playwright
        run: npm run test:e2e:staging

      # Signal 1 of 2, the DIAGNOSTIC.
      #
      # Playwright's serial-block retry spawns a fresh worker on the first
      # failure, so a failed teardown revoke in that first attempt leaks its
      # own device grant while the retry mints and cleanly revokes a NEW one;
      # the spec then reports "flaky" rather than "failed" and this job exits
      # 0. frontend/e2e-staging/support/device-grant.ts records every
      # unconfirmed revoke to test-results/leaked-device-grants.jsonl
      # regardless of overall pass/fail, so this step (if: always(), runs even
      # when the step above already failed) fails the job on a non-empty file,
      # independent of what Playwright itself reported.
      #
      # This ledger is SELF-REPORTED teardown state and cannot be the only
      # signal: a worker killed after the mint, an afterAll that blows the
      # tier timeout, and recordLeakedGrant's own fail-open all leave a live
      # grant and no line here. What it uniquely provides is WHICH spec leaked
      # and why, which the sweep below cannot tell you. The sweep is the
      # deterministic backstop; this is the diagnostic. Keep both.
      #
      # No untrusted external input reaches this script (no github.event.*
      # fields): the only input is a file this same job's own test run wrote
      # under frontend/test-results/, and each line is only ever read via jq
      # and passed through a shell variable, never interpolated into the
      # run: block by the workflow templater. The records hold a DB row id, a
      # spec label, and a fixed-vocabulary detail string; no token, bearer, or
      # password is ever written to them, so echoing a whole line is safe.
      - name: Check for leaked staging device grants
        id: leak_check
        if: always()
        run: |
          LEAK_FILE="test-results/leaked-device-grants.jsonl"
          if [ ! -s "$LEAK_FILE" ]; then
            echo "No leaked device grants recorded."
            exit 0
          fi
          echo "One or more staging device grants were not confirmed revoked by teardown:"
          # `|| [ -n "$line" ]` keeps the final record when the file has no
          # trailing newline, which is what a worker killed mid-append leaves
          # behind. Without it that record fails the job but is never named,
          # so an operator sees a red run with no grant id to act on.
          #
          # GitHub runs this block as `bash -e {0}`, and a bare assignment
          # from a command substitution carries THAT command's exit status.
          # A truncated record therefore used to make jq exit non-zero, trip
          # set -e, and terminate this loop mid-report: the bad record and
          # every record after it went unnamed, so a multi-leak run showed at
          # most one id. `|| grant_id=''` keeps set -e out of it and lets the
          # empty-value fallback below actually fire. jq's stderr is left
          # visible on purpose; it is the only diagnostic for a malformed
          # record, and this file holds no secrets.
          #
          # grantId is legitimately null when a mint happened but its id was
          # never captured, so `// "id-not-captured"` is a real outcome, not
          # a parse failure. "unparseable" is reserved for jq failing.
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            grant_id=$(printf '%s' "$line" | jq -r '.grantId // "id-not-captured"') || grant_id=''
            if [ -z "$grant_id" ]; then
              grant_id="unparseable"
            fi
            echo "::error::Leaked staging device grant ${grant_id}, revoke it manually: ${line}"
          done < "$LEAK_FILE"
          exit 1

      # Signal 2 of 2, the AUTHORITATIVE BACKSTOP.
      #
      # Asks staging itself whether the test guardian's family still holds an
      # active device grant, so it shares none of the ledger's failure modes
      # (it does not read a file the dying process was supposed to write). It
      # runs on if: always() because the runs that leak are exactly the runs
      # where something above failed.
      #
      # Fail-closed by construction: a 429, a network error, an auth failure,
      # a non-2xx, a non-JSON body, or a body that is not a list all FAIL the
      # spec. "Could not list" is never "nothing leaked"; degrading it to a
      # pass would recreate the silent-failure class this whole change closes.
      # See frontend/e2e-staging-sweep/device-grant-sweep.spec.ts.
      #
      # Reports and fails, deliberately without auto-revoking: a live grant
      # keeps this job red on every subsequent scheduled run until a human
      # acts, where a self-healing sweep would go green again after one red
      # and would also destroy a device a human authorized for manual QA on
      # this shared family.
      #
      # Its config pins trace/screenshot/video off, so a sweep failure writes
      # no artifact carrying the staging bearer it signs in with.
      - name: Sweep staging for surviving device grants
        id: grant_sweep
        if: always()
        run: npm run test:e2e:staging:sweep

      # The ledger only: a DB row id, a spec label, a fixed detail string, and
      # a timestamp. Uploaded as its own small artifact so a leak never has to
      # pull the trace bundle along with it.
      - name: Upload leaked-grant ledger
        if: ${{ !cancelled() && steps.leak_check.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-staging-leaked-grant-ledger
          path: frontend/test-results/leaked-device-grants.jsonl
          retention-days: 7

      # #CRITICAL: security: gated on the Playwright step's OWN outcome, never
      # on job-level failure(). test-results/ holds `retain-on-failure` traces
      # that carry the real staging guardian Supabase bearer, the minted
      # device-grant token, and DOM snapshots of the sign-in form, and THIS
      # REPOSITORY IS PUBLIC, so every workflow artifact is downloadable by
      # anyone for its whole retention window. A job-level `failure()` here
      # would mean the leak check and the sweep each publish that bundle on
      # runs that would previously have uploaded nothing, strictly widening
      # credential exposure in the name of observability. The ledger upload
      # above is what a leak needs, and it carries no secrets.
      # #VERIFY: never change this to `failure()` or `always()`, and never
      # point another artifact at frontend/test-results/ wholesale.
      - name: Upload Playwright trace on Playwright failure
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-staging-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Compose the issue body
        # Same composite-action pattern as e2e-prod.yml (see that workflow's
        # own compose step for why: the prior inline issue-listing call paged
        # at GitHub's default 30-per-page with no `!issue.pull_request`
        # filter, so an open PR titled with this marker, or a 31st-oldest open
        # issue, could hide the real tracking issue and file a duplicate).
        #
        # This job has THREE independent failure sources instead of one: the
        # `playwright` step, the `leak_check` diagnostic, and the `grant_sweep`
        # authoritative backstop (see their own long comments above for why
        # both leak signals exist and why the sweep, not the ledger, is
        # authoritative). A leaked device grant needs a human to revoke it by
        # hand; a spec failure does not. The issue TITLE stays the fixed
        # string in `summary:` below and never names which source fired.
        # `body:` and `comment-body:` below are BOTH this step's output, so an
        # operator reading either the first-failure body or any later
        # recurrence comment gets the same per-step attribution without
        # having to open the run; only the title itself stays generic.
        #
        # #CRITICAL: security: THIS REPOSITORY IS PUBLIC, so this body is
        # world-readable like every other issue and log line (see the
        # #CRITICAL: security comment above the trace-upload step). It names
        # which step failed and points at the run log and artifacts, the same
        # parity already established by this job's own `::error::` lines
        # (grant ids, spec labels); it never carries a bearer token, a
        # device-grant token, or raw Playwright output.
        # #VERIFY: any future edit to this script still sources its content
        # only from step outcomes (an enum: success/failure/cancelled/
        # skipped) and static run metadata (context.serverUrl, context.repo,
        # context.runId, the current date), never from
        # `frontend/test-results/` or a secret.
        if: ${{ failure() }}
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          LEAK_CHECK_OUTCOME: ${{ steps.leak_check.outcome }}
          SWEEP_OUTCOME: ${{ steps.grant_sweep.outcome }}
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            const playwrightOutcome = process.env.PLAYWRIGHT_OUTCOME
            const leakCheckOutcome = process.env.LEAK_CHECK_OUTCOME
            const sweepOutcome = process.env.SWEEP_OUTCOME

            const sweepFailed = sweepOutcome === 'failure'
            const leakCheckFailed = leakCheckOutcome === 'failure'
            const playwrightFailed = playwrightOutcome === 'failure'
            // `npm ci` or `npx playwright install` failing first leaves this
            // step SKIPPED (no `if:` on it), not failed: leak_check then
            // exits 0 (no ledger file exists yet) and grant_sweep fails (it
            // runs `npm run test:e2e:staging:sweep` through the same npm
            // toolchain with no node_modules). Without surfacing `skipped`
            // separately from `failure`, that infra failure reads as a live
            // device grant below.
            const playwrightSkipped = playwrightOutcome === 'skipped'

            const lines = [
              'The scheduled `E2E (staging)` workflow (`.github/workflows/e2e-staging.yml`) failed.',
              '',
              'This tier runs daily against the shared staging Supabase project using',
              'disposable seeded fixtures (scripts/seed_staging.py); a failure means the',
              'seed drifted, the staging frontend build broke, a real regression landed, or a',
              'staging device grant was not confirmed revoked.',
              '',
              `Step outcomes: playwright: ${playwrightOutcome} / leak_check: ${leakCheckOutcome} / grant_sweep: ${sweepOutcome}`,
              '',
            ]

            if (sweepFailed && playwrightSkipped) {
              lines.push(
                'The `grant_sweep` step failed, but `playwright` above was **skipped**, not',
                'failed: an earlier step (most likely `npm ci` or `npx playwright install`)',
                'did not complete, so no spec in this run ever signed in or minted a device',
                'grant. `grant_sweep` runs through that same npm toolchain, so this failure is',
                'at least as likely to be the same missing install as a genuine live grant.',
                'It still could not confirm staging is clean either way, so do not close this',
                'out on that assumption: check the run log for the actual install failure',
                'first, and only escalate to a human revoke if `grant_sweep`\'s own log shows',
                'it actually reached and queried staging.',
                '',
              )
            } else if (sweepFailed) {
              lines.push(
                '**A staging device grant may still be active.** The `grant_sweep` step, which',
                'asks staging directly whether the test guardian family still holds a live',
                'grant, failed. This is the authoritative signal (not the leak-ledger',
                'diagnostic below): treat it as a security event and have a human confirm and',
                'revoke any surviving grant by hand. See that step\'s log for which grant, and',
                'frontend/e2e-staging-sweep/device-grant-sweep.spec.ts for how it checks.',
                '',
              )
            } else if (playwrightSkipped) {
              lines.push(
                'The `playwright` step was **skipped**, not failed: an earlier step (most',
                'likely `npm ci` or `npx playwright install`) did not complete, so no spec in',
                'this run ever signed in or minted a device grant. Check the run log for the',
                'actual install failure.',
                '',
              )
            }

            if (leakCheckFailed) {
              lines.push(
                'The `leak_check` step failed. That usually means it recorded an unconfirmed',
                'teardown revoke to the ledger (a diagnostic only; see its log for which spec',
                'and grant id), but the step can also fail before ever reading the ledger, for',
                'example if an earlier failure left the checkout it `cd`s into never created.',
                'Whether a grant is actually still live is what `grant_sweep` above determines',
                'either way.',
                '',
              )
            }

            if (playwrightFailed) {
              lines.push(
                'The `playwright` step itself failed. See the uploaded `e2e-staging-traces`',
                'artifact, if present, and the run log for which spec.',
                '',
              )
            }

            if (!sweepFailed && !leakCheckFailed && !playwrightFailed && !playwrightSkipped) {
              lines.push(
                'None of the three tracked steps (playwright, leak_check, grant_sweep)',
                'reported failure; check the run log for a step outside those three.',
                '',
              )
            }

            lines.push(
              `This run: ${runUrl}`,
              `Date: ${today}`,
              '',
              'This issue accumulates one comment per failing run and closes itself',
              'once a scheduled run succeeds; the next failure opens a fresh issue.',
            )

            return lines.join('\n')

      - name: File or comment on the pinned issue
        if: ${{ failure() }}
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-staging]'
          label: e2e-alert
          summary: scheduled staging E2E failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: ${{ steps.compose.outputs.result }}

      - name: Resolve the tracking issue on a green scheduled run
        # Mirrors e2e-prod.yml's resolve gate, including the
        # `github.event_name == 'schedule'` guard (a manual workflow_dispatch
        # proves only that a human-triggered run went green, not that the
        # SCHEDULE is alive; see e2e-prod.yml's comment on this same step for
        # the confirmed real-world failure shape, issue #667 on
        # supabase-backup.yml).
        #
        # `success()` here already folds in the sweep's authoritative check: a
        # surviving device grant fails the `grant_sweep` step (`if: always()`),
        # which fails the job, which makes `success()` false. So this is not
        # "close on one green run despite a possibly-leaked grant"; a leaked
        # grant is exactly the case where this step does not run, and the
        # tracking issue stays open until a human resolves the grant and a
        # later scheduled run is clean end to end. No divergent local
        # close-gate is introduced; if one green run ever proves too weak a
        # bar for this workflow specifically, that is a decision for the
        # shared action's owner, not a local workaround here.
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-staging]'
          label: e2e-alert
          mode: resolve
