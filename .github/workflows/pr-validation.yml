# PR Validation for CYO Adventure
#
# Supplementary PR checks that live outside ci.yml: dead-code detection
# (advisory) and documentation link checking (blocking). The aggregate job
# `Dependency & Standards Validation` is the required status check, and it
# fails when the link check fails.
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  merge_group:

# Cancel in-progress runs for the same PR. The `|| github.ref` fallback is
# essential for merge_group events: there is no pull_request context in the
# queue, so without it every merge-group build collapses into the same
# concurrency group and cancels the previous entry's required
# "Dependency & Standards Validation" check, blocking the queue. On a
# merge_group, github.ref is the unique gh-readonly-queue ref per entry.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # NOTE: The org-level `python-pr-validation.yml` reusable workflow is
  # DEPRECATED (its upstream now emits a "This workflow is removed" stub).
  # Its responsibilities are already covered locally:
  #   - conventional-commit / PR-title validation -> pr-title.yml
  #   - tests / lint / type-check / coverage       -> ci.yml
  # The deprecated `core-validation` caller was removed to keep the required
  # "Dependency & Standards Validation" gate green. PR-description length and
  # automatic size-labels (previously provided by the org workflow) are no
  # longer enforced; add the standalone size-label action if those are wanted.
  # ==========================================================================

  # ==========================================================================
  # Additional Checks (Template-Specific)
  # ==========================================================================

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory-only (see validate-dependencies below, which never fails on
    # this result) and file-content-only, not merged-state-sensitive; skip on
    # merge_group, same rationale as changelog's existing pull_request-only if.
    if: github.event_name != 'merge_group'
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        # Scan paths, confidence, exclusions, and ignore rules all come from
        # [tool.vulture] in pyproject.toml so local runs and CI agree. Do not
        # re-specify them here: a positional path argument silently overrides
        # the configured `paths` list.
        run: |
          echo "## Dead Code Report" >> "$GITHUB_STEP_SUMMARY"
          # Vulture exit codes: 0 = clean, 1 = invalid input, 2 = invalid CLI,
          # 3 = dead code found. Only 3 is a finding; 1 and 2 mean the tool or
          # its config is broken and must not be swallowed. The previous
          # `| tee ... || true` discarded the code twice over, so a vulture
          # that could not start reported the same as a vulture that found
          # nothing.
          set +e
          uv run vulture > vulture-report.txt 2>vulture-stderr.txt
          rc=$?
          set -e
          cat vulture-report.txt
          cat vulture-stderr.txt >&2
          case "$rc" in
            0)
              echo "✅ No dead code detected." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              {
                echo '```'
                cat vulture-report.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Potential dead code detected. Review vulture report."
              ;;
            *)
              echo "::error::vulture exited $rc (invocation or config error)."
              {
                echo "vulture exited $rc (invocation or config error):"
                echo '```'
                cat vulture-stderr.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$rc"
              ;;
          esac

  # Changelog enforcement was REMOVED, not neutralized, on 2026-07-31.
  #
  # CHANGELOG.md is generated at release time by python-semantic-release from
  # Conventional Commits (see .github/workflows/release.yml); PRs no longer
  # edit it. The old "every PR must touch CHANGELOG.md" gate was itself the
  # source of the merge-queue changelog conflicts: it forced every PR to edit
  # one shared file, so the speculative squash of any two queued PRs collided
  # there. The job survived for a while as a passing no-op on the theory that
  # a required check named "Changelog Check" still needed to report; that was
  # verified false (no org or repo ruleset requires it), and while it existed
  # it was the ONLY thing this workflow's required gate could ever fail on,
  # which meant the gate could not fail at all.

  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking (validate-dependencies fails on this result), but not
    # merged-state-sensitive: it reads file contents only, so the PR run is
    # authoritative and re-running it in the queue would only add flake.
    if: github.event_name != 'merge_group'
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --max-concurrency 16
            --accept-timeouts
            --accept 200,204,206,301,302,403,429
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            --exclude '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/|$)'
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
          # Blocking. This check found and hid 7 genuinely broken links while
          # it was advisory; a link check that cannot fail is a link ignorer.
          # The two flags below are what make blocking survivable, because a
          # gate that fails on third-party network weather gets ignored just
          # as fast as one that never fails at all.
          #
          # `--max-concurrency 16` (default is 128). At the default, the
          # Cloudflare-fronted DPA URL in docs/compliance/ fails with "HTTP/2
          # protocol error" in a full-corpus run while passing when checked
          # alone: the edge drops the connection under the fan-out. Verified
          # locally against lychee v0.24.2, the version this action pins: 1
          # error at default concurrency, 0 errors across 5 consecutive runs
          # at 16, and the whole run got FASTER (7.2s to 2.5s) because it
          # stopped burning time on retries.
          #
          # `--accept-timeouts` fails the job on broken links but not on slow
          # ones. lychee reports timeouts in a SEPARATE bucket from errors and
          # yet counts both toward exit code 2, so the first blocking run
          # printed "Errors | 0" and still exited 2, on a single 20s timeout
          # against securityscorecards.dev (live, 200 in 0.2s from elsewhere).
          # Reproduced locally with `--timeout 1`: exit 2 with 0 errors and 1
          # timeout, exit 0 with this flag. The residual blind spot is a host
          # that blackholes rather than refuses, which presents as a timeout;
          # a dead domain still fails DNS and is still reported as an error,
          # verified against a 404 and a nonexistent host with the flag on.
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # Validation Summary
  # ==========================================================================
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dead-code, link-check]
    if: always()
    env:
      DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
      LINK_CHECK_RESULT: ${{ needs.link-check.result }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check validation results
        run: |
          {
            echo "## Dependency & Standards Validation"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Both jobs are skipped on merge_group by design (see their `if:`),
          # so `skipped` is reported as such rather than dressed up as a pass.
          # Only `failure` blocks, and only for link-check plus a dead-code
          # job that broke on invocation (vulture findings are warnings, so a
          # failed dead-code job means the tool or its config is broken).
          summarize() {
            case "$2" in
              success) echo "✅ $1: Passed" ;;
              skipped) echo "⏭️ $1: Skipped (merge queue)" ;;
              *)       echo "❌ $1: $2" ;;
            esac
          }

          summarize "Dead Code Check" "$DEAD_CODE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          summarize "Link Check" "$LINK_CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$DEAD_CODE_RESULT" "$LINK_CHECK_RESULT"; do
            case "$result" in
              success | skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -eq 1 ]; then
            {
              echo ""
              echo "❌ Validation failed. Review the job logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ All validation checks passed!"
          } >> "$GITHUB_STEP_SUMMARY"
