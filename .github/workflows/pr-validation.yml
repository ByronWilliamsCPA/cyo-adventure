# PR Validation for CYO Adventure
#
# Supplementary PR checks that live outside ci.yml: dead-code detection
# (advisory) and documentation link checking (blocking). The aggregate job
# `Dependency & Standards Validation` is the required status check, and it
# fails when the link check fails.
#
# The link check is scoped to the files the PR changes. Whole-corpus coverage
# lives in link-check-full.yml, which runs weekly and files an issue instead of
# blocking. See the long comment on the `link-check` job for why the split
# exists; it is load-bearing, not tidying.
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  merge_group:

# Cancel in-progress runs for the same PR. The `|| github.ref` fallback is
# essential for merge_group events: there is no pull_request context in the
# queue, so without it every merge-group build collapses into the same
# concurrency group and cancels the previous entry's required
# "Dependency & Standards Validation" check, blocking the queue. On a
# merge_group, github.ref is the unique gh-readonly-queue ref per entry.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # NOTE: The org-level `python-pr-validation.yml` reusable workflow is
  # DEPRECATED (its upstream now emits a "This workflow is removed" stub).
  # Its responsibilities are already covered locally:
  #   - conventional-commit / PR-title validation -> pr-title.yml
  #   - tests / lint / type-check / coverage       -> ci.yml
  # The deprecated `core-validation` caller was removed to keep the required
  # "Dependency & Standards Validation" gate green. PR-description length and
  # automatic size-labels (previously provided by the org workflow) are no
  # longer enforced; add the standalone size-label action if those are wanted.
  # ==========================================================================

  # ==========================================================================
  # Additional Checks (Template-Specific)
  # ==========================================================================

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory-only (see validate-dependencies below, which never fails on
    # this result) and file-content-only, not merged-state-sensitive; skip on
    # merge_group, same rationale as changelog's existing pull_request-only if.
    if: github.event_name != 'merge_group'
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        # Scan paths, confidence, exclusions, and ignore rules all come from
        # [tool.vulture] in pyproject.toml so local runs and CI agree. Do not
        # re-specify them here: a positional path argument silently overrides
        # the configured `paths` list.
        run: |
          echo "## Dead Code Report" >> "$GITHUB_STEP_SUMMARY"
          # Vulture exit codes: 0 = clean, 1 = invalid input, 2 = invalid CLI,
          # 3 = dead code found. Only 3 is a finding; 1 and 2 mean the tool or
          # its config is broken and must not be swallowed. The previous
          # `| tee ... || true` discarded the code twice over, so a vulture
          # that could not start reported the same as a vulture that found
          # nothing.
          set +e
          uv run vulture > vulture-report.txt 2>vulture-stderr.txt
          rc=$?
          set -e
          cat vulture-report.txt
          cat vulture-stderr.txt >&2
          case "$rc" in
            0)
              echo "✅ No dead code detected." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              {
                echo '```'
                cat vulture-report.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Potential dead code detected. Review vulture report."
              ;;
            *)
              echo "::error::vulture exited $rc (invocation or config error)."
              {
                echo "vulture exited $rc (invocation or config error):"
                echo '```'
                cat vulture-stderr.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$rc"
              ;;
          esac

  # Changelog enforcement was REMOVED, not neutralized, on 2026-07-31.
  #
  # CHANGELOG.md is generated at release time by python-semantic-release from
  # Conventional Commits (see .github/workflows/release.yml); PRs no longer
  # edit it. The old "every PR must touch CHANGELOG.md" gate was itself the
  # source of the merge-queue changelog conflicts: it forced every PR to edit
  # one shared file, so the speculative squash of any two queued PRs collided
  # there. The job survived for a while as a passing no-op on the theory that
  # a required check named "Changelog Check" still needed to report; that was
  # verified false (no org or repo ruleset requires it), and while it existed
  # it was the ONLY thing this workflow's required gate could ever fail on,
  # which meant the gate could not fail at all.

  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking (validate-dependencies fails on this result), but not
    # merged-state-sensitive: it reads file contents only, so the PR run is
    # authoritative and re-running it in the queue would only add flake.
    if: github.event_name != 'merge_group'
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the step below can reach the merge base and compute
          # what this PR actually changed.
          fetch-depth: 0

      # WHY THIS JOB IS SCOPED TO THE DIFF
      #
      # It used to check the whole corpus (~1,460 links, of which ~340 are
      # remote and spread across ~96 hosts) on every PR, which made a REQUIRED
      # status check a lottery against the availability of a hundred third
      # parties. PR #562 demonstrated the failure mode: six runs of this check
      # failed across roughly seventy minutes, three of them inside the first
      # twenty, and the failure sets were DISJOINT (a 520 on
      # readingrockets.org, a 415 on hiwavemakers.com, then connection failures
      # on eis.ucsc.edu and securityscorecards.dev). Every one of those URLs
      # answered 200 in under 1.2s when probed directly.
      #
      # The corpus-wide flags below (concurrency, accept-timeouts, cache,
      # retry-wait) each cut the failure rate and none of them could fix this,
      # because the exposure scales with the number of hosts contacted, not
      # with the odds per host. Scoping to the diff attacks the exposure: a
      # typical PR touches a handful of documents, so the blocking check now
      # contacts a handful of hosts.
      #
      # Be honest about what that does and does not buy. Replayed against
      # #562's diff, this scoping drops the third run's failures entirely
      # (both files were untouched by that PR) and the 415 is now accepted, so
      # two of the three go away. The 520 does not: that URL is cited by a file
      # the PR edits, and a live host returning 5xx is exactly the case a link
      # check should not paper over. Scoping shrinks the lottery, it does not
      # cancel it, and no flag here should be widened to pretend otherwise.
      #
      # Whole-corpus coverage did not go away, it moved to link-check-full.yml,
      # which runs weekly and files an issue. That split is the point: link rot
      # is worth knowing about, and a third party's five-minute outage is not
      # worth blocking a merge over. Losing the split would restore the defect.
      - name: Collect changed documentation files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # `set -u` fires on UNSET, and both of these are always set: on a
          # non-pull_request event the expressions above evaluate to the empty
          # string, which `set -u` accepts and `git diff` then reads as
          # `...`, symmetric difference with both sides defaulting to HEAD.
          # That is an empty diff, which skips the check and reports success.
          # Assert non-empty rather than relying on `set -u` to do it.
          : "${BASE_SHA:?empty; this step requires a pull_request event}"
          : "${HEAD_SHA:?empty; this step requires a pull_request event}"

          # Three-dot: files this PR changed, measured from the merge base, so
          # unrelated documents that landed on main meanwhile are not dragged
          # in. `--diff-filter=d` drops deletions, which have nothing to check.
          #
          # `core.quotePath=false` stops git C-quoting a non-ASCII path into
          # `"docs/caf\303\251.md"`. The allow-list below rejects such names on
          # their own merits; it should reject them for that reason rather than
          # incidentally because git wrapped them in quotes.
          #
          # Note the absence of `|| true` here. A git failure (unreachable SHA,
          # a shallow clone, a corrupt object) must abort the step under
          # `set -e` rather than fall through to an empty file, because an
          # empty file means zero in-scope docs, which SKIPS the check and
          # reports this REQUIRED gate green. The grep further down is where an
          # empty result is a legitimate answer, so the tolerance belongs
          # there and nowhere else.
          #
          # #CRITICAL: data integrity: masking a failure in this step converts
          # a required link gate into an unconditional pass.
          # #VERIFY: every `|| true` in this step must be attached to a grep.
          # Never attach one to a command whose failure means "we do not know
          # what changed".
          git -c core.quotePath=false diff --name-only --diff-filter=d \
            "${BASE_SHA}...${HEAD_SHA}" > candidates.txt

          # A deleted or renamed document breaks the relative links that point
          # at it, and those links live in files this PR did not touch, so diff
          # scoping alone would never see them. Pull the referrers in.
          # `--diff-filter=DR` is the exact complement of the `d` filter above:
          # the paths that stopped existing where they were.
          #
          # `--name-status`, not `--name-only`: for a rename, `--name-only`
          # prints the DESTINATION path, and the path that stopped existing is
          # the source. Field 2 is the old path for both `D` and `R` records.
          # If rename detection is off the rename arrives as a D plus an A and
          # the D record carries the same old path, so this holds either way.
          git -c core.quotePath=false diff --name-status --diff-filter=DR \
            "${BASE_SHA}...${HEAD_SHA}" | cut -f2 > removed-docs.txt

          # `(name` and `/name` are the two ways a relative link can end at a
          # given basename. These are fixed strings (`grep -F`), so a filename
          # carrying regex metacharacters is matched literally, never compiled.
          : > referrer-patterns.txt
          while IFS= read -r removed; do
            [ -n "$removed" ] || continue
            base=${removed##*/}
            printf '(%s\n/%s\n' "$base" "$base" >> referrer-patterns.txt
          done < removed-docs.txt

          if [ -s referrer-patterns.txt ]; then
            # Basename matching over-matches when two documents share a name.
            # Over-matching only ever adds files to the check, so it fails safe.
            grep -rlF --include='*.md' -f referrer-patterns.txt \
              docs README.md CONTRIBUTING.md >> candidates.txt || true
          fi

          # #CRITICAL: security: lychee-action interpolates `args` into a
          # shell, so a path reaching it is executed text. The pattern below is
          # an ALLOW-LIST on the character class, not merely a location filter:
          # a fork PR adding a file whose name carries a space, quote, or shell
          # metacharacter fails to match and is excluded rather than injected.
          # Do not loosen it to `.*` to "support more paths".
          # #VERIFY: any change to this regex must keep the character class
          # closed. Test with a filename containing `;`, `$(`, and a space.
          #
          # Every candidate passes through here whatever collected it, so
          # referrer expansion cannot route a path around the allow-list.
          grep -E '^(docs/[A-Za-z0-9._/-]+\.md|README\.md|CONTRIBUTING\.md)$' \
            candidates.txt > matched.txt || true
          sort -u matched.txt > changed-docs.txt

          count=$(wc -l < changed-docs.txt | tr -d ' ')
          paths=$(tr '\n' ' ' < changed-docs.txt)

          {
            echo "count=${count}"
            echo "paths=${paths}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Documentation Links"
            echo ""
            if [ "$count" -eq 0 ]; then
              echo "No documentation files in scope; nothing to check."
            else
              echo "Checking links in ${count} in-scope file(s). In scope means"
              echo "changed by this PR, plus any file whose relative links"
              echo "pointed at a document this PR deleted or renamed."
              echo ""
              sed 's/^/- /' changed-docs.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Restores `.lycheecache` so a re-run of the same commit re-requests only
      # the URLs that were NOT already confirmed good. See the `--cache` note on
      # the step below for why that is the actual fix for the reset flake.
      # `key` carries the sha so each commit saves its own entry; `restore-keys`
      # falls back to the newest entry in scope, and a re-run of an unchanged sha
      # hits `key` exactly. `github.sha` is a hex commit id, not user-controlled
      # text, and it is consumed as an action input rather than shell.
      - name: Restore link-check cache
        if: steps.changed.outputs.count != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check documentation links
        if: steps.changed.outputs.count != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 3
            --retry-wait-time 5
            --max-concurrency 16
            --accept-timeouts
            --accept 200,204,206,301,302,403,415,429
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            --exclude '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/|$)'
            ${{ steps.changed.outputs.paths }}
          # lychee-action defaults `failIfEmpty` to true and exits 1 whenever a
          # run finds no links at all. Roughly a quarter of the in-scope
          # documents contain no link of any kind, so a PR touching only those
          # would fail this REQUIRED check for having nothing to check. `fail`
          # is left at its default of true, so a genuinely broken link still
          # blocks; only the empty case is reclassified as the non-event it is.
          failIfEmpty: false
          # Blocking. This check found and hid 7 genuinely broken links while
          # it was advisory; a link check that cannot fail is a link ignorer.
          # The flags below are what make blocking survivable, because a gate
          # that fails on third-party network weather gets ignored just as fast
          # as one that never fails at all.
          #
          # `--max-concurrency 16` (default is 128). At the default, the
          # Cloudflare-fronted DPA URL in docs/compliance/ fails with "HTTP/2
          # protocol error" in a full-corpus run while passing when checked
          # alone: the edge drops the connection under the fan-out. Verified
          # locally against lychee v0.24.2, the version this action pins: 1
          # error at default concurrency, 0 errors across 5 consecutive runs
          # at 16, and the whole run got FASTER (7.2s to 2.5s) because it
          # stopped burning time on retries.
          #
          # `--accept-timeouts` fails the job on broken links but not on slow
          # ones. lychee reports timeouts in a SEPARATE bucket from errors and
          # yet counts both toward exit code 2, so the first blocking run
          # printed "Errors | 0" and still exited 2, on a single 20s timeout
          # against securityscorecards.dev (live, 200 in 0.2s from elsewhere).
          # Reproduced locally with `--timeout 1`: exit 2 with 0 errors and 1
          # timeout, exit 0 with this flag. The residual blind spot is a host
          # that blackholes rather than refuses, which presents as a timeout;
          # a dead domain still fails DNS and is still reported as an error,
          # verified against a 404 and a nonexistent host with the flag on.
          #
          # `415` is in `--accept` because a 415 Unsupported Media Type is the
          # server answering and refusing the request method, not a statement
          # that the resource is missing. hiwavemakers.com returned one to a
          # runner while serving 200 to a browser and to curl from elsewhere.
          # Treating it as a broken link is a false positive; a genuinely dead
          # URL still gives 404, 410, or a DNS failure.
          #
          # `--cache --max-cache-age 1d` plus the restore step above address a
          # THIRD failure mode: a bare `Connection reset by peer (os error 104)`
          # from a host that is up. PR #520 hit it twice in a row on two
          # DIFFERENT hosts (docs/OPENSSF_COMPLIANCE.md and docs/PROJECT_SETUP.md,
          # then www.conventionalcommits.org from CONTRIBUTING.md and README.md),
          # 2 errors of 1264 links and 0 timeouts each time, with every flag
          # above already in place. Both hosts answered 200 in under a second
          # from a developer machine, so this is runner-network or bot-protection
          # behaviour, not link rot. That makes "just re-run it" a coin flip
          # rather than a remedy, which is what the cache fixes: lychee writes
          # only SUCCESSES to `.lycheecache` (verified on v0.24.2, the version
          # this action pins: a connection failure and a 404 in the same run
          # produced a cache file holding just the one 200), so a re-run can
          # never replay a stale failure, and it re-requests only what has not
          # already passed. Measured on this corpus: 129 remote URLs cached from
          # 1266 links, cold run 8.2s, warm re-run 0.11s with ZERO outbound
          # requests. GitHub scopes a PR's cache writes to its own ref, so the
          # first run of a PR is still cold and carries the original exposure;
          # every re-run of it does not.
          #
          # `--retry-wait-time 5` (default is 1) is what helps that first cold
          # run. lychee retries connection resets but on an exponential ladder
          # based at this value, so the default spends 1+2+4 = 7s before giving
          # up, which loses to a host that stays hostile longer than that.
          # Verified against a local socket that accepts and immediately RSTs
          # (SO_LINGER 0): `--max-retries 1 --retry-wait-time 3` took 3.0s and
          # `--max-retries 3 --retry-wait-time 3` took 21.0s, i.e. 3+6+12, so
          # the ladder is real and this value sets its base. At 5 the budget is
          # 5+10+20 = 35s per failing URL, still far inside `timeout-minutes`.
          # It costs nothing when nothing fails: back-to-back cold runs came in
          # at 2.38s (wait 1) and 2.39s (wait 5).
          #
          # Both are cheap insurance and neither weakens the gate: a genuinely
          # broken link is still an error, still uncached, and still fails the
          # job.
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # Validation Summary
  # ==========================================================================
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dead-code, link-check]
    if: always()
    env:
      EVENT_NAME: ${{ github.event_name }}
      DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
      LINK_CHECK_RESULT: ${{ needs.link-check.result }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check validation results
        run: |
          {
            echo "## Dependency & Standards Validation"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Both jobs carry `if: github.event_name != 'merge_group'`, so
          # merge_group is the one and only event on which their skip is by
          # design. Accepting `skipped` on any other event (and labelling it
          # "merge queue" regardless) would accept a skip caused by an upstream
          # failure or a mistyped condition, and report it as satisfied. That
          # is the defect issue #594 records against ci.yml's CI Gate; the same
          # blanket tolerance lived here.
          #
          # Otherwise: only `failure` blocks, and only for link-check plus a
          # dead-code job that broke on invocation (vulture findings are
          # warnings, so a failed dead-code job means the tool or its config is
          # broken).
          if [ "$EVENT_NAME" = "merge_group" ]; then
            skip_expected=true
          else
            skip_expected=false
          fi

          failed=0

          # summarize <label> <result>
          summarize() {
            case "$2" in
              success)
                echo "✅ $1: Passed" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped)
                if [ "$skip_expected" = "true" ]; then
                  echo "⏭️ $1: Skipped (merge queue), so not verified here" \
                    >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "❌ $1: Skipped, and a ${EVENT_NAME} event does not explain why" \
                    >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::$1 was skipped unexpectedly on a ${EVENT_NAME} event."
                  failed=1
                fi
                ;;
              *)
                echo "❌ $1: $2" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                ;;
            esac
          }

          summarize "Dead Code Check" "$DEAD_CODE_RESULT"
          summarize "Link Check" "$LINK_CHECK_RESULT"

          if [ "$failed" -eq 1 ]; then
            {
              echo ""
              echo "❌ Validation failed. Review the job logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ All validation checks passed!"
          } >> "$GITHUB_STEP_SUMMARY"
