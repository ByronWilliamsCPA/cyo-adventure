# Scheduled + manual database backup: dumps Supabase (roles/schema/data), encrypts,
# and uploads to a dedicated R2 bucket under a tiered daily/weekly/monthly prefix with
# per-tier lifecycle expiry. Closes issue #558 / UW-D27 (docs/planning/roadmap.md
# Phase 5, docs/operations/runbook.md section 6).
#
# Required secrets on the `backups` GitHub Environment. They are net-new, distinct from
# the app's runtime R2 credentials and from the existing SUPABASE_DB_PASSWORD used by
# supabase-production.yml, which authenticates `supabase link` rather than a raw
# connection string.
#
# Why a dedicated `backups` environment rather than `production`: an environment does two
# separate jobs, it scopes secrets and it gates deployments. This workflow wants the first
# and is broken by the second. `production` carries a required-reviewer protection rule,
# so every nightly run parked in `waiting` until a human approved it, and an unapproved
# run is eventually expired as `cancelled` rather than failed. Three of the four runs
# preceding 2026-08-11 never executed for that reason, and `production` supplied this job
# no secret it actually reads, so the gate was the only thing it contributed. The `backups`
# environment therefore has NO protection rules; it exists solely to keep these six
# credentials out of reach of every other workflow in the repository.
#
#   SUPABASE_DB_URL          Supavisor SESSION-mode pooler connection string, port 5432:
#                             postgresql://postgres.<ref>:<pw>@aws-0-us-east-1.pooler
#                             .supabase.com:5432/postgres. NOT the transaction-mode
#                             pooler on 6543, which reassigns backends mid-session and
#                             breaks a long-lived dump connection (ADR-009).
#                             This said "the DIRECT connection
#                             (db.<project-ref>.supabase.co:5432)" until 2026-08-24, and
#                             that route CANNOT WORK from here: this project's direct
#                             host publishes AAAA only (no IPv4), `supabase db dump` runs
#                             pg_dumpall inside a Docker container whose default bridge is
#                             IPv4-only, and GitHub-hosted runners have no IPv6 egress.
#                             Both fail on name resolution before authentication. Session
#                             mode is IPv4 and is what the production db-backup sidecar
#                             has used successfully since 2026-07.
#   R2_ACCOUNT_ID             Cloudflare account id.
#   R2_BACKUP_ACCESS_KEY_ID   A scoped R2 API token, access to the backup bucket ONLY --
#   R2_BACKUP_SECRET_ACCESS_KEY  deliberately separate from the app's cover-art upload
#                             token, so one compromised credential cannot read/overwrite
#                             the other's data. It is OBJECT-scoped, which means it may
#                             not call bucket-level APIs: the three lifecycle expiry
#                             rules are set BY HAND on the bucket and the script logs
#                             `backup_lifecycle_unmanaged` rather than asserting them.
#                             R2 admin permissions cannot be limited to one bucket, so
#                             widening this token to manage lifecycle would also let it
#                             delete the public covers bucket. See runbook section 6.
#   R2_BACKUP_BUCKET          Destination bucket name, separate from the public covers
#                             bucket (backups must never be publicly readable).
#   BACKUP_ENCRYPTION_KEY     Base64-encoded 32-byte AES-256 key. Generate with:
#                             `openssl rand -base64 32`. Store this key itself somewhere
#                             OTHER than this repo (a password manager / secret store) --
#                             losing it makes every existing backup unrecoverable, and it
#                             must survive independently of the GitHub repo.
#
# Failure alerting: a nightly backup that quietly stops running (a workflow-level
# failure, not a defect in the backed-up data) is exactly the failure mode worth
# guarding against, so this follows the same "file/comment on a labelled issue on
# failure" pattern as every other scheduled workflow in this repository (see
# e2e-prod.yml's "Alert on failure" step and planning-linkage.yml's "File drift issue"
# job; docs/operations/runbook.md section 7 documents the convention). Uses the
# `ci-failure` label (shared with planning-linkage.yml and the other non-E2E scheduled
# jobs) rather than `e2e-alert`, since this is an ops job, not an E2E tier.
#
# What the alert does NOT cover: a run that never happens at all emits no conclusion to
# alert on, so silence here is not evidence of a healthy backup. Verifying that a recent
# backup actually exists is the runbook's job (docs/operations/runbook.md section 6), not
# this workflow's.
#
# Injection posture: this workflow DOES read event input. `workflow_dispatch` supplies
# three retention inputs, and `inputs.*` IS `github.event.inputs.*`, so it is event data
# by definition even though only someone with write access can dispatch it. Those three
# values are therefore bound to `env:` on the step that uses them and referenced as
# shell variables ("$DAILY_DAYS"), never interpolated into the `run:` script text, which
# is the pattern every other dispatchable workflow here follows (release.yml's
# FORCE_LEVEL, supabase-staging.yml's INCLUDE_ALL, update-visual-snapshots.yml's
# BRANCH). Interpolating them directly would have put event-controlled text into the
# shell of the one step holding all six production secrets. Beyond those inputs, no
# GitHub event field (issue/PR title or body, commit message, ref) is read anywhere
# here, and the alert job interpolates only context.serverUrl, context.repo, and
# context.runId (all runner-supplied) plus a locally-computed ISO date string.
name: Database backup

on:
  schedule:
    # 08:00 UTC daily. Tier promotion (weekly/monthly) is computed from this run's date
    # inside scripts/backup_database.py, not by separate cron lines.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      daily_days:
        description: "Daily-tier retention (days)"
        type: number
        default: 7
      weekly_days:
        description: "Weekly-tier retention (days)"
        type: number
        default: 28
      monthly_days:
        description: "Monthly-tier retention (days)"
        type: number
        default: 180

# Nothing is granted by default; each job below declares exactly what it needs. Matches
# planning-linkage.yml.
permissions: {}

concurrency:
  # Object keys are derived from the run's DATE, not from the run, so two overlapping
  # runs (a delayed 08:00 schedule meeting a manual dispatch) compute IDENTICAL keys.
  # The destructive interleaving: run B finishes all six uploads and exits 0 reporting
  # success, then run A hits an upload error and rolls back, deleting objects that are
  # now run B's. The result is an incomplete set for a date a successful run already
  # called complete, with nothing red anywhere. Never cancel an in-flight run in favor
  # of a newer one: a cancelled backup is a missing backup, and e2e-prod.yml documents
  # the same reasoning for the same reason.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backups
    permissions:
      # contents alone. Actions has NO step-level `permissions` key, so any scope
      # granted here is held by every step in this job, including the one that runs
      # repository Python with all six production secrets in its environment. The
      # `issues: write` the failure alert needs therefore lives on the separate `alert`
      # job below, exactly as planning-linkage.yml splits `file-drift-issue` out of
      # `linkage` (PR #465), because job-level permissions cannot be made conditional.
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # `api` extra is enough: it carries boto3 (R2 upload) and cryptography is a core
      # dependency (AES-256-GCM encryption). No database driver or test tooling needed
      # for a script that shells out to the Supabase CLI rather than connecting itself.
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Run backup
        env:
          # Scoped to this single step rather than the job: no other step in this
          # job (checkout, setup-python, install, setup-cli) needs any of these six
          # secrets, so none of them should be able to read the values via its own
          # process environment.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          # The three workflow_dispatch inputs are bound here rather than interpolated
          # into the run: script below. See the injection-posture note at the top of
          # this file. The `|| <default>` fallback covers the schedule trigger, where
          # the inputs context is empty.
          DAILY_DAYS: ${{ inputs.daily_days || 7 }}
          WEEKLY_DAYS: ${{ inputs.weekly_days || 28 }}
          MONTHLY_DAYS: ${{ inputs.monthly_days || 180 }}
        run: |
          uv run python scripts/backup_database.py \
            --daily-days "$DAILY_DAYS" \
            --weekly-days "$WEEKLY_DAYS" \
            --monthly-days "$MONTHLY_DAYS"

  alert:
    name: Alert on failure or cancellation
    needs: backup
    # `failure() || cancelled()`, not `failure()` alone. A cancelled backup produces no
    # backup just as surely as a failed one, and `failure()` does not match a
    # cancellation, so a cancelled run alerted nobody. Known limitation: when the whole
    # workflow RUN is cancelled, GitHub may not schedule this job at all, so this covers
    # a cancelled `backup` job rather than guaranteeing coverage of every cancellation
    # path. The dominant source of those cancellations (an expired environment approval)
    # is removed by the `backups` environment above.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write, isolated to this job, so the backup job above never holds it while
      # running repository code with six production secrets in scope.
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the composite action is needed. A local `uses: ./...` requires a
          # checkout, and this job previously had none.
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compose the issue body
        # Reusable alerting pattern for scheduled workflows (e2e-prod.yml's "Alert on
        # failure" step, adapted): find an OPEN issue labelled `ci-failure` whose title
        # starts with this workflow's marker and comment on it, or open one if none
        # exists yet, so repo watchers get GitHub's native email/push notification
        # instead of a red run nobody checks the Actions tab for.
        #
        # This covers a backup that FAILS. It cannot cover a backup that never runs at
        # all (a workflow GitHub disabled after 60 days of repository inactivity, a
        # blocked environment gate, a deleted secret), because there is no run to
        # report. That case is covered inside the script instead, by
        # assert_recent_backup_exists(), which fails the next run that does happen if
        # the newest pre-existing daily backup has gone stale.
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            return [
                  'The scheduled `Database backup` workflow (`.github/workflows/supabase-backup.yml`) did not complete: it either failed or was cancelled.',
                  '',
                  'This is the nightly `supabase db dump` -> AES-256-GCM encrypt -> tiered R2',
                  'upload job (issue #558 / UW-D27). A failure here means one of:',
                  '',
                  '- a required secret is missing or invalid;',
                  '- the Supabase CLI or the session-mode pooler connection is unreachable;',
                  '- R2 rejected the upload;',
                  '- a dump leg came back empty or boilerplate-only and `run_backup()` aborted',
                  '  rather than uploading a placeholder backup;',
                  '- the target bucket carries no `.cyo-backup-bucket` marker, so the script',
                  '  refused to write to a bucket it could not confirm is the backup bucket;',
                  '- a retention value was below its documented floor or out of order;',
                  '- `assert_recent_backup_exists()` found no recent PRE-EXISTING backup, which',
                  '  means the schedule stopped running at some point while retention kept',
                  '  expiring objects. Treat that one as an incident, not as a flaky run.',
                  '',
                  `First failing run: ${runUrl}`,
                  `Date: ${today}`,
                  '',
                  'Triage: read the run log first, it names which of the above happened.',
                  '`--dry-run` reports the plan (dates, tiers, object keys) and validates the',
                  'retention values, but it reads NO secret and makes NO network call, so it',
                  'cannot tell you whether a secret is missing or invalid; check the `backups`',
                  'environment secrets directly for that. See docs/operations/runbook.md section 6',
                  'for the required secrets and the restore procedure.',
                  '',
                  'This issue accumulates one comment per failing run and closes itself',
                  'once a scheduled run succeeds; the next failure opens a fresh issue.',
                ].join('\n')

      - name: File or comment on the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[db-backup]'
          summary: scheduled database backup failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: The scheduled database backup did not complete again.

  resolve:
    name: Resolve the tracking issue
    needs: backup
    # Every one of these issue bodies used to end by asking a human to close the issue
    # once a run went green. Nobody ever did, so five stale issues accumulated on one
    # shared `ci-failure` label and a NEW alert became indistinguishable from standing
    # backlog. Closing is now the workflow's job.
    #
    # Gated on the needed job's explicit result rather than `success()`, because a
    # SKIPPED dependency does not fail `success()` and would close the issue on a run
    # that proved nothing.
    #
    # `&& github.event_name == 'schedule'` on top of that, because `needs.backup.result
    # == 'success'` alone is satisfiable with the SCHEDULE dead: a scheduled run
    # cancelled at the `cancel-in-progress: false` concurrency gate above dispatches
    # ZERO jobs, so `backup` never runs and never reports failure, but a subsequent
    # green `workflow_dispatch` would still close the issue while nothing had proven
    # the schedule itself works. Issue #667 is why that matters here rather than in
    # the abstract: this workflow really did sit cancelled at that gate for sixteen
    # consecutive nights (2026-08-11 to 2026-08-26) with no job dispatched and no
    # failure reported. Auto-close did not exist during the outage, so nothing was
    # wrongly closed; this guard is what keeps the fix from introducing that failure
    # alongside the alerting it adds.
    if: needs.backup.result == 'success' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[db-backup]'
          mode: resolve
