---
# Release Workflow (two-phase, ruleset-compatible)
#
# The default-branch rulesets (PRs required, merge queue, required
# signatures, required status checks) reject any direct push to main, so
# python-semantic-release's built-in "commit the bump to main" flow can
# never work here (issue #157; GH013 on every run). This workflow splits
# the release into two phases that respect the rulesets:
#
#   1. propose  - once a day on a schedule (and on demand via
#      workflow_dispatch), batching every merge since the last tag:
#      compute the next version from conventional commits, then run
#      python-semantic-release's writer (--no-commit/--no-tag/--no-push) to
#      bump pyproject.toml and splice the new version section into
#      CHANGELOG.md, re-lock (uv lock), inject the Keep-a-Changelog
#      compare-link footer PSR omits, assert the artifacts, and open a
#      version-bump PR with auto-merge so it flows through the merge queue
#      like any other change.
#   2. publish  - when that release PR's squash commit
#      ("chore(release): vX.Y.Z") lands on main: create the vX.Y.Z tag
#      and the GitHub Release with the generated CHANGELOG section as the
#      release notes.
#
# CHANGELOG.md is GENERATED at release time from Conventional Commits (PSR
# mode="update" splices each version in at the insertion flag, preserving
# history); it is no longer hand-curated per PR. This is what eliminated the
# per-PR "[Unreleased]" edit that made every merge-queue PR conflict on the
# changelog. The templates/ dir holds PSR's bundled markdown templates,
# patched only to emit Keep-a-Changelog headings.
#
# The PyPI publish step was removed: this app is not a PyPI package and
# the step never had a dist/ to upload (issue #158).
#
# Requires the RELEASE_TOKEN secret (fine-grained PAT: contents write +
# pull requests write on this repo). The propose phase must create its
# branch and PR with a token other than GITHUB_TOKEN, because events
# created with GITHUB_TOKEN do not trigger workflows and the release PR
# would sit forever with no CI Gate to satisfy the merge queue.
#
# The release-bump commit is built via the GraphQL createCommitOnBranch
# mutation instead of local `git commit` + `git push`: this repo's branch
# protection requires every commit to carry a verified signature, and a
# plain local commit is never signed. GitHub signs commits it constructs
# itself through its API, so this needs no GPG key management in CI.
#
# Injection note: github.event.head_commit.message appears ONLY inside
# `if:` expressions (never interpolated into run: shell); all dynamic
# values reach shell steps via env vars.
name: Semantic Release

"on":
  # The two jobs below deliberately take DIFFERENT triggers.
  #
  # `publish` needs `push`: it fires when the "chore(release):" commit lands on
  # main, and its guard reads github.event.head_commit.message, which exists
  # only on a push event. Do not move it to the schedule.
  #
  # `propose` runs on the schedule instead of on every push, so a day's merges
  # are batched into ONE release PR (one version bump, one tag, one changelog
  # section listing every PR) rather than one release per merge. PSR computes
  # the bump from every commit since the last tag, so batching changes the
  # cadence and not the resulting version.
  push:
    branches:
      - main

  # 01:00 UTC daily. Chosen to sit before the homelab Portainer stack's 02:19
  # UTC force-pull of :latest, so a day's work is normally versioned, tagged
  # and rebuilt before production picks it up, keeping the deployed image's
  # org.opencontainers.image.revision traceable to a released tag.
  # That 02:19 pull is a Portainer Business GitOps stack auto-update. It is
  # configured in the Portainer console (Stacks > cyo-adventure > automatic
  # updates), NOT in this repo and NOT in homelab-infra, so grepping either
  # tree for the time finds nothing. Confirm or change it there, and re-check
  # it if this cron moves.
  # #ASSUME timing: the release PR clears CI and the merge queue inside that
  # ~80-minute window. #VERIFY nothing breaks if it does not; the deploy tracks
  # :latest rather than the tag, so a late release only delays tag/changelog
  # hygiene by a day. Adjust the hour here if the window proves too tight.
  # #EDGE external-resource: GitHub delays or drops scheduled runs under load,
  # and disables schedules after 60 days of repository inactivity.
  # #VERIFY a missed day self-heals: the next run still sees every commit since
  # the last tag, so nothing is lost, it is only released later.
  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:
    inputs:
      force_level:
        # 'auto', not '': an empty `choice` option is not valid workflow
        # syntax (actionlint syntax-check), and it renders as a blank row in
        # the dispatch UI that reads as a missing entry rather than as the
        # default. Both consumers below treat 'auto' and '' alike, because a
        # `schedule` run supplies neither.
        description: 'Force bump level (auto = let Conventional Commits decide)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: 'Compute and print the release plan without opening a PR'
        required: false
        type: boolean
        default: false

# Prevent concurrent releases
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

# python-semantic-release is version-pinned below, but `uvx` resolves its
# DEPENDENCY closure fresh on every invocation and ignores this repo's
# uv.lock. GitPython 3.1.60 removed `Actor.name_email_regex`, which PSR
# 10.6.1 calls, so both scheduled runs after 2026-08-25 failed at "Compute
# next version" with no change to this repository (runs 32919419702 and
# 33034022397). PSR 10.6.1 is the latest release, so there is nothing to
# upgrade into; the dependency has to be constrained here instead.
#
# #CRITICAL external-resource: a pinned tool with a floating dependency
# closure is an UNPINNED build. These live at workflow scope rather than
# inline so the two `uvx --from` call sites below cannot drift apart;
# constraining one and not the other would break a release halfway through,
# after the version has already been computed.
# #VERIFY before relaxing the upper bound, confirm a PSR release supports
# GitPython >= 3.1.60: `semantic-release version --print` must print a bare
# version instead of raising AttributeError. Bisected 2026-08-27: 3.1.59
# works, 3.1.60 does not.
env:
  PSR_SPEC: "python-semantic-release==10.6.1"
  PSR_CONSTRAINTS: "gitpython<3.1.60"

jobs:
  propose:
    name: Propose Release PR
    # Runs on the daily schedule (and on demand), never on push. Batching a
    # day's merges into one release PR is the point; it also means this job
    # can no longer observe the release-bump commit landing on main, so the
    # old head_commit.message guard against re-proposing on that push is gone
    # along with the push trigger that made it necessary.
    # #ASSUME external: releases are cut only from stable main. The pipeline is
    # intentionally main-only: PSR's [branches.main] sets prerelease=false, so
    # the writer emits a clean X.Y.Z into pyproject.toml and CHANGELOG. A
    # workflow_dispatch from a develop/ or release/ branch would instead select
    # PSR's prerelease branch config (dev/rc tokens); that whole path is
    # unvalidated end to end (the writer's prerelease version string vs. what
    # `uv lock` accepts, the "## [X.Y.Z]" heading extract_changelog_section.py
    # greps for, and the live tag ruleset regex) and is deliberately blocked
    # here. #VERIFY propose runs only for refs/heads/main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            {
              echo "::error::RELEASE_TOKEN secret is not configured."
              echo "Create a fine-grained PAT (contents: read/write and"
              echo "pull requests: read/write on this repository) and add it"
              echo "as the RELEASE_TOKEN repository secret. The release PR"
              echo "must be created with a non-GITHUB_TOKEN credential;"
              echo "otherwise its CI checks never run and the merge queue"
              echo "cannot accept it."
            }
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}
          # #CRITICAL security: do not leave RELEASE_TOKEN in .git/config
          # while third-party code (uvx, uv lock) runs later in this job.
          # Nothing after this step needs git's own credential storage: the
          # version bump/changelog steps only write local files, and the
          # release commit itself is built via the GraphQL API (GH_TOKEN env
          # var, not a git push) in the "Open release PR" step below.
          # #VERIFY persist-credentials stays false.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # #CRITICAL data-integrity: this release flow keeps release state in TWO
      # places, the version in pyproject.toml (written when the release PR
      # merges) and the git tag (written by the publish job afterwards). A
      # failure between them desynchronises the pair and DEADLOCKS the
      # pipeline: PSR computes the next version from the last TAG, so it keeps
      # returning the version pyproject already carries, the NEXT == CURRENT
      # gate below reports "nothing to do", and every run exits SUCCESS having
      # released nothing. That is exactly what a transient GitHub API 503 on
      # 2026-08-17 caused; it went unnoticed for a week because the deadlock's
      # steady state is indistinguishable from a quiet day.
      # #VERIFY keep this step BEFORE "Compute next version" so the diagnosis
      # is the reported failure rather than a benign-looking no-op.
      - name: Check release state is in sync
        run: python3 scripts/check_release_tag_sync.py

      - name: Compute next version
        id: version
        env:
          # semantic-release's [tool.semantic_release.remote] config reads
          # GH_TOKEN at config-load time; version --print never calls the API.
          GH_TOKEN: ${{ github.token }}
          FORCE_LEVEL: ${{ inputs.force_level }}
        run: |
          CURRENT="$(uv version --short)"
          # Empty on a schedule/push run (inputs are unset), 'auto' when a
          # human dispatched without picking a level; neither forces a bump.
          FORCE_FLAG=""
          if [ -n "${FORCE_LEVEL}" ] && [ "${FORCE_LEVEL}" != "auto" ]; then
            FORCE_FLAG="--${FORCE_LEVEL}"
          fi
          # shellcheck disable=SC2086  # FORCE_FLAG is intentionally unquoted
          NEXT="$(uvx --from "${PSR_SPEC}" --with "${PSR_CONSTRAINTS}" \
            semantic-release version --print ${FORCE_FLAG})"
          # #ASSUME external: semantic-release prints a bare X.Y.Z(-pre)?
          # #VERIFY reject non-semver before it reaches git refs/tags/titles.
          # Match the whole string in bash: a piped `grep -Eq` anchors PER
          # LINE, so a multi-line value would pass if any single line matched,
          # and the old pattern also accepted 1.2.3.4.
          if [[ ! "${NEXT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Computed version '${NEXT}' is not valid semver."
            exit 1
          fi
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          if [ "${NEXT}" = "${CURRENT}" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since v${CURRENT}; nothing to do."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Next version: v${NEXT} (current v${CURRENT})"
          fi

      - name: Write version and changelog
        if: steps.version.outputs.released == 'true'
        env:
          # PSR's [tool.semantic_release.remote] reads GH_TOKEN at config load
          # even for a local-only write. --no-commit/--no-tag/--no-push keep
          # this a pure file mutation (version_toml bump + CHANGELOG render);
          # --no-vcs-release stops PSR creating a GitHub Release (the publish
          # job owns that); --skip-build because there is no build_command and
          # propose must not build. The signed release commit is assembled from
          # these files by the GraphQL mutation in the next step.
          GH_TOKEN: ${{ github.token }}
          FORCE_LEVEL: ${{ inputs.force_level }}
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          # Empty on a schedule/push run (inputs are unset), 'auto' when a
          # human dispatched without picking a level; neither forces a bump.
          FORCE_FLAG=""
          if [ -n "${FORCE_LEVEL}" ] && [ "${FORCE_LEVEL}" != "auto" ]; then
            FORCE_FLAG="--${FORCE_LEVEL}"
          fi
          # shellcheck disable=SC2086  # FORCE_FLAG is intentionally unquoted
          uvx --from "${PSR_SPEC}" --with "${PSR_CONSTRAINTS}" \
            semantic-release version \
              --no-commit --no-tag --no-push --no-vcs-release --skip-build \
              ${FORCE_FLAG}
          uv lock
          # PSR renders the "## [X.Y.Z]" section but not the Keep-a-Changelog
          # compare-link footer; add it so the heading resolves as a link like
          # every prior entry. Append-only at the top of the footer block, so
          # it cannot reintroduce a merge-queue conflict.
          uv run python scripts/inject_changelog_footer_link.py "${NEXT}" "${CURRENT}"

      - name: Verify release artifacts
        if: steps.version.outputs.released == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        # One source of truth shared with the publish job (issue #364); the
        # assertions and their RAD tags live in the script. The baseline for
        # the did-not-shrink check is HEAD because the bump and splice above
        # are still uncommitted edits against it.
        run: scripts/verify_release_artifacts.sh "${NEXT}" --baseline-ref HEAD

      - name: Open release PR
        if: steps.version.outputs.released == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEXT}"
          MAX_ATTEMPTS=3

          # #CRITICAL external: every GitHub API call in this step is a network
          # call that can return a transient 5xx, and until issue #757 only the
          # branch LOOKUP below was protected: the PATCH and POST that follow
          # it, `gh pr list`, `gh pr create` and `gh pr merge --auto` all ran
          # bare under `set -e`, so one 503 aborted the run at that point. That
          # is the same failure mode that deadlocked this pipeline for a week
          # (issue #752), one job over.
          # #VERIFY: every `gh` invocation in this step is retried, and the two
          # that are not wrapped in `retry_api` say why at their call site:
          # `gh api graphql` has the surrounding expectedHeadOid loop, and
          # `gh pr create` must not be blindly retried (a lost response means
          # the PR exists) so its recovery is the retried re-lookup instead.
          #
          # Output is captured rather than streamed so a retry does not print a
          # scary error for a call that then succeeded. Callers read stdout from
          # RETRY_OUT and the failure text from RETRY_ERR.
          RETRY_OUT=""
          RETRY_ERR=""
          retry_api() {
            local what="$1"
            shift
            local attempt=1
            local status=0
            local out_file err_file
            out_file="$(mktemp)"
            err_file="$(mktemp)"
            while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
              set +e
              "$@" >"${out_file}" 2>"${err_file}"
              status=$?
              set -e
              RETRY_OUT="$(cat "${out_file}")"
              RETRY_ERR="$(cat "${err_file}")"
              if [ "${status}" -eq 0 ]; then
                rm -f "${out_file}" "${err_file}"
                return 0
              fi
              echo "${what} failed (attempt ${attempt}/${MAX_ATTEMPTS}):" \
                "${RETRY_ERR}" >&2
              attempt=$((attempt + 1))
              if [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; then
                sleep 2
              fi
            done
            rm -f "${out_file}" "${err_file}"
            return "${status}"
          }

          # #CRITICAL data-integrity: close every OTHER open release/* PR before
          # touching this one (issue #755). `propose` reuses a release PR only
          # when the branch name matches exactly, and the branch name carries
          # the computed version. If yesterday's PR never merged, no tag was
          # written, so today recomputes from the same base -- and that
          # recomputation changes the moment the highest-ranking commit type in
          # the window changes (only `fix:` yesterday -> `release/v0.82.1`; a
          # `feat:` lands today -> `release/v0.83.0`). The `--head` lookup then
          # finds nothing and opens a SECOND PR, leaving the first orphaned with
          # auto-merge still armed. If whatever blocked it later clears, it
          # merges after the newer one and applies a LOWER version bump out of
          # order.
          #
          # "Only the newest computed version is ever correct" holds for an
          # AUTO-COMPUTED run, where the commit window only grows, but it is
          # FALSE for a `workflow_dispatch` run passing `force_level` (issue
          # #774). Verified against python-semantic-release 10.6.1:
          # `version_from_forced_level` does `latest_version.bump(forced_level_bump)`,
          # an absolute override computed from the latest TAG, ignoring what
          # the accumulated commits justify. Concretely: a scheduled run
          # computes v0.85.0 from a `feat:` commit and opens release/v0.85.0,
          # which stalls in the merge queue; an operator then dispatches
          # force_level=patch, PSR computes v0.84.1 from tag v0.84.0, and a
          # branch-name-only cleanup would close the still-correct v0.85.0 PR
          # and ship v0.84.1, silently dropping the minor bump the `feat:`
          # commit warranted. The fix is to compare VERSIONS, not branch
          # names: a stale PR is closed only when its version is not higher
          # than this run's ${NEXT}. Auto-merge is disabled BEFORE the close,
          # not after: if the close were to fail, an armed PR must not be
          # what is left behind.
          #
          # This runs before the clean-tree early exit below on purpose. A
          # re-run that finds the bump already applied still needs the stale PR
          # gone, and that path returns without reaching any of the code after
          # it.
          # #VERIFY: at most one open release/* PR with a version <= ${NEXT}
          # exists once this step returns; a higher-version PR survives with a
          # `::warning::` explaining why.
          if ! retry_api "listing open release PRs" \
              gh pr list --state open --limit 100 --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("release/")) | "\(.number) \(.headRefName)"'; then
            echo "::error::Could not list open release PRs: ${RETRY_ERR}"
            exit 1
          fi
          # #ASSUME data-integrity: release branch names are always
          # `release/vMAJOR.MINOR.PATCH` (no prerelease/build metadata
          # segment), matching how this same step builds ${BRANCH} above.
          # `sort -V` gives a correct numeric-field comparison without a
          # hand-rolled split, and unlike a lexical string comparison it does
          # not rank "0.9.0" above "0.10.0". #VERIFY
          # tests/unit/test_release_propose_contract.py
          # ::TestForcedRunsDoNotCloseAHigherVersionPr
          # ::test_the_version_comparison_is_numeric_via_sort_v_not_lexical
          version_gt() {
            [ "$1" != "$2" ] && \
              [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }
          while read -r STALE_NUMBER STALE_BRANCH; do
            [ -n "${STALE_NUMBER}" ] || continue
            [ "${STALE_BRANCH}" != "${BRANCH}" ] || continue
            STALE_VERSION="${STALE_BRANCH#release/v}"
            # #CRITICAL data-integrity: a `force_level` dispatch can compute a
            # LOWER version than an already-open, still-correct release PR
            # (#774, see the block comment above). Closing on branch identity
            # alone would silently drop whatever higher bump that PR carries.
            # #VERIFY
            # tests/unit/test_release_propose_contract.py
            # ::TestForcedRunsDoNotCloseAHigherVersionPr
            # ::test_a_higher_version_stale_pr_is_skipped_before_the_close
            if version_gt "${STALE_VERSION}" "${NEXT}"; then
              echo "::warning::Not closing #${STALE_NUMBER}" \
                "(${STALE_BRANCH}): its version v${STALE_VERSION} is higher" \
                "than this run's computed v${NEXT}. A force_level dispatch" \
                "computes from the latest tag and can be numerically lower" \
                "than an unmerged higher-version PR; that PR is not" \
                "superseded (#774). Merge or close it by hand if it is" \
                "genuinely stale."
              continue
            fi
            echo "Closing superseded release PR #${STALE_NUMBER}" \
              "(${STALE_BRANCH}); v${NEXT} supersedes it."
            # A PR with auto-merge never enabled makes this exit non-zero, which
            # is not a failure: the post-condition (auto-merge is off) already
            # holds. The close below is what must succeed.
            retry_api "disabling auto-merge on #${STALE_NUMBER}" \
              gh pr merge "${STALE_NUMBER}" --disable-auto || true
            if ! retry_api "closing superseded release PR #${STALE_NUMBER}" \
                gh pr close "${STALE_NUMBER}" \
                  --comment "$(printf '%s' \
                    "Superseded by the release PR for v${NEXT}. This branch's " \
                    "version was recomputed from the same base after it did not " \
                    "merge, so merging it now would apply a lower version bump " \
                    "out of order (#755).")"; then
              echo "::error::Could not close superseded release PR" \
                "#${STALE_NUMBER} (${STALE_BRANCH}): ${RETRY_ERR}. It still" \
                "carries auto-merge state that could apply an out-of-order" \
                "version bump; close it by hand before re-running."
              exit 1
            fi
          done <<< "${RETRY_OUT}"

          # #EDGE external: a re-run after a partial run (or after the hard-fail
          # auto-merge path below) can reach here with the bump already applied
          # and nothing changed on disk vs. HEAD; there is nothing new to
          # commit. Detect that and exit cleanly, matching the idempotent-
          # re-run intent. #VERIFY skip commit/push/PR when the tree is clean.
          if git diff --quiet -- pyproject.toml uv.lock CHANGELOG.md; then
            echo "No release changes to commit for v${NEXT}; the bump is" \
              "already applied. Nothing to do."
            exit 0
          fi
          # #CRITICAL security: this repo's branch protection requires every
          # commit to carry a verified signature. A plain local `git commit`
          # (even with a spoofed github-actions[bot] git config identity, the
          # prior approach) is never signed and permanently blocks the
          # resulting PR from merging - this is what broke PR #241. Rather
          # than provision and rotate a GPG key for a bot identity, build the
          # commit server-side via the GraphQL createCommitOnBranch mutation:
          # GitHub signs commits it constructs itself through its API, so the
          # result shows "Verified" with no key management in CI. Probed
          # against this repo on a disposable branch before wiring this in
          # (confirmed verified=true, reason="valid").
          # #VERIFY every release commit shows "Verified" on GitHub; if this
          # ever regresses, fix the commit-creation path here, do not
          # `--no-verify`/admin-merge past the signature requirement.
          #
          # #EDGE concurrency: the ref-reset (REST, below) and the mutation
          # (GraphQL) hit separate GitHub API surfaces with no read-after-
          # write guarantee between them, so expectedHeadOid can transiently
          # mismatch the branch's observed head immediately after we set it.
          # #VERIFY a transient mismatch is retried, not treated as a hard
          # failure, before this step gives up.
          BASE_SHA="$(git rev-parse HEAD)"

          # shellcheck disable=SC2016  # literal GraphQL text, expansion not wanted
          QUERY='mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } } }'

          # #CRITICAL external: uv.lock alone base64-encodes to roughly 1MB;
          # passed as a `jq --arg` value it becomes part of that process's
          # argv, and combined with the runner's environment this can exceed
          # the kernel's execve() argument-list limit ("jq: Argument list too
          # long", exit 126) -- observed on the first real run of this
          # pipeline. `--rawfile` reads file content directly instead of
          # putting it on the command line, so lockfile growth cannot
          # reintroduce an argv-size failure through this path. #VERIFY if
          # uv.lock or CHANGELOG.md ever approach GitHub's GraphQL request
          # body-size limit (a distinct ceiling from execve() argv), split
          # fileChanges across multiple mutations rather than reverting to
          # --arg/--argjson.
          PYPROJECT_B64="$(mktemp)"
          UVLOCK_B64="$(mktemp)"
          CHANGELOG_B64="$(mktemp)"
          base64 -w0 pyproject.toml > "${PYPROJECT_B64}"
          base64 -w0 uv.lock > "${UVLOCK_B64}"
          base64 -w0 CHANGELOG.md > "${CHANGELOG_B64}"

          COMMIT_OID=""
          ATTEMPT=1
          # MAX_ATTEMPTS is set at the top of this step; `retry_api` reads it too.
          while [ -z "${COMMIT_OID}" ] && [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
            # Release branches are machine-owned; reset the ref to the
            # current main tip on every attempt so a retry (or a recomputed
            # version) is idempotent, mirroring the previous force-push
            # behavior.
            #
            # Distinguish a genuine 404 (branch does not exist yet) from any
            # other lookup failure (rate-limit, auth, transient 5xx): only a
            # confirmed 404 should route to branch creation. Any other
            # failure falling through to `POST .../git/refs` on a branch
            # that DOES exist would hard-fail under `set -e` outside this
            # retry loop.
            set +e
            LOOKUP_ERR="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" \
              2>&1 >/dev/null)"
            LOOKUP_STATUS=$?
            set -e
            # Issue #757: these two mutations used to run bare, so a transient
            # 5xx on either aborted the run under `set -e` WITHOUT re-entering
            # this loop -- the careful non-404 handling below protected only the
            # read. `retry_api` gives them the same protection.
            if [ "${LOOKUP_STATUS}" -eq 0 ]; then
              if ! retry_api "resetting ${BRANCH} to ${BASE_SHA}" \
                  gh api -X PATCH \
                    "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
                    -f sha="${BASE_SHA}" -F force=true; then
                echo "::error::Could not reset ${BRANCH}: ${RETRY_ERR}"
                exit 1
              fi
            elif echo "${LOOKUP_ERR}" | grep -q "HTTP 404"; then
              # #CRITICAL external: `POST .../git/refs` is NOT idempotent, so
              # it must not sit inside `retry_api` the way the PATCH above
              # does. If this POST succeeds server-side but the response is
              # lost (network drop, timeout), a blind retry re-POSTs and gets
              # back HTTP 422 "Reference already exists", and the step would
              # hard-fail even though the branch now exists. `gh pr create`
              # below is deliberately exempted from `retry_api` for the exact
              # same reason; this mirrors that discipline instead of
              # reinventing it. Recovery is the idempotent GET re-lookup: on
              # a failed create, ask GitHub whether the branch landed anyway,
              # and treat "the ref exists and points at BASE_SHA" as success.
              # A ref that exists but points somewhere ELSE is a genuinely
              # different situation, a real conflict rather than a lost
              # response, and must still hard-fail. #VERIFY
              # tests/unit/test_release_propose_contract.py
              # ::TestTheBranchCreatePostIsNotBlindlyRetried
              set +e
              POST_ERR="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${BRANCH}" -f sha="${BASE_SHA}" 2>&1 >/dev/null)"
              POST_STATUS=$?
              set -e
              if [ "${POST_STATUS}" -ne 0 ]; then
                echo "Creating ${BRANCH} reported a failure; asking GitHub" \
                  "whether it landed anyway: ${POST_ERR}" >&2
                if ! retry_api "re-checking ${BRANCH} after a failed create" \
                    gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" \
                      --jq '.object.sha'; then
                  echo "::error::Could not create ${BRANCH}: ${POST_ERR}." \
                    "It still does not exist: ${RETRY_ERR}"
                  exit 1
                fi
                CREATED_SHA="${RETRY_OUT}"
                if [ "${CREATED_SHA}" != "${BASE_SHA}" ]; then
                  echo "::error::${BRANCH} exists but points at" \
                    "${CREATED_SHA}, not the expected ${BASE_SHA}" \
                    "(create reported: ${POST_ERR})."
                  exit 1
                fi
              fi
            else
              echo "Branch lookup for ${BRANCH} failed with a non-404 error" \
                "(attempt ${ATTEMPT}/${MAX_ATTEMPTS}): ${LOOKUP_ERR}" >&2
              if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                sleep 2
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              echo "::error::Branch lookup for ${BRANCH} kept failing:" \
                "${LOOKUP_ERR}"
              exit 1
            fi

            # #CRITICAL external: a failed commit-creation call must not fall
            # through to `gh pr create` against a branch left on its prior
            # (stale or nonexistent) commit; fail loudly instead of silently
            # opening/reusing a PR with no new bump commit. #VERIFY commit
            # creation errors are a hard failure, not a swallowed warning.
            #
            # `gh api graphql` exits non-zero whenever the response body
            # carries a top-level `errors` array; under this step's default
            # `set -e`, letting that propagate would abort the script before
            # the diagnostic below ever runs. Capture the exit code
            # explicitly instead of relying on set -e to report it.
            #
            # The whole request body is built in a single jq invocation so
            # the large file contents only ever enter via --rawfile (a file
            # read); an intermediate $(jq ...) result reused via --argjson
            # would put that same huge string back onto a command line and
            # reintroduce the argv-size failure this block exists to avoid.
            set +e
            RESPONSE="$(jq -n \
              --arg q "${QUERY}" \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg branch "${BRANCH}" \
              --arg oid "${BASE_SHA}" \
              --arg headline "chore(release): v${NEXT}" \
              --rawfile pyproject "${PYPROJECT_B64}" \
              --rawfile uvlock "${UVLOCK_B64}" \
              --rawfile changelog "${CHANGELOG_B64}" \
              '{
                query: $q,
                variables: {
                  input: {
                    branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                    message: {headline: $headline},
                    expectedHeadOid: $oid,
                    fileChanges: {
                      additions: [
                        {path: "pyproject.toml", contents: $pyproject},
                        {path: "uv.lock", contents: $uvlock},
                        {path: "CHANGELOG.md", contents: $changelog}
                      ]
                    }
                  }
                }
              }' | gh api graphql --input - 2>&1)"
            GQL_EXIT=$?
            set -e
            if [ "${GQL_EXIT}" -eq 0 ]; then
              COMMIT_OID="$(echo "${RESPONSE}" | jq -r '.data.createCommitOnBranch.commit.oid // empty')"
            fi
            if [ -z "${COMMIT_OID}" ]; then
              if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ] \
                  && echo "${RESPONSE}" | grep -qi "expectedHeadOid\|does not match\|head sha"; then
                echo "createCommitOnBranch attempt ${ATTEMPT} hit an" \
                  "expectedHeadOid mismatch (likely REST/GraphQL read-after-" \
                  "write race); retrying." >&2
                sleep 2
              else
                echo "::error::createCommitOnBranch failed for ${BRANCH}" \
                  "(attempt ${ATTEMPT}/${MAX_ATTEMPTS}): ${RESPONSE}"
                exit 1
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          rm -f "${PYPROJECT_B64}" "${UVLOCK_B64}" "${CHANGELOG_B64}"
          # #CRITICAL security: don't just trust that createCommitOnBranch
          # produced a verified commit; ask GitHub to confirm it. This is the
          # exact class of bug that stalled PR #241 for days with green CI
          # and auto-merge enabled and nothing flagging it: a release commit
          # that branch protection would reject sat unnoticed until a human
          # happened to open the merge UI. Failing the job here turns that
          # into an immediate, visible CI failure instead of a silent stall.
          # #VERIFY every release commit is confirmed Verified before this
          # step is allowed to succeed; if this ever fires, fix the
          # commit-creation path above, do not admin-merge past it.
          if ! retry_api "reading the signature status of ${COMMIT_OID}" \
              gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_OID}" \
                --jq '.commit.verification.verified'; then
            echo "::error::Could not read the signature status of release" \
              "commit ${COMMIT_OID}: ${RETRY_ERR}. Treating an unreadable" \
              "verification as unverified rather than assuming it is fine."
            exit 1
          fi
          VERIFIED="${RETRY_OUT}"
          if [ "${VERIFIED}" != "true" ]; then
            REASON="unknown"
            if retry_api "reading the signature reason for ${COMMIT_OID}" \
                gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_OID}" \
                  --jq '.commit.verification.reason'; then
              REASON="${RETRY_OUT}"
            fi
            echo "::error::Release commit ${COMMIT_OID} on ${BRANCH} is not" \
              "verified (reason: ${REASON}). Branch protection will block" \
              "this PR from merging; fix the commit-creation path in this" \
              "workflow rather than merging around it."
            exit 1
          fi
          # Reuse an existing open release PR for this branch, else create one.
          find_release_pr() {
            retry_api "looking up the release PR for ${BRANCH}" \
              gh pr list --head "${BRANCH}" --state open \
                --json number --jq '.[0].number // empty'
          }
          if ! find_release_pr; then
            echo "::error::Could not look up the release PR for ${BRANCH}:" \
              "${RETRY_ERR}"
            exit 1
          fi
          PR_NUMBER="${RETRY_OUT}"
          if [ -z "${PR_NUMBER}" ]; then
            # #CRITICAL external: `gh pr create` is NOT wrapped in retry_api.
            # A create whose response was lost in transit has still created the
            # PR, so a blind retry opens a duplicate -- the exact orphaned-PR
            # state the cleanup at the top of this step exists to prevent. The
            # re-lookup below is the retry: it is idempotent, it is already
            # retried, and it distinguishes "created but unreported" from
            # "never created" by asking GitHub instead of guessing.
            # #VERIFY: no retry wraps `gh pr create`; recovery is the re-lookup.
            set +e
            CREATE_ERR="$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore(release): v${NEXT}" \
              --body "$(printf '%s\n' \
                "Automated version bump to v${NEXT}." \
                "" \
                "Regenerates the CHANGELOG from Conventional Commits via" \
                "python-semantic-release and bumps pyproject.toml plus uv.lock." \
                "When this PR merges, the publish job in release.yml creates" \
                "the tag and GitHub Release." \
                "" \
                "Closes #183" \
                "Closes #157" \
                "Closes #158")" 2>&1 >/dev/null)"
            CREATE_STATUS=$?
            set -e
            if [ "${CREATE_STATUS}" -ne 0 ]; then
              echo "gh pr create for ${BRANCH} reported a failure; asking" \
                "GitHub whether it landed anyway: ${CREATE_ERR}" >&2
            fi
            if ! find_release_pr; then
              echo "::error::Could not look up the release PR for ${BRANCH}" \
                "after creating it: ${RETRY_ERR}"
              exit 1
            fi
            PR_NUMBER="${RETRY_OUT}"
          fi
          # #CRITICAL external: an empty PR number means the release silently
          # stalls; fail loudly instead of feeding "null" to gh pr merge.
          # #VERIFY empty PR_NUMBER is a hard error, not a swallowed warning.
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::Could not resolve the release PR for ${BRANCH}."
            exit 1
          fi
          # #CRITICAL external: a failed auto-merge enable would otherwise leave
          # the release PR open with green CI and nothing flagging the stalled
          # release/v* branch, the exact silent stall this pipeline exists to
          # prevent. Re-running is safe (branch force-push + PR reuse), so fail
          # hard rather than emit a swallowed warning, matching the empty
          # PR_NUMBER guard above. #VERIFY a failed `gh pr merge --auto` is a
          # hard error (exit 1), not a warning.
          if ! retry_api "enabling auto-merge on #${PR_NUMBER}" \
              gh pr merge "${PR_NUMBER}" --auto; then
            echo "::error::Could not enable auto-merge on release PR" \
              "#${PR_NUMBER}; re-run the workflow or merge it manually to" \
              "publish v${NEXT}."
            exit 1
          fi

      - name: Dry-run summary
        if: steps.version.outputs.released == 'true' && inputs.dry_run
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # The writer step already ran (it is gated on `released`, not
          # `dry_run`), so the bumped files exist on disk; show the reviewer
          # exactly what would be committed without opening a PR.
          {
            echo "Dry run: would open a release PR for v${NEXT}."
            echo ""
            echo "### Files changed"
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "### Generated CHANGELOG section for v${NEXT}"
            echo '```markdown'
            echo "## [${NEXT}]"
            uv run python scripts/extract_changelog_section.py "${NEXT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Tag and GitHub Release
    # #ASSUME external-resource: the merge queue squash-merges the release PR
    # using its "chore(release): vX.Y.Z" title as the commit subject, so this
    # prefix match fires. If the repo's squash-merge commit-message setting drifts
    # (e.g. to the PR number or the default merge message), publish silently
    # never runs and every release stalls. #VERIFY the repo keeps "Default
    # commit message" = "Pull request title" for squash merges (Settings >
    # General > Pull Requests > Allow squash merging).
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 so HEAD~1 (the parent of the squash-merged release commit)
          # exists as the CHANGELOG.md baseline for the did-not-shrink check in
          # the verify step below. The default depth of 1 has no parent.
          fetch-depth: 2

      - name: Verify release artifacts
        # #CRITICAL data-integrity: re-run the same assertions the propose job
        # made (issue #364). The merged commit is what gets tagged, and it is
        # not the tree propose verified: a merge-queue rebase or an edit on the
        # release branch can change it. A mismatch here fails the job before
        # any tag or GitHub Release exists, so nothing half-published is left
        # behind. #VERIFY this step precedes "Create tag and GitHub Release"
        # and has no continue-on-error.
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -Po '^version = "\K[^"]+' pyproject.toml)"
          scripts/verify_release_artifacts.sh "${VERSION}" --baseline-ref HEAD~1

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 -Po '^version = "\K[^"]+' pyproject.toml)"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; nothing to do."
            exit 0
          fi
          python scripts/extract_changelog_section.py "${VERSION}" > release-notes.md
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md

  alert:
    name: Alert on failure or cancellation
    needs: [propose, publish]
    # `failure() || cancelled()`, not `failure()` alone: `failure()` does not match a
    # cancellation, and a cancelled release leaves the pipeline in exactly the state
    # this workflow exists to avoid.
    #
    # #CRITICAL external-resource: `propose` now runs unattended on a schedule, so
    # nobody is watching the Actions tab when it fails. The 2026-08-17 incident was a
    # transient API 503 in `publish` that nobody noticed for a week, which is the same
    # silence in the other job.
    # #VERIFY this job files or comments on a `ci-failure` issue so a failure produces
    # a GitHub notification rather than only a red run.
    #
    # `needs` names both jobs deliberately. Only one of them runs per event (`propose`
    # on schedule/dispatch, `publish` on push), and a skipped `need` does not suppress
    # a job whose `if:` does not test `success()`.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write, isolated to this job, so neither release job holds it while running
      # repository code with the RELEASE_TOKEN in scope.
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the composite action is needed. A local `uses: ./...` requires a
          # checkout, and this job previously had none.
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compose the issue body
        # Same alerting pattern as supabase-backup.yml's `alert` job: find an OPEN issue
        # labelled `ci-failure` whose title starts with this workflow's marker and comment
        # on it, or open one if none exists, so repo watchers get GitHub's native
        # notification instead of a red run nobody looks for.
        #
        # This covers a release job that FAILS. It cannot cover one that never runs at all
        # (a schedule GitHub disabled after 60 days of repository inactivity, a deleted
        # secret), because there is no run to report. That gap is covered inside the
        # pipeline instead, by scripts/check_release_tag_sync.py, which fails the next
        # `propose` that does happen when the version and tag have desynced.
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            return [
                  'The `Release` workflow (`.github/workflows/release.yml`) did not complete: ' +
                    'it either failed or was cancelled.',
                  '',
                  'The pipeline has two jobs and they fail differently:',
                  '',
                  '- `propose` (daily 01:00 UTC schedule) opens the `release/vX.Y.Z` PR. ' +
                    'A failure here means no release PR for that day, and merges keep accumulating.',
                  '- `publish` (push of a `chore(release):` commit) creates the tag and GitHub Release. ' +
                    'A failure here leaves `pyproject.toml` bumped with no matching tag, which DEADLOCKS ' +
                    'the pipeline: every later `propose` recomputes the same version forever.',
                  '',
                  'The `publish` case is the 2026-08-17 incident. This issue is NOT closed on the ' +
                    'strength of any green run: a green `propose` does not prove the tag exists, so only ' +
                    'a successful `publish` closes it automatically.',
                  '',
                  'Diagnosis and recovery: `docs/operations/runbook.md` section 7.2.',
                  '',
                  `Run: ${runUrl}`,
                ].join('\n')

      - name: File or comment on the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[release]'
          summary: release workflow failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: The release workflow did not complete again.

  resolve:
    name: Resolve the tracking issue
    needs: [publish]
    # Every one of these issue bodies used to end by asking a human to close the issue
    # once a run went green. Nobody ever did, so five stale issues accumulated on one
    # shared `ci-failure` label and a NEW alert became indistinguishable from standing
    # backlog. Closing is now the workflow's job.
    #
    # `publish` ONLY, deliberately. The issue body warns that a green `propose` does
    # not prove the tag exists, and that warning is the 2026-08-17 deadlock: `publish`
    # failed after the version bump, leaving no tag. Only a `publish` that created the
    # tag and the GitHub Release proves the cycle completed, so that is the one result
    # allowed to close the issue.
    #
    # `needs` used to be [propose, publish], on the theory that the explicit
    # `needs.publish.result == 'success'` check below was gate enough on its own. It
    # was not: GitHub Actions checks that every job listed in `needs` completed
    # successfully (a skipped job does not count as success) BEFORE it evaluates this
    # job's `if:` at all, unless that `if:` itself calls always(), success(),
    # failure(), or cancelled(). This job's `if:` calls none of those, so the implicit
    # check silently required `propose` to succeed too. `propose` runs only on
    # schedule/workflow_dispatch and `publish` runs only on push, so the two never run
    # on the same event: `propose` was always skipped on the push that runs `publish`,
    # which made `resolve` unreachable on every real release. Observed directly on run
    # 33140125879, a fully successful v0.84.0 release that still reported `resolve` as
    # skipped. Listing only `publish` in `needs` fixes this: the implicit success
    # check now looks at `publish` alone, so it is satisfied exactly when `publish`
    # actually ran and succeeded, and the explicit `if:` below still refuses to close
    # the issue on anything else (a skipped or failed `publish`).
    # #VERIFY a release that reaches `publish` also reaches `resolve` and closes the
    # tracking issue, rather than reporting `resolve` as skipped again.
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[release]'
          mode: resolve
