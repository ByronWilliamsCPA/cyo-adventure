# CYO Adventure - SonarCloud Analysis
# Thin caller for the organization's reusable SonarCloud workflow.
#
# The reusable workflow uses sonarqube-scan-action v7.2.0, which resolves
# the /analysis/analyses 404 bug encountered with v4.x on new projects.
#
# SonarCloud Dashboard: https://sonarcloud.io/dashboard?id=ByronWilliamsCPA_cyo-adventure
#
# Note: This workflow requires SONAR_TOKEN secret to be configured.
# If not configured, the reusable workflow will skip gracefully.
name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  # No pull_request, no merge_group. A prior version of this workflow tried
  # `no-build: true` on pull_request to skip the coverage-generating pytest
  # run and get fast static-only Sonar feedback; that failed every PR run
  # with `error: Distribution cyo-adventure==... @ editable+. can't be
  # installed because it is marked as --no-build but has no binary
  # distribution` (uv exit code 2) -- `--no-build` means "only install
  # pre-built wheels," which this local editable-only package (no published
  # wheel) can never satisfy. There is no known lighter-weight input on the
  # reusable workflow (ByronWilliamsCPA/.github/python-sonarcloud.yml, not
  # read from this repo) that installs deps without running the full test
  # suite, so a fast, correct pull_request path isn't available without
  # reading that workflow's source first. `fail-on-quality-gate` below is
  # already forced off outside `push`, so a PR-time run was always advisory
  # with no way to act on the result; push-to-main keeps full, gate-enforced,
  # coverage-backed analysis on every merge.
  # That workflow was read on 2026-08-24 and the answer is no: its inputs are
  # sonar-organization, sonar-project-key, python-version, sonar-python-version,
  # source-directory, coverage-paths, coverage-exclusions, test-exclusions,
  # extra-dependencies, pytest-args, fail-on-quality-gate, skip-if-no-token,
  # timeout-minutes, sonar-scanner-version, additional-sonar-args,
  # coverage-artifact-retention and no-build. None of them installs
  # dependencies while skipping the test run, so a fast PR path still needs a
  # change in ByronWilliamsCPA/.github rather than a different input here.
  # Recorded so the next session does not repeat the investigation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    permissions:
      contents: read
      pull-requests: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@50e3c9783a7f43613651d5c5688d99cb748a8a22  # main
    with:
      sonar-organization: 'byronwilliamscpa'
      sonar-project-key: 'ByronWilliamsCPA_cyo-adventure'
      # 3.14 matches the primary runtime/CI target since the #295 upgrade.
      # It was chosen here even before that flip: under CPython 3.12
      # coverage.py silently drops the async handler bodies in
      # api/profiles.py (tests pass, lines execute, zero hits recorded;
      # reproduced with both the sysmon and ctrace cores and with coverage
      # 7.6/7.14). 3.14 records them correctly, so it is the truthful
      # measurement interpreter.
      python-version: '3.14'
      # The interpreter the scan RUNS on (above) is not the version range the
      # code must SUPPORT. `requires-python = ">=3.11"` and
      # python-compatibility.yml runs a live 3.11 leg, so declaring 3.14 alone
      # told the analyzer this is a 3.14-only project and it raised 5 PEP 695
      # findings (S6794/S6796) proposing syntax that is a SyntaxError on 3.11.
      # #ASSUME: data integrity: the version gate is allMatch over this list
      # (PythonVersionUtils.areSourcePythonVersionsGreaterOrEqualThan), so the
      # LOWEST entry decides whether a version-gated rule fires; an entry below
      # the real floor would silence rules that should fire.
      # #VERIFY: keep this list equal to the `requires-python` floor through
      # the primary target, and read the first analysis after any change as a
      # diff, since a wider declaration can also surface new findings.
      sonar-python-version: '3.11,3.12,3.13,3.14'
      source-directory: 'src'
      coverage-paths: 'coverage.xml'
      # Advisory except on push to a protected branch (see the `on:` comment
      # above for why pull_request/merge_group are excluded entirely rather
      # than run advisory-and-slow).
      fail-on-quality-gate: ${{ github.event_name == 'push' }}
      skip-if-no-token: true
      no-build: false  # generated project ships as an installable package; upstream default of true would block 'uv sync' from installing the editable project for coverage
      # Widen analysis to the React tree. `source-directory` cannot carry a
      # comma list: the reusable workflow also uses it as the coverage root
      # (`if [ -d "$SOURCE_DIRECTORY" ]`), so 'src,frontend/src' fails that
      # test, falls back to `pytest --cov=.` and measures coverage over the
      # whole repository. These overrides go through `additional-sonar-args`,
      # which the reusable workflow appends AFTER its own -D flags.
      #
      # #ASSUME: external resources: sonar-scanner resolves a repeated -D key
      #   last-wins, so the -Dsonar.sources here supersedes the
      #   -Dsonar.sources=src the reusable workflow emits earlier on the same
      #   command line. If it is first-wins instead, this is a silent no-op
      #   and the frontend stays unanalyzed while the run still goes green.
      # #VERIFY: after the first push to main that runs this, open the
      #   SonarCloud project and confirm the language breakdown lists
      #   TypeScript with a non-zero line count, AND that the analysed file
      #   count excludes the frontend test files (they are excluded below, so
      #   ~383 minus 176). Do not infer either from a green run: an ignored
      #   override and a clean scan look identical here. Tracked as UW-C366.
      #
      # frontend/src/client/** is generated by @hey-api/openapi-ts and is
      # rewritten wholesale on every contract change, so findings there are
      # not actionable. Coverage excludes frontend/** because this workflow
      # runs pytest only and never produces a JS lcov report; without the
      # exclusion every TS file would report 0% and drag the coverage
      # measurement down for a reason that has nothing to do with the code.
      #
      # The *.test/*.spec exclusions matter more than they look. `sonar.tests`
      # stays `tests/` (Python) while `sonar.sources` gains the React tree, and
      # frontend tests are colocated with the code, so without these patterns
      # 176 of the newly analysed files would be scored as PRODUCTION source:
      # test doubles read as duplicated blocks, and `new_duplicated_lines_density
      # > 3` is a `Sonar way` condition that fails the gate on push to main.
      # Excluding them is the conservative half of the fix. Promoting them to
      # `sonar.tests` with `sonar.test.inclusions` is the better end state, but
      # it risks a "file can't be indexed twice" scanner error that this repo
      # cannot rehearse before merge (no pull_request trigger, by the dated
      # decision recorded in the `on:` block above), and configuring test
      # classification for a tree not yet confirmed to be analysed at all is
      # out of order. Sequenced behind the #VERIFY below, in UW-C366.
      #
      # NOTE on precedence: the reusable workflow emits -Dsonar.organization,
      # -Dsonar.projectKey, -Dsonar.python.version, -Dsonar.sources,
      # -Dsonar.python.coverage.reportPaths and -Dsonar.coverage.exclusions, but
      # NOT -Dsonar.exclusions. So the line below does not race a duplicate key:
      # it replaces sonar-project.properties' 10-pattern list outright. Eight of
      # those ten (__pycache__, .venv, caches, dist, build, egg-info,
      # node_modules, .git) are moot under the narrowed sonar.sources; they are
      # restated here so the replacement is deliberate rather than incidental.
      additional-sonar-args: >-
        -Dsonar.sources=src,frontend/src,frontend/design-system/src
        -Dsonar.exclusions=frontend/src/client/**,**/node_modules/**,**/dist/**,**/build/**,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/**/*.spec.ts,frontend/**/*.spec.tsx
        -Dsonar.coverage.exclusions=**/tests/**,**/validation/**,**/benchmarks/**,**/scripts/**,frontend/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
