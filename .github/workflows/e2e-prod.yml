# Scheduled production E2E workflow (test-traceability-matrix.md, "Actions to
# reach the bar" #3).
#
# Runs the e2e-prod Playwright tier (frontend/e2e-prod/) daily against LIVE
# production (https://cyo.williamshome.family by default) using a dedicated
# test account, then alerts on failure via a pinned GitHub issue. Scheduled
# 30 minutes after e2e-staging.yml's `0 13 * * *` so the two scheduled tiers
# never start at the same minute.
#
# #CRITICAL: security: frontend/e2e-prod/support/prod-env.ts hard-fails with
# `if (process.env.CI) throw new Error(...)` specifically to stop this tier
# from ever running unattended in CI, because every run authenticates a real
# family account against live production. This workflow is a deliberate,
# owner-directed override of that guard, not an oversight: see
# docs/planning/test-traceability-matrix.md, "The bar (owner directive,
# 2026-07-16)" and action #3. It works around the guard by clearing CI to an
# empty string for the test-run step below; setting it to the string "false"
# would NOT work, because any non-empty string (including "false") is
# truthy in JavaScript, and the guard only checks `if (process.env.CI)`.
# #VERIFY: if frontend/e2e-prod/support/prod-env.ts's guard or its
# manual-only framing ever changes, re-check this override still matches
# intent. If the repo owner instead decides e2e-prod should stay
# CI-proof, delete this workflow rather than fighting the guard.
#
# -----------------------------------------------------------------------
# Required GitHub Environment: `production-e2e` (NOT `production`)
# -----------------------------------------------------------------------
# The repo owner must create a `production-e2e` Environment with NO
# protection rules and add the secrets below before the first scheduled
# run; until then every run fails fast at the credential check in
# frontend/e2e-prod/support/prod-env.ts. Env var names below match that
# file exactly.
#
#   gh api -X PUT repos/:owner/:repo/environments/production-e2e
#   gh secret set E2E_PROD_TEST_EMAIL    --env production-e2e
#   gh secret set E2E_PROD_TEST_PASSWORD --env production-e2e
#
# It is a separate environment from `production` on purpose: see the
# #CRITICAL note on the job's `environment:` key. A required-reviewer rule
# here parks the first scheduled run in `waiting` forever and starves every
# run behind it.
#
#   E2E_PROD_TEST_EMAIL     (required) Login email for the dedicated e2e-prod
#                            test account. Read in
#                            frontend/e2e-prod/support/prod-env.ts
#                            (requireProdCredentials).
#   E2E_PROD_TEST_PASSWORD  (required) That account's password; also used to
#                            answer the AdultGate re-auth challenge in
#                            frontend/e2e-prod/support/auth.ts
#                            (unlockParentalGateIfPresent).
#   E2E_PROD_BASE_URL       (optional) Overrides the default target
#                            (https://cyo.williamshome.family); only set this
#                            if production ever moves host. See
#                            frontend/e2e-prod/support/prod-env.ts
#                            (PROD_BASE_URL).
#
# Never reuse a real family's credentials for these two required secrets;
# use the dedicated test account described in frontend/README.md, "Production
# smoke e2e (manual, never CI)".
# -----------------------------------------------------------------------
name: E2E (production)

on:
  schedule:
    # Daily. Offset from e2e-staging.yml's 0 13 * * * by 30 minutes.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

# Least-privilege at workflow level; the job below declares the extra
# issues: write it needs for the failure-alerting step.
permissions:
  contents: read

concurrency:
  # Every run authenticates a real account against live production, and
  # kid-device-grant.spec.ts mints and revokes a real device grant; two
  # overlapping runs (a schedule firing mid manual-dispatch, or two manual
  # dispatches) could race on the same account or grant. Never cancel an
  # in-flight run in favor of a newer one, mirroring e2e-staging.yml's guard.
  group: e2e-prod
  cancel-in-progress: false

jobs:
  e2e-prod:
    name: Playwright (e2e-prod tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #CRITICAL: timing: deliberately NOT the `production` environment. That
    # environment carries a required-reviewer protection rule, which is correct
    # for supabase-production.yml (it applies migrations to the live database)
    # but fatal here: a scheduled, unattended run enters `waiting` for a human
    # who is not watching. Because `cancel-in-progress: false` protects it, that
    # first waiting run holds the group's in-progress slot indefinitely; GitHub
    # then allows only ONE pending run behind it, so each day's cron sits
    # pending until the NEXT day's cron displaces it as `cancelled`. The tier
    # never executed a single test from 2026-07-18 onward.
    # #CRITICAL: external resources: the original 2026-07-18 run (id
    # 29647203420) is still `waiting`, not cancelled, and will never resolve on
    # its own. Switching this key to an unprotected environment does NOT clear
    # it; it must be cancelled by hand (`gh run cancel 29647203420`) or it keeps
    # occupying the in-progress slot and blocking every future scheduled run.
    # This environment must stay UNPROTECTED; it holds only the dedicated e2e
    # test account's credentials, never a deploy key.
    # #VERIFY: `gh api repos/:owner/:repo/environments/production-e2e --jq
    # '.protection_rules'` returns `[]`, no run for this workflow is left in
    # `waiting`, and a scheduled run reaches the Playwright step.
    environment: production-e2e
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ./frontend
    env:
      E2E_PROD_BASE_URL: ${{ secrets.E2E_PROD_BASE_URL }}
      E2E_PROD_TEST_EMAIL: ${{ secrets.E2E_PROD_TEST_EMAIL }}
      E2E_PROD_TEST_PASSWORD: ${{ secrets.E2E_PROD_TEST_PASSWORD }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, prod tier)
        # See the header comment: prod-env.ts refuses to run at all while
        # process.env.CI is truthy, by design. Clear it to an empty string
        # (not "false", a truthy string in JavaScript) for this step only.
        env:
          CI: ""
        run: npm run test:e2e:prod

      - name: Upload Playwright trace on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-prod-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Compose the issue body
        # Reusable alerting pattern for scheduled E2E tiers (test-
        # traceability-matrix.md, "Actions to reach the bar" #2), routed
        # through the shared .github/actions/ci-failure-issue composite (label:
        # e2e-alert) instead of a bare github-script block: the prior inline
        # issue-listing call paged at GitHub's default 30-per-page with no
        # `!issue.pull_request` filter, so an open PR titled with this marker,
        # or a 31st-oldest open issue, could hide the real tracking issue and
        # file a duplicate.
        #
        # e2e-staging.yml now adopts this same composite-action pattern too
        # (marker "[e2e-staging]" instead of "[e2e-prod]"). Its own compose
        # step additionally distinguishes which of its three failure sources
        # fired (a Playwright failure vs. a leaked staging device grant), since
        # that job has no single point of failure the way this one does.
        if: ${{ failure() }}
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const today = new Date().toISOString().slice(0, 10)

            return [
              'The scheduled `E2E (production)` workflow (`.github/workflows/e2e-prod.yml`) failed.',
              '',
              'This tier signs in through the real login form against live production',
              '(frontend/e2e-prod/) and runs daily; a failure here means either a real',
              'regression, a production outage, or the dedicated test account or its',
              'credentials need attention.',
              '',
              `First failing run: ${runUrl}`,
              `Date: ${today}`,
              '',
              'This issue accumulates one comment per failing run and closes itself',
              'once a scheduled run succeeds; the next failure opens a fresh issue.',
            ].join('\n')

      - name: File or comment on the pinned issue
        if: ${{ failure() }}
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-prod]'
          label: e2e-alert
          summary: scheduled production E2E failing
          body: ${{ steps.compose.outputs.result }}
          comment-body: Scheduled production E2E failed again.

      - name: Resolve the tracking issue on a green scheduled run
        # Every one of these issue bodies used to end by asking a human to
        # close the issue once a run went green; nobody ever did for the other
        # scheduled workflows either, so closing is the workflow's job now
        # that the shared action makes it a one-line step.
        #
        # `&& github.event_name == 'schedule'`: a manual `workflow_dispatch`
        # proves only that a human-triggered run went green, not that the
        # SCHEDULE is alive; without this a dead cron could still have its
        # tracking issue closed by a one-off dispatch (see supabase-backup.yml
        # for the confirmed real-world shape of that failure, issue #667).
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[e2e-prod]'
          label: e2e-alert
          mode: resolve
