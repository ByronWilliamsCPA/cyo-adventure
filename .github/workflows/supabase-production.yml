# Deploys the Supabase migration chain AND the project config to PRODUCTION.
# Manual dispatch only, gated by the `production` GitHub Environment's
# required-reviewer approval.
# RUN POLICY: only dispatch after the staging deploy of the same migration and
# config set is green (see docs/guides/supabase-environments.md).
name: Deploy Supabase Migrations (production)

on:
  workflow_dispatch: {}

permissions:
  contents: read

# #CRITICAL: concurrency: this job now performs TWO stateful writes against the
# live project, `config push` (auth policy) and `db push` (migration history).
# Two dispatches that overlap can interleave those writes. cancel-in-progress
# stays false for the same reason as staging: an aborted run leaves partially
# applied state, which is worse than a queued one.
# #VERIFY: this group is deliberately separate from supabase-staging-migrations
# so a production dispatch is never queued behind a staging deploy.
concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # #CRITICAL: security: this deploys supabase/config.toml's [auth] policy to
      # the LIVE project that real guardians sign in to. `config push` is a
      # DEFAULTING writer: for any table it sends, keys omitted from config.toml
      # are filled with the CLI's own defaults and asserted on the remote, so
      # deleting a key from [auth] silently reverts that setting to the Supabase
      # default rather than leaving it alone. Two specific traps, both verified
      # against the live API on 2026-08-04 and documented in config.toml:
      #   - Google OAuth is the guardian login path and is deliberately NOT
      #     declared in config.toml. Adding a [auth.external.google] block
      #     without also wiring its client_id and secret pushes an empty
      #     client_id and breaks production login.
      #   - Omitting [auth.captcha] leaves remote captcha unmanaged; writing
      #     `enabled = false` would actively assert "off" on every push.
      # #VERIFY: --project-ref is REQUIRED, not redundant with `link`: it is the
      # key the CLI matches against [remotes.*].project_id, and production's
      # site_url comes from [remotes.production]. Confirm the run log's first
      # line reads "Loading config override: [remotes.production]". If that line
      # is absent the override did not match and the push used the base config,
      # whose site_url is localhost; treat that as an incident and restore from
      # the snapshot procedure in docs/guides/supabase-environments.md section 4.
      - name: Push project config
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Push migrations
        run: supabase db push
