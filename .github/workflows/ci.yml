# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit)
#   - Optional SonarCloud/Codecov integration
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege at workflow level; jobs that need writes declare them locally.
# (SonarCloud githubactions:S8233: no workflow-level write permissions.)
permissions:
  contents: read

jobs:
  # release.yml's `propose` job opens an automated "chore(release): vX.Y.Z" PR
  # (branch release/v*) that only ever touches pyproject.toml/uv.lock/
  # CHANGELOG.md: a version bump, a `uv lock` re-resolve, and a changelog
  # promotion, generated by CI itself. The code it "tests" was already run in
  # full on the feature PR that triggered propose (its own pull_request,
  # merge_group, and post-merge push-to-main runs) -- re-running the whole
  # suite a 4th/5th/6th time (this PR's pull_request + merge_group, then
  # again on push once it merges) adds no new signal about application
  # correctness, only that a version string edit didn't break anything.
  # #ASSUME external-resource: the one real gap this leaves is `uv lock`
  # resolving a newly-published transitive dependency version the original
  # feature PR's tests never exercised. That gap has two halves, and the
  # scheduled scans cover only one of them. A newly-disclosed CVE in the
  # re-resolved tree is caught within a day by security-analysis.yml, which
  # moved from weekly to daily under issue #594. A plain BEHAVIOURAL
  # regression is not: security-analysis.yml runs Bandit and OSV-Scanner and
  # never invokes pytest, so the first thing that actually exercises the new
  # tree is python-compatibility.yml (weekly) or the next feature PR's own
  # full run, whichever comes first. Accepted tradeoff, but the exposure
  # window for a behavioural break is up to a week, not up to a day.
  # #VERIFY: on a merge_group event, github.event.merge_group.head_ref is the
  # synthetic queue ref (refs/heads/gh-readonly-queue/main/pr-<N>-<sha>), NOT
  # the PR's own source branch -- confirmed against this repo's real queue
  # runs (e.g. gh-readonly-queue/main/pr-306-c761f39f...), not assumed from
  # docs alone. The PR number is embedded in that ref; look the PR up via the
  # API to get its actual head branch. If the lookup fails for any reason,
  # this job fails open (release_pr=false), which only costs back the
  # redundant run, not a false skip.
  detect-release-pr:
    name: Detect release-automation PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_pr: ${{ steps.check.outputs.release_pr }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check for release-automation branch/commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_PR=false
          case "$EVENT_NAME" in
            pull_request)
              [[ "$HEAD_REF" == release/v* ]] && RELEASE_PR=true
              ;;
            merge_group)
              PR_NUMBER="$(echo "$MERGE_GROUP_HEAD_REF" | grep -oP '(?<=/pr-)\d+' || true)"
              if [ -n "${PR_NUMBER}" ]; then
                PR_HEAD_REF="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                  --jq '.head.ref' 2>/dev/null || true)"
                [[ "$PR_HEAD_REF" == release/v* ]] && RELEASE_PR=true
              fi
              ;;
            push)
              [[ "$HEAD_COMMIT_MESSAGE" == "chore(release):"* ]] && RELEASE_PR=true
              ;;
          esac
          echo "release_pr=${RELEASE_PR}" >> "$GITHUB_OUTPUT"

  # Delegate Python quality gates (tests, lint, type-check, coverage, bandit) to
  # the org-level reusable CI workflow, mirroring the reference .claude/ci.yml.
  # This replaces the previous standalone job that fetched Infisical/GCP secrets
  # the unit-test suite does not need (and which fail when those secrets are
  # absent on a fork or a repo without them configured).
  ci:
    name: CI (Python 3.14)
    needs: detect-release-pr
    if: needs.detect-release-pr.outputs.release_pr != 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@c4ba2d18e4de831cbdbffcafd8e033473c0a0059 # #270: parallel buckets pass --cov-fail-under=0, coverage-combine gates
    with:
      python-version: "3.14"
      coverage-threshold: 80
      # Run the integration and security buckets as separate pytest passes so
      # they produce coverage-integration.xml / coverage-security.xml (and the
      # matching junit files) for per-test-type Codecov flags. Without these,
      # the reusable's unit step excludes `-m integration`/`-m security`, so
      # those 39 integration-marked and 3 security-marked test files never run
      # in CI at all.
      run-integration-tests: true
      run-security-tests: true
      # cyo_adventure is an installable package with a build backend; the shared
      # workflow defaults no-build: true, which would block the editable install.
      no-build: false
      # Opt-in trial of ByronWilliamsCPA/.github#269: splits unit/integration/
      # security into parallel jobs instead of one sequential job, taking the
      # ~5.5min integration suite off the critical path it currently shares
      # with unit+security. Relies on relative_files = true below (already
      # set) for coverage-combine's cross-runner `coverage combine` to merge
      # correctly; see coverage-combine's inline #ASSUME in python-ci.yml.
      parallel-tests: true
    secrets: inherit

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # merge_group re-runs the identical tree the pull_request run already
    # validated (frontend build/lint/typecheck/tests are file-content-only,
    # not merged-state-sensitive); skip here and rely on the PR run plus the
    # post-merge push-to-main run. See docs/planning/PROJECT-PLAN.md CI notes.
    # Also skipped for release-automation PRs (see detect-release-pr): they
    # never touch frontend/.
    #
    # The mocked-tier E2E run (Playwright browser install + `npm run
    # test:e2e`) used to be the last two steps of this job. Measured on a
    # real PR run it added ~154s (28s install + 126s run) after ~154s of
    # lint/typecheck/vitest/build/nginx-validate, making this the single
    # longest job in the whole CI gate at ~340s. It is split into the
    # `frontend-e2e` job below instead: since Playwright's webServer builds
    # and serves the app itself (playwright.config.ts), that job has no
    # dependency on this one's Build step, so the two now run concurrently
    # -- cutting the blocking wall-clock to roughly the slower of the two
    # (~180s) instead of their sum, with no test removed or demoted.
    needs: detect-release-pr
    if: github.event_name != 'merge_group' && needs.detect-release-pr.outputs.release_pr != 'true'
    defaults:
      run:
        working-directory: ./frontend
    permissions:
      contents: read
    env:
      # See the coverage-upload job: job-scoped so the Qlty step can gate on it.
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The `format:check` script has existed in package.json since the frontend
      # was created but no workflow ever ran it, so nothing gated formatting
      # across the whole tree. The pre-commit hook only checks STAGED files, and
      # it can reject but never repair, so a file that was never passed through
      # `prettier --write` stayed drifted indefinitely and forced unrelated
      # reformat churn into the next diff that happened to touch it. 72 files
      # had accumulated. This step closes that hole.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Set up Python (coverage drift-guard)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Coverage matrix drift-guard
        # Fails if any Playwright spec or Vitest test is missing from
        # docs/testing/coverage-matrix.md. Stdlib-only Python (no deps), run on
        # the pinned interpreter above rather than the runner's ambient python3.
        # The script resolves the repo root from its own location, so running it
        # from this job's ./frontend working directory via ../ is fine.
        run: python ../scripts/check_coverage_matrix.py

      - name: Test
        run: npm run test:run -- --coverage

      - name: Upload frontend test results to Codecov
        # Feeds Codecov Test Analytics (the "Tests" tab). Vitest writes junit.xml
        # in CI (CI-gated reporter in vite.config.ts). Runs even when tests fail
        # (!cancelled) because failing runs are the most useful to surface.
        # Unlike codecov-action, test-results-action has no working-directory
        # input, so the path is given from the repo root, not ./ under frontend.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./frontend/junit.xml
          disable_search: true
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      - name: Validate nginx.conf syntax
        # Uses the same hardened image pinned in frontend/Dockerfile's production
        # stage so this check exercises the actual runtime image, not a stand-in.
        # That image's ENTRYPOINT is already `nginx`, so the container command is
        # just `-t` (passing `nginx -t` fails with "invalid option: nginx").
        # proxy_pass targets are resolved via a variable + resolver in nginx.conf,
        # so this passes without a live network; no compose stack is started here.
        run: |
          docker run --rm \
            -v "$(pwd)/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            ghcr.io/byronwilliamscpa/dhi-nginx:1.26-debian13@sha256:6b0137dc31dcff3c86854e3d9bbafb33201a6b0b83c44ecb0f4f6f092d68a7f4 \
            -t

      # Vitest writes lcov SF: paths relative to the package root (src/App.tsx),
      # but Codecov matches against the repo tree where the file is
      # frontend/src/App.tsx. Rewrite the paths to repo-root-relative so they
      # match exactly, then upload from the repo root (no working-directory).
      # This is deterministic: the report path IS the git path, so it merges as
      # a session instead of being dropped as "path mismatch". Working-directory
      # here does the opposite (records src/... which cannot resolve).
      - name: Prefix lcov paths with the package root
        run: sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info

      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./frontend/coverage/lcov.info
          # Vitest's v8 provider also writes coverage/coverage-final.json, which
          # Codecov's auto-search would pick up as a second, unprefixed report.
          # We pass the exact file, so disable search entirely.
          disable_search: true
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Same prefixed lcov (paths already frontend/src/...) to Qlty; this job's
      # checkout lets qlty attach the commit SHA and qlty merges it with the
      # backend and design-system uploads for one repo coverage number.
      - name: Upload frontend coverage to Qlty
        if: ${{ env.QLTY_COVERAGE_TOKEN != '' && hashFiles('frontend/coverage/lcov.info') != '' }}
        # See the coverage-upload job: a Qlty hiccup must not block a merge.
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ env.QLTY_COVERAGE_TOKEN }}
          files: frontend/coverage/lcov.info

  frontend-e2e:
    name: Frontend E2E (Playwright, mocked tier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Split out of the `frontend` job (see the note on that job's `needs:`)
    # so this runs concurrently with it instead of after it. Only the mocked
    # `test:e2e` (chromium) project runs here; it mocks the API per test and
    # needs no backend. The real-backend `test:e2e:real` tier stays
    # local-only (needs Postgres + a seeded uvicorn); run it per
    # frontend/README.md before opening a PR. The cross-device/cross-browser
    # tier (firefox + webkit device profiles, e2e/cross-device.spec.ts) runs
    # in its own dedicated, non-blocking workflow (cross-device-e2e.yml)
    # rather than here: `playwright install --with-deps firefox webkit`
    # apt-installs a much larger dependency set (gstreamer, libavcodec, etc.)
    # than chromium alone, which pushed the old combined job's 15-minute
    # timeout -- it was killed mid-apt-install, before a single test ran, the
    # first time this was tried inline.
    needs: detect-release-pr
    if: github.event_name != 'merge_group' && needs.detect-release-pr.outputs.release_pr != 'true'
    defaults:
      run:
        working-directory: ./frontend
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Caches the downloaded chromium browser binary keyed on the lockfile
      # (bump when the pinned @playwright/test version changes). The
      # `--with-deps` apt-get layer below still runs every time -- system
      # libraries aren't preserved across ephemeral runners -- but on a cache
      # hit `playwright install-deps` is a fast no-op apt check instead of
      # paying for a ~28s browser download too.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers (mocked e2e tier)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright, mocked tier)
        run: npm run test:e2e

  design-system:
    name: Design System (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See frontend job: not merged-state-sensitive, skip on merge_group; also
    # skipped for release-automation PRs (see detect-release-pr).
    needs: detect-release-pr
    if: github.event_name != 'merge_group' && needs.detect-release-pr.outputs.release_pr != 'true'
    defaults:
      run:
        working-directory: ./frontend/design-system
    permissions:
      contents: read
    env:
      # See the coverage-upload job: job-scoped so the Qlty step can gate on it.
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:run -- --coverage

      - name: Build
        run: npm run build

      # Guards the react/jsx-runtime external in vite.config.ts: if a future
      # Vite/rolldown bump re-inlines the jsx runtime, its CJS-interop shim
      # carries a runtime require("react") that throws in browser consumers
      # of the ESM dist. The inlined runtime is identifiable by this marker.
      - name: Assert jsx-runtime is not inlined in the ESM bundle
        run: |
          if grep -q 'react-stack-top-frame' dist/cyo-design-system.js; then
            echo 'react/jsx-runtime was inlined into dist/cyo-design-system.js;'
            echo 'check rollupOptions.external in frontend/design-system/vite.config.ts'
            exit 1
          fi

      # Same repo-root-relative rewrite as the frontend job (see note there):
      # design-system lcov SF: paths are src/... relative to the package, the
      # repo path is frontend/design-system/src/..., so prefix then upload from
      # the repo root.
      - name: Prefix lcov paths with the package root
        run: sed -i 's|^SF:|SF:frontend/design-system/|' coverage/lcov.info

      - name: Upload design-system coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./frontend/design-system/coverage/lcov.info
          disable_search: true
          flags: design-system
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Same prefixed lcov (frontend/design-system/src/...) to Qlty; merged with
      # the backend and frontend uploads for this commit (see coverage-upload).
      - name: Upload design-system coverage to Qlty
        if: ${{ env.QLTY_COVERAGE_TOKEN != '' && hashFiles('frontend/design-system/coverage/lcov.info') != '' }}
        # See the coverage-upload job: a Qlty hiccup must not block a merge.
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ env.QLTY_COVERAGE_TOKEN }}
          files: frontend/design-system/coverage/lcov.info

  # Note: the mocked Playwright tier (`test:e2e`) runs inside the `frontend`
  # job above. The real-backend tier (`test:e2e:real`) is deliberately not a CI
  # job: it needs Postgres + a seeded uvicorn, so it is local-only; run it per
  # frontend/README.md before opening a PR.

  contract:
    name: OpenAPI Contract Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See frontend job: skip on merge_group. #EDGE: concurrency: two queued
    # PRs could each pass individually but drift the schema only when
    # combined; the post-merge push-to-main run on ci.yml catches that case
    # after the fact rather than blocking the queue on it.
    # #VERIFY: if combined-PR schema drift becomes a recurring incident, move
    # this job back to running on merge_group.
    # Also skipped for release-automation PRs (see detect-release-pr): they
    # never touch the API surface.
    needs: detect-release-pr
    if: github.event_name != 'merge_group' && needs.detect-release-pr.outputs.release_pr != 'true'
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The `api` extra (FastAPI, SQLAlchemy, uvicorn) is enough to build the
      # app and call its .openapi() method in-process; no live server, no
      # database connection, and none of the `dev` extra's test/lint tooling
      # are needed just to dump the schema.
      - name: Install backend (api extra)
        run: uv sync --extra api

      # Write the file from Python rather than redirecting stdout: importing
      # the app emits structlog lines on stdout (e.g. "sentry_disabled"), and a
      # shell redirect splices them into the JSON, so the regenerate step below
      # would fail to parse a schema that is actually fine.
      - name: Dump OpenAPI schema from the app in-process
        run: |
          uv run python -c "
          import json, pathlib
          from cyo_adventure.app import app
          pathlib.Path('openapi.json').write_text(json.dumps(app.openapi()))
          "

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # OPENAPI_INPUT overrides openapi-ts.config.ts's default localhost URL so
      # this regenerates from the schema dumped above instead of needing a
      # running backend (see openapi-ts.config.ts for the override).
      - name: Regenerate client against the dumped schema
        working-directory: ./frontend
        env:
          SCHEMA_PATH: ${{ github.workspace }}/openapi.json
        run: OPENAPI_INPUT="$SCHEMA_PATH" npm run generate-client

      - name: Fail on generated client drift
        run: |
          git diff --exit-code -- frontend/src/client || (echo "::error::Generated OpenAPI client is out of date. Run 'npm run generate-client' against a live backend (see frontend/README.md) and commit the result." && exit 1)

  # WS-0 Phase 2 diversity regression gate: pure Python over the committed
  # tests/data/diversity_panel/ fixtures (~400 KB), seconds of wall time, no
  # secrets, no network. Standalone (not folded into the reusable `ci` job)
  # for the same reason as `contract`: the backend quality gate is delegated
  # to an org-level reusable workflow that cannot take an extra step. Runs
  # per-PR, not nightly (docs/planning/ws0-phase2-harness-design.md section
  # 4.3): a regression gate is only cheap to act on when it fires on the PR
  # that caused it, and the baseline-update review contract requires the
  # gate and the causal change to land in the same PR.
  diversity:
    name: Diversity Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The harness logic is pure Python over committed fixtures, but importing
      # `cyo_adventure.diversity` pulls in `diversity/history.py` (the WS-4
      # request-time query), which imports SQLAlchemy, so the `api` extra is
      # required to `import cyo_adventure` at all. `uv sync --extra api` builds
      # the .venv the subsequent `uv run` uses, mirroring the `contract` job
      # above (an earlier `uv pip install --system -e .` failed because `uv run`
      # then created its own base-only .venv without SQLAlchemy).
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Diversity eval (offline panel, regression rules R1-R6)
        run: uv run python scripts/run_diversity_eval.py --check

      # A8: in-cell clone audit over the real skeletons/ catalog, which the
      # panel fixtures above do not cover. Blocking, against the TAU_CELL floor
      # loaded from ws5_floor_baseline.json (never a literal). One known
      # breach is allowlisted in the script and tracked by A9; the gate also
      # fails on a stale allowlist entry, so the list can only shrink.
      - name: In-cell clone audit (A8)
        run: uv run python scripts/check_incell_clones.py --check

  # The ER diagram is documentation that gets read as if it were the schema, so
  # a silent disagreement with the ORM is worse than having no diagram at all.
  # Deliberately NOT folded into docs.yml: that workflow is path-filtered on
  # `docs/**`, which would miss the exact case this gate exists for, a models.py
  # change that leaves the diagram untouched and therefore stale. Runs
  # unconditionally (including merge_group) because it is a couple of seconds of
  # pure Python with no network and no database.
  schema-docs:
    name: ER Diagram Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The check reads `Base.metadata` only. The `api` extra supplies
      # SQLAlchemy, which is all that `cyo_adventure.db.models` needs to
      # import; no engine is created and no connection is opened.
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: ER diagram matches the ORM (and both Mermaid copies agree)
        run: uv run python scripts/check_er_diagram.py

  # Nothing else runs the formatter over the WHOLE tree, so nothing else can
  # see a formatting defect in a file no commit touched. Python CI is delegated
  # to the org-level reusable workflow (the `ci` job), whose format check scopes
  # to the code directories: empirically `ruff format --check src tests scripts`
  # passes on a tree where `ruff format --check .` fails. The pre-commit
  # `ruff-format` hook closes no part of that gap, because it only sees STAGED
  # files. Ruff formats Python inside markdown fences, so a planning document is
  # a formattable artifact, and one sat unformatted indefinitely with every gate
  # green.
  #
  # The frontend had the SAME gap and this job does NOT close it; the frontend's
  # own gate does. `format:check` (frontend/package.json) was scoped to `src/**`,
  # leaving `e2e/`, `e2e-real/` and the root config files unchecked; it now runs
  # `prettier --check .` over the whole frontend tree, and the resulting 53-file
  # mechanical reformat landed as its own commit (UW-C33 / AL-100). The earlier
  # "130 files" figure quoted here was not wrong, it was measured in a different
  # environment: 77 of those files are design-sync output that a fresh checkout
  # does not have, now excluded via frontend/.prettierignore. Do not read this
  # job as covering the frontend either way: ruff does not format TypeScript.
  #
  # Its own job rather than a step inside `contract` or `schema-docs`: those two
  # are required checks whose NAMES are the repo's claim about what was
  # verified, and a format failure surfacing as "OpenAPI Contract Drift" makes
  # the check say something other than what it checked. `contract` also skips on
  # merge_group and on release-automation PRs, which would silently narrow this
  # gate's coverage to a subset of runs.
  #
  # #ASSUME: external-resources: the pinned ruff release here and the one in
  # .pre-commit-config.yaml (v0.16.0) define the same formatting, so a commit
  # that satisfies the local hook satisfies this gate.
  # #VERIFY: tests/unit/test_ci_gate_contract.py asserts this job is gated and
  # allowed no skip; if the hook's ruff pin moves, move this pin in the same
  # commit or the two can disagree about what "formatted" means.
  format-tree:
    name: Format (tree-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # No `uv sync`: `uv tool run` fetches the pinned ruff into an isolated
      # environment, so this needs neither the project's dependencies nor a
      # matching interpreter. `--no-build` (S8541) refuses source distributions,
      # so resolution cannot land on an sdist whose build backend runs arbitrary
      # code in CI; ruff publishes wheels for every platform this runs on.
      - name: Every file ruff formats is formatted, docs included
        run: uv tool run --no-build ruff@0.16.0 format --check .

  # scripts/check_rad_citations.py was wired into .pre-commit-config.yaml
  # (hook id check-rad-citations) but nothing ran it in CI, so the gate only
  # fired on a machine with hooks installed and `git commit --no-verify`
  # bypassed it completely. This job closes that: it is the only place a RAD
  # #VERIFY citation is checked on every push and pull request regardless of
  # local hook state.
  # interrogate ran ONLY in .pre-commit-config.yaml, so CI never enforced docstring
  # coverage (UW-F09): a contributor without hooks installed, or any path that
  # bypasses them, could merge undocumented code. The backend quality job is a
  # reusable workflow in ByronWilliamsCPA/.github, which this repo cannot edit, so
  # the check gets its own job here and is wired into ci-gate below.
  #
  # Invoked THROUGH pre-commit rather than as a bare `uv run interrogate`, which
  # matters twice over. It pins the same hook revision and the same per-scope
  # thresholds the developer runs locally (scripts/ at 85%, src/ at 80%), so CI and
  # pre-commit cannot drift into disagreeing about what passes; and it runs the tool
  # in pre-commit's isolated environment rather than this project's venv. The second
  # point is not theoretical: `uv run pydoclint` currently dies with an ImportError
  # (`DocstringYields` from docstring_parser) because the resolved venv pins a
  # docstring_parser this pydoclint cannot use, while the hook's own pinned env is
  # fine.
  #
  # pydoclint is deliberately NOT run here despite its hook comment claiming CI
  # covers it. It reports 703 findings across src/ as of 2026-08-13, so gating on it
  # would block every PR. See the UW-F09 register row for the backlog.
  docstrings:
    name: Docstring coverage (interrogate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.1
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: uv tool install pre-commit

      # Both interrogate hooks (src/ 80%, scripts/ 85%) in one invocation.
      - name: Docstring coverage
        run: uv tool run pre-commit run interrogate --all-files --show-diff-on-failure

  rad-citations:
    name: RAD Citation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # fetch-depth: 0 (full history) rather than the default shallow clone:
      # the no-growth step below shells out to `git show BASE_REF:path`, which
      # needs the base ref's tree to be reachable locally.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # No `uv sync` and no dependency install: the script imports only the
      # standard library (argparse, tokenize, tomllib, subprocess, ...), so a
      # bare python3 runs it correctly. This keeps the job to seconds and
      # means a dependency-resolution failure elsewhere can never mask a
      # citation failure here.
      #
      # `--all` scans the whole tree, which is broader than the pre-commit
      # hook's `files:` regex (src/, scripts/, frontend/src/, and the
      # baseline only, so tests/, supabase/, and frontend/e2e/ were never
      # covered locally). Its ceiling: it proves a cited test EXISTS, never
      # that the test would fail if the tagged property were removed.
      - name: Every RAD #VERIFY citation names a test that exists
        run: python3 scripts/check_rad_citations.py --all

      # Same gap, same job, different checker (UW-C354). check-pytest-raises-scope
      # was wired into .pre-commit-config.yaml with `pass_filenames: true`, so it
      # only ever saw STAGED paths and a violation in a file nobody stages was
      # invisible indefinitely. Seven accumulated in tests/unit/test_replay.py on
      # main and surfaced only through an unrelated `pre-commit run --all-files`.
      # Every sibling checker already had an independent CI leg (check_work_linkage
      # and check_lessons_log in planning-linkage.yml, check_rad_citations in the
      # step above); this one had none.
      #
      # `--all` rather than a shell glob: the script discovers the same scope the
      # hook's `files:` regex covers, so CI and pre-commit cannot drift into
      # disagreeing about what is checked, and a mistyped glob cannot quietly
      # narrow the scan to nothing. It exits 2 rather than 0 if it discovers no
      # files, so this step can never pass vacuously.
      #
      # Stdlib only (argparse, ast, pathlib), so no `uv sync` is needed here for
      # the same reason the step above skips it.
      - name: No pytest.raises block invokes more than one call (S5778)
        run: python3 scripts/check_pytest_raises_scope.py --all

      # Guarded to pull_request only, and guarded again inside the step: on
      # the PR that introduces rad-citation-baseline.toml, the base ref has
      # no such file, and `git show BASE_REF:path` on a path absent from the
      # base ref is an exit-2 usage error, not "baseline size zero". Without
      # this guard, the PR that introduces the gate would fail its own new
      # gate.
      #
      # `if:` restates success() because a step-level `if:` REPLACES the
      # implicit success() rather than adding to it. Without it this step
      # runs even after the --all step above has already failed, producing a
      # second, unrelated-looking failure on top of the real one.
      #
      # BASE_REF is passed through env: (not interpolated into the run:
      # string) even though github.base_ref is a branch name rather than
      # free-form untrusted text, so this step follows the same
      # inject-via-env discipline as every other step in this workflow that
      # reads a github.* context value.
      - name: The citation baseline may only shrink
        if: success() && github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # #CRITICAL: external-resource: `git cat-file -e REF:PATH` exits 128
          # for BOTH "the ref does not resolve" and "the ref resolves but has
          # no such path", so testing only that conflates a broken checkout
          # with an expected first-PR state and would silently disable the
          # only defence against baseline laundering while printing a notice
          # asserting the wrong cause. Resolve the ref FIRST, and fail hard
          # when it does not: an unresolvable base ref is a fetch or checkout
          # defect (see fetch-depth: 0 above), never a licence to skip.
          # #VERIFY: tests/unit/test_ci_gate_contract.py asserts this step
          # exists and runs `rev-parse --verify` before `cat-file -e`.
          if ! git rev-parse --verify -q "${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::${BASE_REF} does not resolve to a commit in this checkout, so the baseline ratchet could not run at all. This is a fetch or checkout defect (this job sets fetch-depth: 0 for exactly this reason), not an absent baseline."
            exit 1
          fi
          if ! git cat-file -e "${BASE_REF}:rad-citation-baseline.toml" 2>/dev/null; then
            echo "::notice::${BASE_REF} resolves, but carries no rad-citation-baseline.toml, so there is no prior baseline to compare against. Expected on the pull request that introduces the baseline, and on any base branch that does not yet carry it."
            exit 0
          fi
          python3 scripts/check_rad_citations.py --assert-no-growth "${BASE_REF}"

  # Executes the alerting script that .github/actions/ci-failure-issue hands to
  # actions/github-script. Fourteen scheduled workflows delegate their ONLY
  # notification channel to that script, and a scheduled workflow fails
  # invisibly by construction: no pull request turns red, so a defect there is
  # not a broken build, it is nobody being told. That makes the script the one
  # piece of CI whose own failure mode is silence, and it had no test at all.
  #
  # Unconditional (no job-level `if:`, no `needs:`) and therefore evaluated on
  # release-automation commits too, via the release loop in ci-gate. That is
  # deliberate: the job needs no services and no dependency resolution, so
  # there is no cost argument for exempting it, and a release commit can touch
  # the action like any other.
  alert-action:
    name: Scheduled-alert action harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache:` and no install step: the harness has no package.json and no
      # lockfile, and runs on `node --test` alone. The gate that guards the
      # alerting path therefore adds no npm supply-chain surface of its own,
      # and cannot be masked by an unrelated dependency-resolution failure.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # #CRITICAL: data-integrity: `node --test` exits 0 when it discovers no
      # tests, so a moved or renamed file would turn this required leg into a
      # green no-op indistinguishable from a passing suite. That is the same
      # class of anti-oracle the harness itself exists to close, so the count
      # is asserted rather than trusted: the floor is checked against the TAP
      # summary and the step fails if the suite shrinks.
      # #VERIFY: tests/unit/test_ci_gate_contract.py asserts this job is in
      # ci-gate's needs: and is evaluated on release commits; deleting the
      # floor check below is caught by
      # tests/unit/test_ci_failure_action_contract.py::test_the_ci_job_asserts_a_test_count_floor
      - name: Run the ci-failure-issue harness
        env:
          # Raise in step with the suite. A floor that never moves stops
          # detecting a suite that quietly lost half its cases.
          #
          # Four files, not a glob: `.github/workflows/test/health-rollup.test.mjs`
          # covers `scheduled-health-rollup.yml`'s findTrackingIssue extraction,
          # `frontend/scripts/test/extract-failing-specs.test.mjs` (task A7-i review,
          # Important 2) covers `frontend/scripts/extract-failing-specs.mjs`'s
          # failure-discrimination and security properties, the sole producer of
          # every scheduled e2e alert's substantive content, and
          # `frontend/scripts/test/artifact-upload-safety.test.mjs` covers
          # `frontend/scripts/check-artifact-upload-safety.mjs`, the control that
          # keeps a Playwright output directory from being published as a public
          # artifact by any workflow that injects a repository secret. A glob here
          # (e.g. `.github/**/*.test.mjs` or `**/*.test.mjs`) could silently match
          # zero files after a rename or move and `node --test` would exit 0 having
          # run nothing, which is the exact anti-oracle this step exists to close.
          # An explicit missing path fails loudly instead (`node --test` exits 1
          # with "Could not find <path>"), so listing all four files by name is the
          # safer choice even though it means updating this line for a future
          # fifth harness.
          #
          # Measured 2026-08-29 after adding six cases to
          # extract-failing-specs.test.mjs (the shape-guard hardening), the
          # 22-case artifact-upload-safety.test.mjs, and the final-wave fixes:
          # eleven cases in health-rollup.test.mjs (the call-site discovery
          # defects and the fleet-claim assertions) and seven in
          # artifact-upload-safety.test.mjs (`secrets: inherit`, which the hard
          # rule's `${{ secrets.` literal could never see). The four files now
          # report `# pass 121`. Raised 75 -> 81 -> 103 -> 121 in step with
          # those, per the rule at the top of this comment; a floor left behind
          # would have let the new cases be deleted with the gate still green.
          #
          # Re-measured 2026-08-29 after the PR #780 review fixes: seven more
          # cases in artifact-upload-safety.test.mjs covering the two defects
          # in its own guard (a trailing YAML comment demoted a wholesale
          # Playwright output directory to the `narrow` exemption, and that
          # exemption was unbounded by filename so `error-context.md`, the file
          # that actually leaked a password, passed clean). Two of the seven
          # spawn the CLI itself rather than the exported function. Measured
          # with the exact `node --test` line below: 121 -> 128 -> 158 -> 172.
          #
          # The 128 -> 158 step is the PR #780 review's own findings closed:
          # +11 on the upload guard (the `playwright-json-report` output
          # directory it could not see, and three further routes to a
          # credential that a `secrets.` reference does not match: a `vars`
          # context reference, an OIDC `id-token: write` grant, and a blanket
          # write-all permissions grant that implies one), and +19 on the
          # health rollup, where the cron collision detector was lifted out
          # into `cronsCollide` and given range, step and comma-list handling
          # in every field. It previously compared minutes with a bare `===`
          # and split only hour and day-of-week on commas, so a neighbour
          # written as `1-5` was invisible to it.
          #
          # The 158 -> 172 step is the four-reviewer pass over those same
          # commits, which found two of them could not fail when their subject
          # broke. +12 on the upload guard: it now decides by containment
          # rather than by path spelling, so an ancestor of a Playwright output
          # directory is no longer exempt, and its step parser no longer loses
          # a step to a quoted `uses:` or a folded scalar. +2 on the health
          # rollup, where a day-of-week step term counted to 7 and the Sunday
          # normalisation turned that into a day the cron never named.
          #
          # This paragraph names the `vars` and write-all patterns in prose
          # rather than as literal `${{ }}`/`key: value` syntax on purpose.
          # `check-artifact-upload-safety.mjs`'s `injectsSecrets` docstring
          # states that those two patterns occur nowhere in
          # `.github/workflows/`; spelling the `vars` one out literally here
          # would make this comment the one hit that falsifies that claim,
          # because its detector regex has no `^`-anchor and matches after a
          # `#` exactly as readily as in a live directive. The write-all
          # detector is `^[ \t]*`-anchored and cannot match inside a comment,
          # so writing it literally would not change any tier's classifier
          # result, but the claim is about the pattern's textual occurrence
          # in the directory, not about the classifier, so it would still be
          # false the same way. Confirmed clean on 2026-08-29:
          # `grep -rn '\${{ *vars\.' .github/workflows/` and
          # `grep -rn 'permissions:\s*write-all' .github/workflows/` both
          # return no matches. Re-run both before writing either pattern
          # literally into this file again.
          MIN_TESTS: '172'
        run: |
          set -euo pipefail

          node --test --test-reporter=tap \
            .github/actions/ci-failure-issue/test/reconcile.test.mjs \
            .github/workflows/test/health-rollup.test.mjs \
            frontend/scripts/test/extract-failing-specs.test.mjs \
            frontend/scripts/test/artifact-upload-safety.test.mjs | tee harness.tap

          passed="$(sed -n 's/^# pass \([0-9]\+\)$/\1/p' harness.tap | tail -1)"
          failed="$(sed -n 's/^# fail \([0-9]\+\)$/\1/p' harness.tap | tail -1)"

          if [ -z "$passed" ] || [ -z "$failed" ]; then
            echo "::error::the harness produced no TAP summary, so its result is unknown"
            exit 1
          fi
          if [ "$failed" != "0" ]; then
            echo "::error::${failed} harness assertions failed"
            exit 1
          fi
          if [ "$passed" -lt "$MIN_TESTS" ]; then
            echo "::error::the harness reported only ${passed} passing tests, below the floor of ${MIN_TESTS}. A shrinking suite here reads exactly like a passing one."
            exit 1
          fi
          echo "${passed} harness assertions passed." >> "$GITHUB_STEP_SUMMARY"


  # Nothing in this repo lints workflow files (issue #756). The only workflow
  # validation was the `check-github-workflows` pre-commit hook, and that has
  # two independent holes: it is SCHEMA validation, so it never resolves a
  # `needs:` against declared job ids, evaluates a `${{ }}` expression, checks
  # `if:` syntax, or looks at the shell inside a `run:` block; and pre-commit
  # is not run in CI except for `interrogate`, so a workflow change pushed
  # without local hooks reached `main` with no validation at all.
  #
  # This is the fourth checker in this repo to sit only in pre-commit, where it
  # gates staged paths rather than the tree (see `UW-C354` for the third), and
  # workflow defects are the worst fit for "caught at review": `release.yml` is
  # 790 lines, its jobs run on triggers that never fire on a pull request, and a
  # typo in a `needs:` or an `if:` fails SILENTLY by skipping rather than by
  # erroring. The hook stays: schema validation and semantic linting catch
  # different things.
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pinned release tarball with its checksum verified, rather than
      # `reviewdog/action-actionlint` or `rhysd/actionlint`. Adding a
      # third-party action to lint this repo's actions puts the linter itself
      # inside the supply chain it is checking; a version-pinned binary whose
      # SHA-256 is asserted here is auditable in one line and pins the same
      # thing an action SHA would.
      # #CRITICAL security: an unverified download would let a compromised or
      # mitm'd release execute in CI with the repository checked out.
      # #VERIFY: the checksum below is compared before the archive is
      # unpacked, and the step exits non-zero on a mismatch.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output actionlint.tar.gz "${url}"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          rm -f actionlint.tar.gz
          ./actionlint --version

      # #CRITICAL: data-integrity: actionlint exits 0 when it finds no workflow
      # files, so a moved directory (or a run from the wrong working directory)
      # would turn this required leg into a green no-op that reads exactly like
      # a clean tree. This is the same anti-oracle the `alert-action` job's
      # MIN_TESTS floor exists to close, so the input set is asserted rather
      # than trusted.
      #
      # The shellcheck assertion is the second half of the same problem.
      # actionlint shells out to `shellcheck` for every `run:` block IF it is on
      # PATH and silently skips those checks if it is not. `ubuntu-latest` ships
      # it today; a runner-image change that dropped it would quietly halve what
      # this job checks while still reporting success.
      # #VERIFY: both the file count and shellcheck's presence are checked
      # before actionlint runs; either failing exits non-zero.
      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail

          workflow_count="$(find .github/workflows -maxdepth 1 \
            \( -name '*.yml' -o -name '*.yaml' \) -type f | wc -l)"
          if [ "${workflow_count}" -lt 30 ]; then
            echo "::error::found only ${workflow_count} workflow files to lint;" \
              "the repo has 46 (measured 2026-09-03). A shrunken input set" \
              "reads exactly like a clean one."
            exit 1
          fi

          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not on PATH, so actionlint would skip" \
              "every \`run:\` block check while still reporting success." \
              "Install it in this job rather than accepting the reduced coverage."
            exit 1
          fi

          echo "Linting ${workflow_count} workflow files with shellcheck $(shellcheck --version | sed -n 's/^version: //p')." \
            >> "$GITHUB_STEP_SUMMARY"
          ./actionlint -no-color

  # Uploads the backend's per-test-type coverage + JUnit to Codecov, INLINE so
  # it runs on PRs (the old workflow_run codecov.yml only ran on main). The
  # reusable `ci` job publishes coverage-{unit,integration,security}.xml and
  # junit-{...}.xml as the `coverage-reports` artifact; each uploads under its
  # own flag (single axis: one report -> one flag). Non-fatal (fail_ci_if_error
  # false) and deliberately NOT in ci-gate's needs: a Codecov hiccup must not
  # block merges. Frontend/design-system coverage upload from their own jobs.
  coverage-upload:
    name: Upload backend coverage (Codecov + Qlty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    # merge_group's commit is the ephemeral queue merge commit, not the real
    # commit that lands on main, so a coverage upload keyed to it is wasted;
    # the push-to-main run after the queue lands uploads for the real commit.
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name != 'merge_group' }}
    permissions:
      contents: read
    env:
      # Surfaced at job scope so the Qlty step's `if:` can gate on token
      # presence; `secrets.*` is not referenceable in a step-level if:. Absent
      # on forks, so the Qlty upload skips there rather than failing.
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Codecov path-fixing needs the source tree present: pytest-cov emits two
      # <source> roots (src and src/cyo_adventure), and Codecov disambiguates
      # them against `git ls-files`. Without a checkout the reports are rejected
      # server-side as "source code unavailability / path mismatch". The reports
      # themselves come from the artifact below.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download backend coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Upload unit coverage
        if: ${{ hashFiles('coverage-reports/coverage-unit.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-reports/coverage-unit.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration coverage
        if: ${{ hashFiles('coverage-reports/coverage-integration.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-reports/coverage-integration.xml
          disable_search: true
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload security coverage
        if: ${{ hashFiles('coverage-reports/coverage-security.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-reports/coverage-security.xml
          disable_search: true
          flags: security
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Qlty Cloud coverage. This runs here, not the old workflow_run qlty.yml,
      # because `qlty coverage publish` needs the repo checked out: it resolves
      # the Cobertura <source> roots (src and src/cyo_adventure) against the
      # working tree and reads the commit SHA from git. The reusable workflow_run
      # caller had neither, so its uploads carried unresolvable paths and no
      # commit association (green job, nothing on the dashboard). qlty merges the
      # three per-type reports into one report for the commit, mirroring the
      # Codecov sessions above. All three are produced every run; the unit
      # hashFiles gate just confirms the artifact downloaded.
      - name: Upload backend coverage to Qlty
        if: ${{ env.QLTY_COVERAGE_TOKEN != '' && hashFiles('coverage-reports/coverage-unit.xml') != '' }}
        # A Qlty upload hiccup must not fail the job or block a merge, matching
        # the Codecov steps' fail_ci_if_error: false.
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ env.QLTY_COVERAGE_TOKEN }}
          files: coverage-reports/coverage-unit.xml,coverage-reports/coverage-integration.xml,coverage-reports/coverage-security.xml

      - name: Upload unit test results
        if: ${{ !cancelled() && hashFiles('coverage-reports/junit-unit.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: coverage-reports/junit-unit.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration test results
        if: ${{ !cancelled() && hashFiles('coverage-reports/junit-integration.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: coverage-reports/junit-integration.xml
          disable_search: true
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload security test results
        if: ${{ !cancelled() && hashFiles('coverage-reports/junit-security.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: coverage-reports/junit-security.xml
          disable_search: true
          flags: security
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Guards the api-tests job on a Postman collection existing. The check runs in
  # a STEP (job-level `if: hashFiles(...)` is not permitted and fails the whole
  # workflow at startup), exposing the result as an output the api-tests job
  # gates on. Cheap (checkout + one file test).
  detect-api-collection:
    name: Detect API collection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Not in ci-gate's needs (see api-tests comment); skipping here on
    # merge_group cascades to skip the 15-minute docker-compose api-tests job
    # below via its `needs.detect-api-collection.outputs.present` check. Same
    # cascade for release-automation PRs (see detect-release-pr): they never
    # touch the API surface.
    needs: detect-release-pr
    if: github.event_name != 'merge_group' && needs.detect-release-pr.outputs.release_pr != 'true'
    permissions:
      contents: read
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Postman collection
        id: check
        run: |
          if [ -f docs/api/postman-collection.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  # API-level tests (Postman/newman) -> Codecov Test Analytics under the `api`
  # flag (org Codecov flag taxonomy; the tiered-flag standard lives in the org
  # standards repo, not at a path in this repo). ACTIVE: the collection lives
  # at docs/api/postman-collection.json; detect-api-collection keeps the job
  # skipped (not failed) only if it is ever removed. Intentionally NOT in
  # ci-gate's needs yet: promotion to a required gate is deferred until the
  # job proves stable across a few merges (see the promotion follow-up issue).
  api-tests:
    name: API Tests (newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-api-collection
    if: ${{ needs.detect-api-collection.outputs.present == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install newman
        run: npm install -g --ignore-scripts newman@6.2.1

      # Brings up the API (port 8000, /api/v1/health/live) plus Postgres from the repo
      # compose stack; the compose defaults (ENVIRONMENT=local dev auth, dev
      # token-signing secrets for the child-session/device-grant mints, no
      # external-service credentials) are all this job needs.
      - name: Start API stack
        run: docker compose up -d --build app db

      # No content-type assertion here, unlike the prod and real-stack probes.
      # That asymmetry is deliberate, not an oversight: the false pass UW-L04
      # documents needed a proxy in front of the app to forge a 200 in its
      # place, and this hits the published app port with no proxy in the path,
      # so a status code alone cannot be forged here. Keep it that way; if this
      # ever moves behind nginx, it needs the content-type check.
      - name: Wait for API readiness
        run: |
          # `_`, not `i`: the counter is never read, and shellcheck's
          # SC2034 is right that a named-but-unused variable reads as a bug.
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/live >/dev/null 2>&1; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready in time"; exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The `api` extra (FastAPI, SQLAlchemy) is enough to seed the compose
      # db; no `dev` extra test/lint tooling is needed here.
      - name: Install backend (api extra)
        run: uv sync --extra api

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      # The baseline dump carries Supabase's `OWNER TO "postgres"` statements;
      # the compose db runs as `cyo_adventure` with no postgres role, so the
      # push fails with SQLSTATE 42704 unless the role exists. Duplicate-
      # tolerant, mirroring tests/integration/test_schema_parity.py; a
      # superuser may reassign ownership to any existing role, so the bare
      # role is sufficient.
      - name: Create postgres role for baseline OWNER statements
        run: |
          docker compose exec -T db psql -U cyo_adventure -d cyo_adventure -c \
            'DO $$ BEGIN CREATE ROLE "postgres"; EXCEPTION WHEN duplicate_object THEN NULL; END $$;'

      # Applies the real Supabase migration chain against the compose db (not
      # Base.metadata.create_all): the collection exercises the migrated
      # schema, matching what staging/production deploys actually run.
      # #ASSUME: external resources: CLI 2.109.1 attempts a TLS handshake by
      # default against plain Postgres with no plaintext fallback, and
      # ignores ?sslmode=disable in the db-url, so pushing to the non-TLS
      # compose db fails with "tls error (server refused TLS connection)"
      # unless the standard libpq env var PGSSLMODE=disable is set (verified
      # locally against a scratch postgres:16-alpine). --yes answers the
      # push confirmation prompt non-interactively.
      # #VERIFY: on future supabase-cli upgrades, re-check whether the CLI
      # honors sslmode in the db-url and drop PGSSLMODE once it does.
      - name: Apply database migrations
        env:
          PGSSLMODE: disable
          SUPABASE_DB_URL: postgresql://cyo_adventure:password@localhost:5432/cyo_adventure
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      # Seeds the family/profiles/published+in-review stories the collection
      # asserts on. Idempotent (scripts/seed_dev_data.py), and runs AFTER the
      # migration so it inserts into the migrated schema, not a schema built
      # ad hoc from ORM metadata.
      - name: Seed dev data
        env:
          DATABASE_URL: postgresql+asyncpg://cyo_adventure:password@localhost:5432/cyo_adventure
        run: uv run python scripts/seed_dev_data.py

      # #ASSUME: timing: --delay-request 1100 originally mitigated a race
      # against the unit-of-work commit, which used to land after the response
      # was sent (FastAPI yield-dependency teardown), leaving a create's row
      # invisible to the immediately following request. That race is closed:
      # UnitOfWorkMiddleware now commits at http.response.start, before any
      # byte reaches the client (issue #461). The delay is kept deliberately,
      # because it also paces the suite under the 60 req/min rate limiter
      # wherever that middleware is enabled (it is off in this stack's
      # ENVIRONMENT=local) and gives margin on a slow runner.
      # #VERIFY: shortening this delay is a separate change; confirm the suite
      # is green across several runs before trusting a lower value, and keep
      # every newman invocation of this collection (here and the local loop in
      # docs/api/README.md) carrying whatever value is chosen.
      - name: Run newman (JUnit for Test Analytics)
        run: |
          newman run docs/api/postman-collection.json \
            --env-var "base_url=http://localhost:8000" \
            --delay-request 1100 \
            --reporters cli,junit \
            --reporter-junit-export newman-junit.xml \
            --bail

      - name: Upload API test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./newman-junit.xml
          disable_search: true
          flags: api
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Tear down API stack
        if: ${{ always() }}
        run: docker compose down -v

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        detect-release-pr,
        ci,
        frontend,
        frontend-e2e,
        design-system,
        contract,
        schema-docs,
        format-tree,
        rad-citations,
        docstrings,
        alert-action,
        workflow-lint,
      ]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # #CRITICAL: data-integrity: this gate is the required status check that
      # stands in for the whole suite, so whatever it reports IS the repo's
      # claim about a commit. It must never report a skip as a verification
      # (issue #594): a `skipped` job means "we chose not to check", a
      # `success` job means "we checked and it was fine", and collapsing the
      # two makes an unverified `main` indistinguishable from a tested one.
      # #VERIFY: tests/unit/test_ci_gate_contract.py parses this workflow and
      # asserts every job in `needs:` other than `detect-release-pr` is passed
      # to check_job below (that job's result is guarded separately by the
      # early exit, see test_the_policy_job_gates_the_whole_evaluation), that
      # each job's skip allowance matches its own job-level `if:`, and that
      # this job keeps `if: always()` so an upstream failure cannot turn the
      # required check itself into a silent skip.
      - name: Check CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR: ${{ needs.detect-release-pr.outputs.release_pr }}
          DETECT_RESULT: ${{ needs.detect-release-pr.result }}
          CI_RESULT: ${{ needs.ci.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          DESIGN_SYSTEM_RESULT: ${{ needs.design-system.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          SCHEMA_DOCS_RESULT: ${{ needs.schema-docs.result }}
          FORMAT_TREE_RESULT: ${{ needs.format-tree.result }}
          RAD_CITATIONS_RESULT: ${{ needs.rad-citations.result }}
          DOCSTRINGS_RESULT: ${{ needs.docstrings.result }}
          ALERT_ACTION_RESULT: ${{ needs.alert-action.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail

          failed=0
          skipped_jobs=()

          # check_job <display name> <result> <is a skip expected here?>
          #
          # The third argument is the whole point. Accepting `skipped`
          # unconditionally (the previous behaviour) accepts it for reasons
          # nobody intended: an upstream `needs` failure, a mistyped
          # job-level `if:`, or a condition someone adds later all surface as
          # `skipped` and would read as a pass. A skip is only tolerated when
          # this run's context is one that explains it.
          check_job() {
            label="$1"
            result="$2"
            skip_expected="$3"
            case "$result" in
              success)
                echo "- ✅ ${label}: passed" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped)
                if [ "$skip_expected" = "true" ]; then
                  echo "- ⏭️ ${label}: skipped, so NOT verified on this commit" \
                    >> "$GITHUB_STEP_SUMMARY"
                  skipped_jobs+=("$label")
                else
                  echo "- ❌ ${label}: skipped, and nothing in this run's context explains why" \
                    >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::${label} was skipped unexpectedly on a ${EVENT_NAME} event. A skip here is a defect, not a policy."
                  failed=1
                fi
                ;;
              *)
                echo "- ❌ ${label}: ${result}" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                ;;
            esac
          }

          # Every skip allowance below is derived from detect-release-pr's
          # output, so if that job did not succeed the gate cannot tell a
          # legitimate skip from a broken one and must not guess.
          if [ "$DETECT_RESULT" != "success" ]; then
            {
              echo "## CI Gate failed"
              echo ""
              echo "\`Detect release-automation PR\` reported \`${DETECT_RESULT}\`."
              echo "Without it the gate cannot establish which skips are expected."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Detect release-automation PR reported ${DETECT_RESULT}; the skip policy is unevaluable."
            exit 1
          fi

          # #CRITICAL: data-integrity: SIX jobs in this gate carry no
          # job-level `if:` and no `needs:` (schema-docs, format-tree,
          # rad-citations, docstrings, alert-action, workflow-lint), so unlike the rest of the
          # suite they really run on a release-automation commit. Every one of their
          # results must be evaluated BEFORE the release-skip branch below
          # returns 0, or a genuine failure is discarded and reported as an
          # intentional skip.
          # This is written as a list rather than as one hand-copied `if:`
          # per job precisely so the next unconditional job added to the gate
          # joins it by name instead of silently inheriting the hole:
          # format-tree sat in this branch's blind spot for exactly that
          # reason before rad-citations became the second member, docstrings
          # repeated the mistake as the fourth, alert-action joined as the
          # fifth by editing this loop rather than by being noticed later, and
          # workflow-lint joined as the sixth the same way.
          # #VERIFY: test_ci_gate_contract.py::TestGateDecisions asserts a
          # release commit with each of these results set to failure fails the
          # gate, and TestEveryUnconditionalJobIsReleaseChecked derives the set
          # of no-`if:`/no-`needs:` jobs from the workflow and asserts this loop
          # names every one of them, so a seventh such job cannot inherit the hole
          # by omission.
          if [ "$RELEASE_PR" = "true" ]; then
            for entry in \
              "ER Diagram Drift:$SCHEMA_DOCS_RESULT" \
              "Format (tree-wide):$FORMAT_TREE_RESULT" \
              "RAD Citation Gate:$RAD_CITATIONS_RESULT" \
              "Docstring coverage (interrogate):$DOCSTRINGS_RESULT" \
              "Scheduled-alert action harness:$ALERT_ACTION_RESULT" \
              "Workflow Lint (actionlint):$WORKFLOW_LINT_RESULT"; do
              unconditional_label="${entry%%:*}"
              unconditional_result="${entry#*:}"
              if [ "$unconditional_result" != "success" ]; then
                {
                  echo "## CI Gate failed"
                  echo ""
                  echo "\`${unconditional_label}\` reported \`${unconditional_result}\` on a"
                  echo "release-automation commit. That job runs unconditionally, so its"
                  echo "result is real here even though the rest of the suite did not run."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::${unconditional_label} reported ${unconditional_result} on a release-automation commit. That job runs unconditionally, so this is a real failure, not an expected skip."
                exit 1
              fi
            done
          fi

          # A release-automation commit (release/v* PR, or a chore(release):
          # push) intentionally skips the rest of the suite: the content was
          # already tested on the feature PR that produced it. That is a
          # defensible policy and the gate honours it, but it says so out
          # loud rather than reporting a bare pass.
          if [ "$RELEASE_PR" = "true" ]; then
            {
              echo "## CI Gate passed WITHOUT running the suite"
              echo ""
              echo "Release-automation commit: every quality job except \`ER Diagram Drift\`,"
              echo "\`Format (tree-wide)\`, \`RAD Citation Gate\`, \`Docstring coverage (interrogate)\`,"
              echo "\`Scheduled-alert action harness\` and \`Workflow Lint (actionlint)\` was"
              echo "intentionally skipped."
              echo "Those six carry no job-level condition, so they really ran and really"
              echo "passed. Beyond them this commit carries **no verification from this workflow**."
              echo "The tested content is the feature PR that produced it."
              echo ""
              echo "See the scheduled scans (\`security-analysis.yml\`, \`python-compatibility.yml\`,"
              echo "\`sbom.yml\`, \`container-security.yml\`) for coverage that does not depend on"
              echo "what triggered the last push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CI Gate passed without running the suite (release-automation commit). This commit is unverified by this workflow."
            exit 0
          fi

          # frontend, frontend-e2e, design-system and contract all carry
          # `if: github.event_name != 'merge_group' && ...`, so merge_group is
          # the one and only event on which their skip is by design. ci and
          # schema-docs have no such exclusion, so for them a skip is always a
          # defect. #VERIFY: test_ci_gate_contract.py asserts this mapping
          # against the actual job-level `if:` expressions.
          if [ "$EVENT_NAME" = "merge_group" ]; then
            merge_queue_skip_ok=true
          else
            merge_queue_skip_ok=false
          fi

          {
            echo "## CI Gate"
            echo ""
            echo "Event: \`${EVENT_NAME}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          check_job "CI (Python 3.14)" "$CI_RESULT" false
          check_job "ER Diagram Drift" "$SCHEMA_DOCS_RESULT" false
          # No skip allowance: this job has no job-level `if:`, so a skip here
          # can only mean an unintended condition crept in.
          check_job "Format (tree-wide)" "$FORMAT_TREE_RESULT" false
          # Also no job-level `if:`, for the same reason as Format (tree-wide).
          check_job "RAD Citation Gate" "$RAD_CITATIONS_RESULT" false
          check_job "Docstring coverage (interrogate)" "$DOCSTRINGS_RESULT" false
          check_job "Scheduled-alert action harness" "$ALERT_ACTION_RESULT" false
          check_job "Workflow Lint (actionlint)" "$WORKFLOW_LINT_RESULT" false
          check_job "Frontend (Node 22)" "$FRONTEND_RESULT" "$merge_queue_skip_ok"
          check_job "Frontend E2E (Playwright, mocked tier)" "$FRONTEND_E2E_RESULT" "$merge_queue_skip_ok"
          check_job "Design System (Node 22)" "$DESIGN_SYSTEM_RESULT" "$merge_queue_skip_ok"
          check_job "OpenAPI Contract Drift" "$CONTRACT_RESULT" "$merge_queue_skip_ok"

          # The disclosure below must not assert greenness in a run that is
          # about to fail: the ::warning:: is often the only line a reviewer
          # reads in the checks UI, and "CI Gate is green" printed above a
          # real failure sends them looking in the wrong place.
          if [ "${#skipped_jobs[@]}" -gt 0 ]; then
            {
              echo ""
              echo "⚠️ ${#skipped_jobs[@]} required job(s) were not run on this commit:"
              echo "\`${skipped_jobs[*]}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$failed" -eq 0 ]; then
              {
                echo "This gate is green because those skips are expected here, not because"
                echo "those checks passed."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::CI Gate is green with ${#skipped_jobs[@]} required job(s) not run: ${skipped_jobs[*]}"
            else
              {
                echo "Those skips are expected on this event. The gate is failing for a"
                echo "different reason: see the ❌ entries in the job list above."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$failed" -eq 1 ]; then
            {
              echo ""
              echo "❌ **CI Gate failed.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ **CI Gate passed.**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Explicit, so success never depends on which statement is last.
          exit 0
