# Python Compatibility Matrix Testing for CYO Adventure
# Tests the project across multiple Python versions and operating systems.
#
# Standalone implementation for Python compatibility testing.
name: Python Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  # No pull_request trigger: this matrix's 3.12 leg duplicates ci.yml's
  # required py3.12 test run 1:1 on every PR that touches src/tests/pyproject
  # (a 30-min-per-version job on top of ci.yml's own suite). Cross-version
  # compatibility (3.11/3.13) regresses far less often than PR-to-PR content
  # changes; the weekly schedule below plus this push-to-main trigger already
  # catch it within a day of any breakage, which is an acceptable tradeoff
  # for not adding ~30 min to every PR.
  schedule:
    # Weekly compatibility check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 45, not 30. The 3.11 leg hit the old 30-minute ceiling on two of three
    # consecutive runs (29m46s and 29m39s, both killed mid-suite) while 3.12
    # and 3.13 finished the same suite in 22-24 and 3.14 in about 5: 3.11 is
    # simply the slowest interpreter here and had no headroom left. A timeout
    # is indistinguishable from a hang in the summary job, so a leg that
    # routinely finishes seconds under its budget reports infrastructure
    # capacity as though it were a test result. Removing -x also lengthens the
    # failing path, which is exactly when the output matters most.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'

    permissions:
      contents: read
    steps:
      # harden-runner only enforces egress policy on Linux runners; it
      # silently no-ops on macOS/Windows. Gate it explicitly so the
      # limitation is visible in the workflow rather than implicit.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run tests
        # Force bash on all platforms; Windows runners default to PowerShell,
        # which cannot parse the backslash line-continuations below (ParserError).
        #
        # No -x. This matrix exists to find platform-specific breakage, and
        # once a platform is broken it tends to accumulate: the Windows leg
        # failed seventeen runs in a row, from #719 on 2026-08-16 through
        # 2026-08-24. For the first twelve there was one defect (os.kill on
        # Windows) and -x named it every time. #740 then added a second,
        # independent one (a host path separator in the census), and from that
        # point -x could only ever report whichever of the two random ordering
        # reached first: fixing the named one would have revealed the next, one
        # red run at a time. That is the cost this removes.
        # A leg that runs to completion costs the same wall clock it already
        # spends when green and names every failure in one run. It does make
        # the failing path longer than the passing one, which is why the job
        # timeout above was raised alongside this.
        shell: bash
        run: |
          uv run pytest tests/ -v --tb=short \
            --ignore=tests/integration \
            --ignore=tests/load \
            -m "not slow and not integration"

  summary:
    name: Compatibility Summary
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Some compatibility tests failed"
            exit 1
          fi
          echo "All compatibility tests passed!"
