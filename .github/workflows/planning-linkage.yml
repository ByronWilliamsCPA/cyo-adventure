# ============================================================================
# Planning document linkage
# ============================================================================
# Enforces the linkage contract in docs/planning/unscheduled-work-register.md:
# every row in every register must resolve to exactly one disposition, either a
# phase in the plan or a proof (a named blocker, a named decision owner, or a
# reference showing it is done). A row with neither is an orphan, and orphans
# are how directed work went missing before the 2026-07-28 sweep.
#
# Two triggers, two different jobs to do:
#
#   pull_request  - gate the change being made. Catches a new register row with
#                   no phase, or an ADR follow-on that points nowhere.
#   schedule      - catch drift no pull request touched. The cross-register
#                   checks compare three documents against each other, so a
#                   change to the debt register or the lessons log can orphan a
#                   row without anyone editing the unscheduled register.
#
# The pre-commit hook (check-work-linkage) runs the same script locally. This
# workflow exists because hooks are skippable and this repository runs
# concurrent sessions in a single working tree.
#
# Injection posture: no untrusted event input (issue/PR titles or bodies, commit
# messages, head_ref) is interpolated anywhere here. The github-script step uses
# only `context.serverUrl`, `context.repo`, and `context.runId`, all of which are
# runner-supplied, and it passes its body through the API rather than a shell.
# ============================================================================
name: Planning Linkage

on:
  pull_request:
    paths:
      - 'docs/planning/**'
      - 'docs/known-vulnerabilities.md'
      - 'known-vulnerabilities-baseline.toml'
      - '.trivyignore.yaml'
      - 'scripts/check_work_linkage.py'
      - 'scripts/check_lessons_log.py'
      - 'scripts/check_known_vulnerabilities.py'
      - '.github/workflows/planning-linkage.yml'
  schedule:
    # 07:11 UTC every Monday: off-peak, and offset from both the hour and the
    # dependency-provenance run at 06:23 so the two do not contend.
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkage:
    name: Work linkage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents alone: the checker reads local files and makes no API call.
      # Filing/commenting on the drift issue needs `issues: write`, but
      # job-level permissions cannot be made conditional on event name, so that
      # write scope lives on the separate file-drift-issue job below instead of
      # being granted here on every pull_request run too (PR #465).
      contents: read

    outputs:
      # Which checker failed, so file-drift-issue below can title and explain
      # the issue correctly. Without this it reports every scheduled failure as
      # planning-linkage drift, including an expired vulnerability acceptance,
      # and tells the responder to run a script that will pass.
      failed_checks: ${{ steps.classify.outputs.failed_checks }}

    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Check work linkage
        id: work-linkage
        # No flags, no network, no token: this is byte-for-byte the invocation
        # the check-work-linkage pre-commit hook runs locally. Two GitHub-facing
        # checks used to run here and nowhere else, which meant CI enforced a
        # contract the hook could not; retiring them removed that divergence
        # along with the upkeep of giving every open issue a phase home.
        run: python scripts/check_work_linkage.py

      - name: Check the authoring lessons log
        # Runs even when the linkage check failed, so one run reports both
        # rather than making the author fix one, push, and discover the
        # other; !cancelled() keeps that intent without overriding a workflow
        # cancellation the way always() would.
        id: lessons-log
        if: ${{ !cancelled() }}
        run: python scripts/check_lessons_log.py

      - name: Check known-vulnerability reassessment dates
        # Lives in this workflow rather than a security one because it needs
        # exactly what this workflow already provides and a per-PR gate cannot:
        # a SCHEDULE. A known-vulnerability entry expires through the passage
        # of time, not because someone edited a file, so a pull_request trigger
        # alone would never fire on the case that matters. The weekly cron plus
        # the file-drift-issue job below turn an expiring acceptance into a
        # filed issue without anyone remembering to look.
        #
        # Same posture as the two steps above: no flags, no network, no token,
        # byte-for-byte the invocation the check-known-vulns hook runs locally.
        id: known-vulns
        if: ${{ !cancelled() }}
        run: python scripts/check_known_vulnerabilities.py

      - name: Classify which checks failed
        id: classify
        # Runs whatever the outcomes were, so the classification exists even
        # when an earlier step failed. Each step above uses `!cancelled()`, so
        # all three have a real outcome by the time this runs.
        if: ${{ !cancelled() }}
        env:
          WORK_LINKAGE: ${{ steps.work-linkage.outcome }}
          LESSONS_LOG: ${{ steps.lessons-log.outcome }}
          KNOWN_VULNS: ${{ steps.known-vulns.outcome }}
        run: |
          FAILED=""
          [ "$WORK_LINKAGE" = "failure" ] && FAILED="${FAILED}work-linkage "
          [ "$LESSONS_LOG" = "failure" ] && FAILED="${FAILED}lessons-log "
          [ "$KNOWN_VULNS" = "failure" ] && FAILED="${FAILED}known-vulns "
          echo "failed_checks=${FAILED% }" >> "$GITHUB_OUTPUT"

  file-drift-issue:
    name: File drift issue
    needs: linkage
    # Scheduled runs only. A pull_request failure is already visible on the
    # pull request; filing an issue for it would duplicate the signal.
    # `failure()` here checks the needed job's (linkage) result, per GitHub's
    # job-level status-check semantics.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write, isolated to this job and this trigger so the linkage job above
      # (which also runs on every pull_request) never holds it (PR #465).
      issues: write

    steps:
      - name: Harden the runner
        # deferral: 2026-09-18
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A local `uses: ./...` requires a checkout, and this job had none.
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compose the issue body
        id: compose
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Space-separated ids from the linkage job. This workflow runs three
          # independent checkers, so the issue has to say which one failed:
          # an expired vulnerability acceptance reported as "planning linkage
          # has drifted", pointing at check_work_linkage.py, sends the
          # responder to a script that will pass and hides a closed release
          # gate.
          FAILED_CHECKS: ${{ needs.linkage.outputs.failed_checks }}
        with:
          result-encoding: string
          script: |
            const failed = (process.env.FAILED_CHECKS || '').split(' ').filter(Boolean);
            const detail = {
              'work-linkage': {
                label: 'Planning linkage',
                cause: [
                  'At least one register row no longer resolves to a phase or a proof.',
                  'This usually means one of three things:',
                  '',
                  '1. A row was added to the debt register or the lessons log without',
                  '   a corresponding UW-B*/UW-C* row in the unscheduled work register.',
                  '2. A phase was added to or renamed in roadmap.md without the',
                  '   vocabulary in the linkage contract being updated.',
                  '3. A row was edited into a state the contract does not allow.',
                  '',
                  'The contract is the "linkage contract" section of',
                  'docs/planning/unscheduled-work-register.md.',
                ],
                command: 'uv run python scripts/check_work_linkage.py',
              },
              'lessons-log': {
                label: 'Authoring lessons log',
                cause: [
                  'docs/planning/authoring-lessons-log.md is malformed, or a row claims',
                  'a status (applied, rejected, superseded) with nothing in Ref to prove it.',
                ],
                command: 'uv run python scripts/check_lessons_log.py',
              },
              'known-vulns': {
                label: 'Known-vulnerability release gate',
                cause: [
                  'A vulnerability acceptance in docs/known-vulnerabilities.md has passed',
                  'its Reassessment Due date, or a suppression no longer matches its entry.',
                  '',
                  'Per the Release Gate Policy an overdue entry BLOCKS RELEASES whatever its',
                  'Blocking Release value reads, because that verdict has expired. Reassess it',
                  'against current evidence rather than moving the date; the checker rejects a',
                  'window longer than 90 days from the last recorded assessment.',
                  '',
                  'Note this is time-triggered: no file changed, the deadline simply passed.',
                ],
                command: 'uv run python scripts/check_known_vulnerabilities.py',
              },
            };
            const hit = failed.filter((id) => detail[id]);
            const title = hit.length === 1
              ? `${detail[hit[0]].label} check is failing`
              : 'Scheduled repository checks are failing';
            const body = [
              hit.length
                ? `The scheduled Planning Linkage workflow failed: ${hit.map((id) => detail[id].label).join(', ')}.`
                : 'The scheduled Planning Linkage workflow failed; the failing check could not be identified.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              ...hit.flatMap((id) => [
                `## ${detail[id].label}`,
                '',
                ...detail[id].cause,
                '',
                `Reproduce locally with \`${detail[id].command}\`.`,
                '',
              ]),
              'Filed automatically because schedule-only workflows never surface a',
              'failure on a pull request. It closes itself once a scheduled run succeeds.',
            ].join('\n');
            // The issue plumbing lives in .github/actions/ci-failure-issue so all
            // eleven scheduled workflows share one implementation. Compose only.
            core.setOutput('summary', title);
            return body;

      - name: File or comment on the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[planning-linkage]'
          summary: ${{ steps.compose.outputs.summary }}
          body: ${{ steps.compose.outputs.result }}
          comment-body: The scheduled planning-linkage checks failed again.

  resolve-tracking-issue:
    name: Resolve the tracking issue
    needs: linkage
    # Scheduled runs only, matching the filing job: a green pull_request run proves
    # nothing about the weekly whole-corpus check and must not close its issue.
    #
    # Gated on the needed job's explicit result rather than `success()`, because a
    # SKIPPED dependency does not fail `success()`.
    if: needs.linkage.result == 'success' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the shared alerting action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/ci-failure-issue
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close the pinned issue
        uses: ./.github/actions/ci-failure-issue
        with:
          marker: '[planning-linkage]'
          mode: resolve
