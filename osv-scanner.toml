# OSV-Scanner Vulnerability Exceptions
# OpenSSF Scorecard uses OSV-Scanner to detect vulnerabilities
# This file documents false positives and vulnerabilities that don't affect this project
#
# Reference: https://google.github.io/osv-scanner/configuration/
# Format: [[IgnoredVulns]] with id and reason fields
#
# When to add exceptions:
# 1. Withdrawn vulnerabilities that are no longer valid
# 2. Vulnerabilities in old versions (current version is much newer and fixed)
# 3. Vulnerabilities that don't affect this project's codebase
# 4. False positives from vulnerability scanning tools
#
# IMPORTANT: Only add exceptions after careful analysis. Never ignore real vulnerabilities.
# Each exception MUST include:
# - id: CVE or advisory ID
# - reason: Detailed explanation of why this is safe to ignore

# ============================================================================
# Example: Withdrawn Vulnerability
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "CVE-XXXX-XXXXX"
# reason = "This CVE was withdrawn on YYYY-MM-DD due to [reason]. Not applicable to this project."

# ============================================================================
# Example: Fixed in Current Version
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "PYSEC-YYYY-NNN"
# reason = "Fixed in package-name >= X.Y.Z (released YYYY-MM-DD). Current version: X.Y.Z. Vulnerability does not apply."

# ============================================================================
# Example: Not Used in Project
# ============================================================================
# Uncomment and customize for your project:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# reason = "Vulnerability affects [specific feature] which is not used in this project. Safe to ignore."

# ============================================================================
# Project-Specific Exceptions
# ============================================================================
# Add your project's vulnerability exceptions below this line

# No project-specific exceptions currently active.

# Build-time-only frontend transitives with no non-breaking fix (2026-10-31).
# Each is reachable only through eslint or workbox-build (vite-plugin-pwa), which
# run on a developer or CI machine against repo-controlled input. None of them is
# bundled into the shipped app or loaded by the FastAPI service.
#
# #ASSUME: security: these packages never process attacker-controlled input.
# #VERIFY: `npm ls minimatch glob deepmerge --prefix frontend` shows only the
# eslint, typescript-eslint, and workbox-build parents. Revisit by ignoreUntil;
# drop each entry as soon as upstream ships a fix inside the declared range.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01
reason = """minimatch ReDoS via globparts amplification. Fixed only in 11.0.1, a major bump \
that eslint 10, typescript-estree and workbox-build 7 do not accept (they pin 3.x, 5.x, \
10.x). Reached only from lint and service-worker build tooling with repo-controlled glob \
patterns, never at runtime."""

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-01
reason = """glob AbortSignal cancellation bypass. Fixed only in 14.0.2; glob 11.1.0 is a \
direct dependency of workbox-build 7.4.1, which runs once at build time to generate the \
precache manifest. No cancellation signal is used and nothing ships to users."""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-01
reason = """deepmerge mergeObject() prototype poisoning; 4.3.1 is the last release and no fix \
exists. Pulled in by @rollup/plugin-node-resolve inside workbox-build, merging only the \
repo's own static build options at build time."""

# CVE-2022-42969, PYSEC-2022-42969, and GHSA-w596-4wvx-j9j6 were removed on the
# stated grounds that "the interrogate/py transitive dependency that triggered
# them is no longer present in the dependency tree". That premise is FALSE, and
# the correct reason to leave them out is a different one (UW-K08).
#
# The subject IS still here: `uv.lock` carries `py` 1.11.0, required by
# `interrogate` 1.7.0, declared in [project.optional-dependencies]. What changed
# is the advisories, not the tree. All three IDs are ALIASES of one another and
# all three are WITHDRAWN upstream: GHSA-w596-4wvx-j9j6 on 2025-08-01 and
# PYSEC-2022-42969 on 2026-06-09 (CVE-2022-42969 is an alias of both). Queried
# against api.osv.dev on 2026-08-14, the exact database osv-scanner reads:
# `py` 1.11.0 returns zero vulnerabilities.
#
# So the ignores are correctly absent, and re-adding them would create the
# "unused ignore" warnings the original removal was trying to avoid, just with a
# true justification instead of a false one. This is recorded rather than left
# implicit because the next reader will otherwise re-derive it from the same
# false premise: the right question was never "is the transitive gone" (it is
# not) but "is the advisory still live" (it is not).
#
# #ASSUME: security: a withdrawn advisory stays withdrawn. If OSV ever
# un-withdraws one, osv-scanner starts reporting it and this file needs a real
# suppression block with the disputed-ReDoS-in-a-dev-only-transitive rationale.
# #VERIFY: the security-analysis.yml `osv-scanner` job is the standing check;
# it passed on PR #709 with these three absent, which is the observation this
# comment previously asked a future run to make.
