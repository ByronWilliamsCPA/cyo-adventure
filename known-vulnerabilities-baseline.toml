# Undocumented-suppression baseline for scripts/check_known_vulnerabilities.py.
#
# Every row is a CVE suppressed in `.trivyignore` that has no entry in
# docs/known-vulnerabilities.md, and therefore no recorded reachability
# assessment and no reassessment date. The Release Gate Policy requires both.
#
# These eight predate the checker. They were surfaced by its first run on
# 2026-08-16, not introduced by it: the perl-base, libsqlite3-0 and ncurses
# blocks in `.trivyignore` are the only three that never carried a
# "Documented in docs/known-vulnerabilities.md; reassess <date>" comment, so
# they were suppressed without the paperwork the other blocks all have.
#
# They are grandfathered rather than written up on the spot for one reason: the
# session that added this checker had no route to security-tracker.debian.org
# (egress-blocked), and an entry asserting a fix status nobody verified is worse
# than a visibly missing one. `.trivyignore` says so itself, about a different
# block: "verified on the Debian tracker ... rather than inferred from scan
# absence, which suppression would have masked."
#
# This list may only SHRINK. Writing the entry and leaving its row here is
# itself an error: the checker reports rows that are no longer undocumented, so
# the backlog cannot be faked. Delete the row with the fix. Adding a row is a
# deliberate act that needs the same justification as this comment block.
#
# Tracked as UW-D31 in docs/planning/unscheduled-work-register.md.

[[undocumented]]
package = "perl-base"
cves = [
    "CVE-2026-42496",
    "CVE-2026-42497",
    "CVE-2026-48962",
    "CVE-2026-8376",
    "CVE-2026-9538",
]
reason = "Suppressed before the documentation rule was enforced; needs a written acceptance."

