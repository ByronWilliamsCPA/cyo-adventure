# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Hook stages:
# - pre-commit: Fast checks on every commit (formatting, syntax, security)
# - pre-push: Full quality checks before pushing (Qlty, full scans)
# - commit-msg: Conventional commit message validation
#
# Installation: curl https://qlty.sh | bash
# Documentation: https://docs.qlty.sh

ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter, qlty-check, qlty-full, trufflehog, bandit, bandit-full, frontend-eslint, frontend-prettier, frontend-typecheck]  # Skip local-only hooks

repos:
  # ============================================================================
  # Fast File Checks (Lightweight, run on every commit)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        # Diagram SVGs are PlantUML output, which ends at "</svg>" with no
        # trailing newline. Without this exclusion the hook appends one to every
        # SVG a commit happens to stage, so any PR touching one diagram silently
        # acquires one-byte diffs on the other 60-odd, and the next regeneration
        # reverts them again.
        #
        # This covers the hand-authored top-level diagrams as well as the
        # generated skeletons/ ones. It was scoped to skeletons/ alone until
        # 2026-08-04, which left the top-level diagrams exposed to the exact
        # failure this comment describes: 71 of the 81 committed SVGs under
        # docs/architecture/diagrams/ have no trailing newline, so the hook
        # rewrote every one it saw and then lost the change on re-render.
        exclude: ^docs/architecture/diagrams/.*\.svg$
      - id: check-yaml
        stages: [pre-commit]
        exclude: mkdocs.yml  # Exclude mkdocs.yml due to !ENV custom tags
      - id: check-json
        stages: [pre-commit]
        exclude: tsconfig.*\.json$  # tsconfig files use JSONC (comments) which check-json rejects
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # ============================================================================
  # Secret Detection - TruffleHog
  # ============================================================================
  # Advanced secret detection beyond detect-private-key
  # Detects API keys, tokens, credentials, and other secrets
  # Fail-closed: exits with error if trufflehog is not installed (not silent-skip)
  # Scans staged files only; excludes:
  #   CHANGELOG.md         - commit SHAs trigger false positives
  #   docker-compose*.yml  - dev placeholder credentials (real secrets go in .env, which is gitignored)
  #   uv.lock              - package sdist/wheel SHA256 hashes trip entropy-based
  #                          detectors (e.g. sentry_sdk's own sdist hash matches the
  #                          "SentryToken" detector); these are public PyPI hashes,
  #                          not credentials
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: 30d5bb91af1a771378349dbbb0c82129392acf70  # v3.95.6  # pragma: allowlist secret
    hooks:
      - id: trufflehog
        entry: bash -c 'git diff --cached -z --name-only --diff-filter=d 2>/dev/null | tr "\0" "\n" | grep -v "^CHANGELOG\.md$" | grep -v "^\.submodules/" | grep -v "^docker-compose[^/]*\.ya\?ml$" | grep -v "^uv\.lock$" | grep -v "^$" | tr "\n" "\0" | xargs -0 -r trufflehog filesystem --fail --no-update'
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Secret Detection - detect-secrets Baseline Regression
  # ============================================================================
  # Baseline file prevents regression of known secrets
  # Requires .secrets.baseline file created via: detect-secrets scan > .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # pre-push: the baseline tracks secret line numbers across the whole
        # tree; running at pre-commit churns the baseline whenever unstaged
        # files are stashed. trufflehog (above) is the fail-closed pre-commit
        # secret gate; detect-secrets provides the baseline-regression layer
        # at pre-push (PC-013 dual-layer stays satisfied).
        stages: [pre-push]

  # ============================================================================
  # Security Scanning - Bandit
  # ============================================================================
  # Dedicated Bandit hook for Python security analysis
  # Runs on changed files during pre-commit, full scan on pre-push
  # Configuration in pyproject.toml [tool.bandit]
  - repo: https://github.com/PyCQA/bandit
    rev: 36fd65054fc8864b4037d0918904f9331512feb5  # 1.7.10
    hooks:
      - id: bandit
        name: Bandit Security Scan (changed files)
        args: ['-c', 'pyproject.toml', '-ll']  # Medium+ severity only
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|fuzz)/

  # Full Bandit scan on pre-push (catches all issues before PR)
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Security Scan (full src/)
        entry: uv run bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

  # ============================================================================
  # Conventional Commits Enforcement
  # ============================================================================
  # Enforces conventional commit message format for semantic versioning
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 406f0d1a4ffcd9eb0be9f0f6b824df619b38f41e  # v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # ============================================================================
  # Commitizen Message Validation
  # ============================================================================
  # Validates commit message follows conventional commit format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 286da5488db79f4cf5261e14a3c8976d89b5aa70  # v4.16.3  # pragma: allowlist secret
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ============================================================================
  # pyproject.toml Validation
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 435e09f5ed9fe57f3444ebfa54c663d0ac8033fe  # v0.20.2
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  # ============================================================================
  # GitHub Workflow Validation
  # ============================================================================
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4e7291655d44e99511858efd33bea0bdbb58d835  # 0.29.4
    hooks:
      - id: check-github-workflows
        stages: [pre-commit]

  # ============================================================================
  # Ruff Linting and Formatting (Fast, pre-commit stage)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in lockstep with the `ruff` pin in uv.lock: the hook and the CI
    # quality gate must agree on rule behavior, or a noqa that one version
    # requires becomes an unused-directive (RUF100) error in the other.
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c  # v0.16.0
    hooks:
      - id: ruff
        stages: [pre-commit]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        stages: [pre-commit]

  # ============================================================================
  # Frontend Fast Checks (ESLint + Prettier, pre-commit stage)
  # ============================================================================
  # Mirrors the Ruff section above: fast, staged-files-only checks so a
  # frontend lint/format error is caught locally instead of surfacing 5+
  # minutes later in the `frontend` CI job. Local system hooks (needs the
  # frontend/node_modules toolchain, not a pre-commit-managed Python venv);
  # both are in the pre-commit.ci `skip:` list above since Node isn't
  # available in that hosted sandbox. Paths passed by pre-commit are
  # repo-root-relative (frontend/src/...); each is rewritten relative to
  # frontend/ before being handed to the tool, since both run with
  # `cwd=frontend`.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: ESLint (frontend, staged files)
        entry: >-
          bash -c 'cd frontend && files=(); for f in "$@"; do files+=("${f#frontend/}"); done; npx eslint --max-warnings=0 "${files[@]}"' --
        language: system
        # Kept in step with the `lint` script in frontend/package.json; the
        # two scopes drifting is how design-system/ came to be linted by
        # nothing at all. e2e-staging-sweep, e2e-support, design-system/src,
        # e2e-usersim, design-system/.design-sync/previews, scripts/*.mjs and
        # the four named root/nested config files were all missing here at one
        # point or another. The playwright configs and the other named config
        # files are listed individually because they sit at the frontend root
        # (or, for design-system/vite.config.ts, one specific nested path)
        # rather than in a linted directory.
        # #ASSUME: security: this glob and the `lint` script in
        # frontend/package.json cover the same paths, so a file the SAST floor
        # (eslint-plugin-security, no-unsanitized) reaches in CI is also
        # reached at commit time.
        # #VERIFY: widening the npm lint script means widening this; the two
        # drifting is how design-system/ came to be linted by nothing at all.
        # tests/unit/test_frontend_eslint_scope_parity.py derives both scopes
        # from their real sources (this regex and the npm `lint` script) and
        # fails by naming the missing path when they diverge, so this can no
        # longer drift silently in either direction.
        files: |
          (?x)^frontend/(
            src
            |design-system/src
            |design-system/\.design-sync/previews
            |e2e
            |e2e-real
            |e2e-staging
            |e2e-staging-sweep
            |e2e-support
            |e2e-prod
            |e2e-usersim
          )/.*\.tsx?$
          |^frontend/scripts/.*\.mjs$
          |^frontend/(
            playwright[^/]*\.config\.ts
            |vite\.config\.ts
            |openapi-ts\.config\.ts
            |eslint\.config\.js
            |design-system/vite\.config\.ts
          )$
        # frontend/eslint.config.js:8 already lists 'src/client' in its
        # `ignores`, the same exemption .prettierignore:8 gives it: that
        # directory is @hey-api/openapi-ts output, regenerated by
        # `npm run generate-client`, and the contract CI job is its real drift
        # gate. Naming an ignored file on the eslint CLI emits a "File ignored
        # because of a matching ignore pattern" warning, and --max-warnings=0
        # above turns that warning into a hook failure, so without this exclude
        # every legitimate client-regeneration commit fails pre-commit on a
        # false positive.
        exclude: ^frontend/src/client/
        stages: [pre-commit]

      - id: frontend-prettier
        name: Prettier format check (frontend, staged files)
        entry: >-
          bash -c 'cd frontend && files=(); for f in "$@"; do files+=("${f#frontend/}"); done; npx prettier --check --ignore-unknown "${files[@]}"' --
        language: system
        # Tree-wide under frontend/, not just src/: e2e specs, the design-system
        # package, eslint.config.js, index.html and README.md are all real
        # sources and were previously unchecked here and in CI alike. Exclusions
        # live in frontend/.prettierignore, which Prettier honours even for
        # explicitly-passed paths, so they are not duplicated into this glob.
        # No extension list. This hook passes staged paths explicitly, and an
        # unparseable path (nginx.conf, Dockerfile) makes Prettier exit
        # non-zero rather than skip, which is why an allowlist was here. But
        # `prettier --support-info` reports 115 extensions and the allowlist
        # named 12, so 103 supported types (mts, cts, mdx, jsonc, json5, less,
        # graphql, vue, webmanifest, ...) passed this hook untouched and were
        # then checked by CI's `prettier --check .`: the hook and the gate
        # disagreed about what "formatted" means, in the direction that lets a
        # commit through and reds the PR.
        #
        # `--ignore-unknown` is the mechanism for exactly this: an unknown path
        # is skipped instead of erroring. Verified on prettier 3.9.6: a
        # Dockerfile alone exits 2 without the flag and 0 with it, a
        # Dockerfile plus a misformatted .ts still exits 1, and .prettierignore
        # is still honoured. The hook's scope is now the same `frontend/` tree
        # CI checks, with the exclusions living in one place.
        # #ASSUME: security: none; this is a formatting gate.
        # #VERIFY: `npx prettier --support-info` is the source of truth for
        # what Prettier can parse; do not reintroduce a hand-maintained list.
        files: ^frontend/
        # frontend/src/client is generated (hey-api) build output committed raw
        # by design: the CI contract job diffs it against the generator's exact
        # output, so prettier-formatting it would create permanent drift.
        exclude: ^frontend/src/client/
        stages: [pre-commit]

  # ============================================================================
  # Type Checking with BasedPyright (Strict Mode)
  # ============================================================================
  # BasedPyright: faster, stricter type checker (replaces mypy)
  # Local system hook: avoids spurious "files modified" warnings with --no-sync
  - repo: local
    hooks:
      - id: basedpyright
        name: BasedPyright type checker (strict mode)
        entry: uv run --no-sync basedpyright src/
        language: system
        pass_filenames: false
        # pre-push: matches the repo's heavy-lint-at-pre-push design (qlty-full
        # also runs BasedPyright). Pre-existing middleware type debt is deferred
        # to pre-push and CI rather than gating every commit.
        stages: [pre-push]

  # ============================================================================
  # Frontend TypeScript Type Checking (tsc -b, pre-push stage)
  # ============================================================================
  # Mirrors BasedPyright's placement immediately above: type checking is
  # slower than lint/format, so it is deferred to pre-push rather than
  # gating every commit. `tsc -b` is incremental (frontend/tsconfig*.tsbuildinfo),
  # so repeat local runs after the first are fast. Local system hook (needs
  # the frontend/node_modules toolchain); in the pre-commit.ci `skip:` list
  # above since Node isn't available in that hosted sandbox.
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: Frontend TypeScript type checker (tsc -b)
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ============================================================================
  # YAML Linting
  # ============================================================================
  # Validates YAML files for syntax and style issues
  # Configuration: .yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0  # pragma: allowlist secret
    hooks:
      - id: yamllint
        args: [--strict]
        # pre-push: aligns with the repo's heavy-lint-at-pre-push philosophy
        # (qlty-full already runs yamllint). Avoids gating every commit on
        # --strict warnings across the generated workflow files.
        stages: [pre-push]

  # ============================================================================
  # Qlty Unified Quality Checks (Pre-Push)
  # ============================================================================
  # Moved to pre-push to avoid clogging PR reviews with issues
  # Qlty runs all quality tools in a single pass:
  # - Ruff (linting + formatting)
  # - BasedPyright (type checking)
  # - Gitleaks (secrets detection)
  # - Markdownlint (markdown linting)
  # - Yamllint (YAML linting)
  # - OSV Scanner (dependency vulnerabilities)
  # - Code smells and complexity analysis
  #
  # Configure via .qlty/qlty.toml
  # Install: curl https://qlty.sh | bash && qlty plugins install
  - repo: local
    hooks:
      - id: qlty-check
        name: Qlty Code Quality Check (changed files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check --filter=diff || echo 'Qlty not installed - skipping (install: curl https://qlty.sh | bash)'"
        language: system
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: qlty-full
        name: Qlty Full Quality Check (all files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check src/ || echo 'Qlty not installed - skipping'"
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true


  # ============================================================================
  # Custom Documentation Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: python tools/validate_front_matter.py docs
        language: python
        files: ^docs/(?!planning/).*\.md$
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - python-frontmatter>=1.1.0
          - pydantic>=2.0
          - ruamel.yaml>=0.18

  # ============================================================================
  # Planning Document Linkage
  # ============================================================================
  # docs/planning/ is exempt from front-matter validation above (UW-K20), so
  # these two hooks are the only automated gate over the planning tree. They
  # enforce that directed work cannot be recorded without a disposition: a
  # phase, a named blocker, a named decision owner, or a reference proving it
  # is done. The contract they implement is the "linkage contract" section of
  # docs/planning/unscheduled-work-register.md.
  - repo: local
    hooks:
      - id: check-work-linkage
        name: Work linkage (registers resolve to a phase or a proof)
        entry: python scripts/check_work_linkage.py
        language: system
        files: ^(docs/planning/.*\.(md|toml)|scripts/check_work_linkage\.py)$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-lessons-log
        name: Authoring lessons log well-formed
        entry: python scripts/check_lessons_log.py
        language: system
        files: ^(docs/planning/authoring-lessons-log\.md|scripts/check_lessons_log\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # The Release Gate Policy in docs/known-vulnerabilities.md has said since
      # 2026-07-29 that an entry past its reassessment date blocks releases
      # whatever its "Blocking Release" value reads. Nothing enforced that until
      # this hook; the dates were prose in a table. Note the hook alone is not
      # sufficient, because an entry expires with time rather than with an edit:
      # the weekly Planning Linkage schedule is what catches that.
      - id: check-known-vulns
        name: Known-vulnerability entries are current
        entry: python scripts/check_known_vulnerabilities.py
        language: system
        # Verbose regex (?x): whitespace and newlines are ignored, so the
        # alternation can wrap inside the project's 120-char YAML guideline
        # without changing what it matches.
        files: |
          (?x)^(
            docs/known-vulnerabilities\.md
            |\.trivyignore\.yaml
            |known-vulnerabilities-baseline\.toml
            |scripts/check_known_vulnerabilities\.py
          )$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-pytest-raises-scope
        name: pytest.raises blocks invoke at most one non-safe call in their body
        entry: python scripts/check_pytest_raises_scope.py
        language: system
        files: ^(tests/.*\.py|scripts/check_pytest_raises_scope\.py)$
        pass_filenames: true
        stages: [pre-commit]

      # A RAD #VERIFY line names the test that proves the assumption above it.
      # A citation naming a test that does not exist is worse than no citation:
      # it reads as proof while the named test, not existing, proves nothing.
      # The existing backlog is recorded in rad-citation-baseline.toml and is
      # grandfathered; the hook blocks new and newly-broken citations, and
      # also reports a baseline row that has stopped being stale so the debt
      # list can only shrink.
      # TypeScript citations are checked for file existence only, because they
      # paraphrase an it() title rather than quoting it; see the script's
      # module docstring.
      #
      # Ceiling (read before trusting a green run): this hook proves a cited
      # test EXISTS. It cannot and does not prove that test would FAIL if the
      # tagged property were removed; whether a cited test discriminates the
      # claim it is cited for remains a human review judgement. See
      # "Deliberate non-goals" in scripts/check_rad_citations.py's module
      # docstring.
      #
      # Scope: this hook's files: regex below covers src/, scripts/,
      # frontend/src/, and the baseline file. It does NOT scan tests/,
      # supabase/, or frontend/e2e/, all of which carry #VERIFY markers of
      # their own; a stale citation in any of those trees is invisible to
      # this gate.
      - id: check-rad-citations
        # Quoted: an unquoted " #" would start a YAML comment and truncate
        # the name to "RAD".
        name: "RAD #VERIFY citations name tests that exist"
        entry: python scripts/check_rad_citations.py
        language: system
        files: >-
          ^(src/.*\.py|scripts/.*\.py|frontend/src/.*\.tsx?|rad-citation-baseline\.toml)$
        pass_filenames: true
        stages: [pre-commit]


  # ============================================================================
  # Python Docstring Coverage
  # ============================================================================
  # Interrogate ensures all Python code has proper docstrings
  # Two scopes: scripts (85% threshold) and src (80% threshold)
  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998  # 1.7.0
    hooks:
      - id: interrogate
        alias: interrogate-scripts
        name: Interrogate (scripts/ scope, 85%)
        args: ['-v', '-c', 'pyproject.toml', '--fail-under', '85', 'scripts/']
        language_version: python3.14
        pass_filenames: false
        stages: [pre-commit]
      - id: interrogate
        alias: interrogate-src
        name: Interrogate (src/ scope, 80%)
        args: ['-v', '-c', 'pyproject.toml', '--fail-under', '80', 'src/']
        language_version: python3.14
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Docstring Argument Validation
  # ============================================================================
  # Pydoclint validates that docstring arguments match function signatures
  # Configuration in pyproject.toml [tool.pydoclint]
  - repo: https://github.com/jsh9/pydoclint
    rev: 88d83c94156c5e51a09938e77019f2c58e92ab58  # 0.8.4
    hooks:
      - id: pydoclint
        args: ["--config=pyproject.toml"]
        types: [python]
        # pre-push: docstring-signature strictness on pre-existing code is
        # deferred to pre-push and CI, consistent with the heavy-checks-at-
        # pre-push design; the hook stays present for PC-006.
        stages: [pre-push]
        exclude: ^(tests|scripts|benchmarks|tools)/

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  # Validates Markdown files for style and best practices
  # Configuration: .markdownlint.json (with baseline: .markdownlintignore)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: a4d5d37e66ebcd6b3705204a1d6dbb56dea66338  # v0.49.0  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        # pre-push: aligns with the repo's heavy-lint-at-pre-push philosophy
        # (qlty-full already runs markdownlint). Pre-existing template-doc debt
        # is tracked in docs/template_feedback.md; gating commits on it is out
        # of scope for the compliance pass.
        stages: [pre-push]

  # ============================================================================
  # No Em-Dash Check (Unicode U+2014)
  # ============================================================================
  # Enforces use of hyphens/commas/semicolons instead of em-dashes
  # Pre-scan confirmed no existing em-dashes in the repository
  - repo: local
    hooks:
      # The previous form of this hook (`bash -c 'git grep --cached -nP "\xe2\x80\x94"'`)
      # could not fire where it mattered: `git grep -P` resolves `\xNN` against the
      # locale, and under `C.UTF-8` (the only UTF-8 locale in this project's containers)
      # PCRE reads `\xe2` as codepoint U+00E2 rather than a raw byte, so it matched zero
      # of the 62 occurrences then in the tree. It also scanned the whole index, so one
      # legacy violation would have failed every later commit. See the script's docstring.
      - id: no-em-dash
        name: No em-dash character check
        entry: python scripts/check_no_em_dash.py
        language: system
        types: [text]
        exclude: ^out/
        stages: [pre-commit]

# Exclude patterns
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      data/|
      models/|
      .*\.pyc
  )$
