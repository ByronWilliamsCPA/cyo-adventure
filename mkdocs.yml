# Docs exclusion
# planning/README.md conflicts with planning/index.md (which is the proper index)
# planning/project-plan-template.md is a template, not intended for publishing
# template_feedback.md is gitignored and local-only, so it is absent in CI but
# present in a working checkout. Excluding it keeps `strict: true` from failing
# locally on a file that is deliberately not in the nav.
# planning/evidence/ is the raw artifact set behind the generation research brief:
# model outputs, rating rounds, and the scripts that built them, archived in git so
# the brief's figures stay re-derivable. MkDocs copies non-Markdown files under
# docs/ into the site verbatim, so without this entry roughly 3 MB of JSON, Python,
# and shell fixtures would be served as public static assets. The evidence is kept
# in the repository and read there, not published.
# sentinel-reinsertion/ is deliberately re-included: it predates the rest of the
# evidence tree, is already published, and fifteen links from the story-personalization
# and story-structure planning docs resolve into it. Excluding it would turn those
# into 404s on the site, and MkDocs reports a link to an excluded page at INFO level,
# so `strict: true` would not catch the breakage.
# planning/vendor-comparison/ is the cross-vendor fill harness's committed run
# evidence: briefs, vendor pins, per-book JSON and reports, kept in git so a
# comparison's figures stay re-derivable. It is excluded for the same reason
# planning/evidence/ is, and the DeepSeek v4 Pro run took the tree from ~36 KB
# to ~1.1 MB, so without this entry roughly a megabyte of generated story JSON
# would be served as public static assets. Non-Markdown files never trip
# `strict: true`, so a green docs build is not evidence that they stay
# unpublished; only this entry is.
# planning/safety/*.json is the moderation-safety evidence tree's DATA: the adversarial corpus and
# its run artifacts, the Stage-0 baseline capture, and the production-derived floor-replay and
# findings-extract payloads (~650 KB, the 2026-08-31 findings extract alone 138 KB). The extract is
# de-identified (no child, family, profile, title, or prose field survives it), but it is still
# production moderation data and it is nobody's published reading. Excluded for the same reason as
# planning/evidence/: MkDocs copies non-Markdown files under docs/ verbatim, so without this entry
# they are served as public static assets by direct URL, and a green `strict: true` build says
# nothing about it, because non-Markdown files never trip strict.
# The pattern is scoped to *.json rather than to the whole directory ON PURPOSE. The six Markdown
# reports under planning/safety/ are prose, already published, and reached by seven links from
# pages that ARE published (operations/runbook.md, planning/roadmap.md, adr-005, the register).
# MkDocs reports a link to an excluded page at INFO level, so excluding the directory wholesale
# would 404 those seven links while `strict: true` stayed green: the same trap the
# sentinel-reinsertion re-include above exists to avoid.
exclude_docs: |
  planning/README.md
  planning/project-plan-template.md
  planning/evidence/
  !planning/evidence/sentinel-reinsertion/
  planning/vendor-comparison/
  !planning/vendor-comparison/README.md
  planning/safety/*.json
  template_feedback.md

# Validation
strict: true
