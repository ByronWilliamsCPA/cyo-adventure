      character_depth_change: not_reported
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: strong
      age_fit: mixed
    notes: >
      Real title confirmed (hardcover, April 2022, 88pp). A 2023 sequel "Endlessly Ever After:
