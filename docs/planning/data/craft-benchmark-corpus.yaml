# Craft-review benchmark corpus: sourced entries.
#
# Companion data file to docs/planning/craft-review-benchmark-corpus.md (register row proposed as
# UW-N11; not yet assigned, see that doc's "Register linkage" note). Each entry stores title/author/ISBN/source/URL, a derived craft
# label, and, where a claim needs its wording to be checkable, a short attributed quotation from
# the review. It stores no review in whole or in substantial part.
#
# THE POSTURE, STATED ACCURATELY. An earlier version of this header and of the companion doc said
# "never the review text itself". That was not what the file did: several `positive_signals` and
# `negative_signals` fields are short verbatim or near-verbatim fragments of the reviews they cite,
# because a paraphrase of "stilted dialogue" is worse evidence than the phrase itself. The honest
# description of what is here is SHORT ATTRIBUTED QUOTATION PLUS DERIVED LABELS: brief phrases,
# each attached to a named source and a URL, alongside labels this project wrote. That is a
# different and weaker claim than "no review text", and it is the one a reader should audit
# against. What the file still does not and must not contain: any review reproduced whole or in
# substantial part, and any review text routed into a prompt, a generation input, or a training
# set. A quotation long enough to substitute for reading the review does not belong here.
#
# Provenance, in two passes.
#
# Pass 1 (2026-08-13) sourced all ten titles via parallel research agents using WebSearch, in a
# session whose network egress policy blocked WebFetch for every review-site domain attempted
# (kirkusreviews.com, goodreads.com, commonsensemedia.org, slj.com, thestorygraph.com, amazon.com,
# and others) on every agent run. Every finding was therefore reconstructed from search-snippet
# synthesis rather than a first-hand page read.
#
# Pass 2 (2026-08-30) re-ran the checks from a session with working egress and read the pages
# directly. Fourteen source rows across nine of the ten titles were promoted to
# `verification_method: primary_source_fetch`. That
# pass also FALSIFIED three claims that pass 1 had recorded at `confidence: high`, which is the
# argument for never treating snippet synthesis as a substitute for a page read:
#   * `traitors-in-space`: the claimed Kirkus "starred review" does not exist. The page shows no
#     star. The "45+ endings" figure is also Kirkus's, not School Library Journal's.
#   * `leviathan-shiga`: the claimed Kirkus "starred review" does not exist either. No star.
#   * `the-citadel-of-whispers`: the Kirkus review does name Zara, Saeed, and Arjun, but only in
#     its plot summary. It does not call the supporting cast interesting. The word the review
#     applies, and applies to the magic system and the political machinations rather than to any
#     character, is "intriguing".
# Two starred-review claims survived pass 2 and are now sourced to the publisher's own review
# round-up, which labels the star explicitly: `endlessly-ever-after` (SLJ) and
# `search-for-a-giant-squid` (Booklist).
#
# Every source row states its `verification_method` explicitly. It used to be inferable from the
# field's ABSENCE, which meant a parser saw `None` on 20 of the 35 rows with the rule attached
# nowhere it could read; the 20 were written out on 2026-08-30. A row not marked
# `primary_source_fetch` is pass-1 snippet synthesis and is capped at medium confidence
# accordingly.
#
# Nothing falsified in pass 2 was deleted; it was corrected in place with the correction recorded,
# so the file cannot silently improve its own track record.
#
# confidence values: high (a direct page read confirmed it, or multiple independent sources
# converge), medium (single source, snippet-only), low (secondary/tertiary source, thin coverage).
# verification_method values (present on every source row, never inferred from absence):
# primary_source_fetch (the cited page was read directly), websearch_snippet, unverified.
# craft_labels values: strong / mixed / weak / not_reported (source never addressed it).

schema_version: 1
sourced_date: "2026-08-13"
reverified_date: "2026-08-30"
sourcing_method: >-
  Pass 1: WebSearch snippet synthesis via parallel research agents, WebFetch egress-blocked for all review
  domains. Pass 2 (2026-08-30): direct page reads from a session with working egress; see the header for the
  three pass-1 claims it falsified.

titles:
  - id: endlessly-ever-after
    title: "Endlessly Ever After: Pick YOUR Path to Countless Fairy Tale Endings!"
    author: "Laurel Snyder (illustrated by Dan Santat)"
    isbn_or_asin: "9781452144825"
    publisher: "Chronicle Books"
    age_band_claimed: "Sources disagree: SLJ lists PreS-Gr3; Horn Book and parent reviewers place it closer to 7-11 due to dark/tragic endings"
    band_group: "5-7"
    format: picture_book_branching
    sources:
      - name: Kirkus Reviews
        reviewer_type: professional
        url: "https://www.kirkusreviews.com/book-reviews/laurel-snyder/endlessly-ever-after/"
        confidence: high
        verification_method: primary_source_fetch
        positive_signals: ["branching gives the familiar fairy-tale road real variety", "closes on an imperative recommendation"]
        negative_signals: []
        evidence_paraphrase: >-
          Praises the surprise twists the path choices create; the publisher's round-up quotes the verdict as
          'Multiple reader options give the woodsy road...any number of surprise twists...Pick it up!'
        verification_note: "Read directly 2026-08-30. No Kirkus star, and none was claimed."
      - name: School Library Journal
        reviewer_type: professional
        url: "https://www.chroniclebooks.com/products/endlessly-ever-after"
        confidence: high
        verification_method: primary_source_fetch
        positive_signals: ["starred review", "readers direct a rhyming story that changes on every reading"]
        negative_signals: []
        evidence_paraphrase: "Starred review crediting the choice-driven structure with making the story change every time through."
        verification_note: >
          The star is CONFIRMED, but not from SLJ directly: slj.com returns HTTP 403 to an
          unauthenticated fetch. The citation URL is therefore the publisher's own review round-up
          (Chronicle Books), read directly 2026-08-30, which lists "School Library Journal
          (star Starred)" against the quotation "readers will delight in directing a rhyming story
          that magically changes every time". A publisher round-up is an interested secondary
          source; it is cited here because it names the awarding publication and labels the star
          explicitly, which the pass-1 snippet did not. Pass 1's "suited to group read-alouds"
          signal is dropped: it is unattributable to any text now readable, and it sits in direct
          tension with the Horn Book caution recorded below.
      - name: "The Horn Book"
        reviewer_type: professional
        url: "https://www.hbook.com/story/review-of-endlessly-ever-after-pick-your-path-to-countless-fairy-tale-endings-may22"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["text and art called endlessly clever", "drives genuine reread demand since middles and endings vary"]
        negative_signals: ["despite oversize trim, explicitly not a story-hour book; better for one or two listeners"]
        evidence_paraphrase: "Praises the humor/grim tonal balance but cautions the format suits intimate reading, not group story-hour."
      - name: "Goodreads (aggregate)"
        reviewer_type: reader
        url: "https://www.goodreads.com/en/book/show/58067218-endlessly-ever-after"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["~4.37 average, 1500+ ratings", "reviewers cite high rereadability, kids wanting to exhaust every path"]
        negative_signals: []
        evidence_paraphrase: "Reader consensus centers on rereadability and humor; little discussion of character depth."
      - name: "Publishers Weekly (via publisher round-up)"
        reviewer_type: professional
        url: "https://www.chroniclebooks.com/products/endlessly-ever-after"
        confidence: high
        verification_method: primary_source_fetch
        positive_signals: ["characterised as a fairy story with logic gates", "illustration called exaggerated and kinetic"]
        negative_signals: []
        evidence_paraphrase: "Reads the structure as a branching-logic device applied to folklore."
        verification_note: >-
          Found in pass 2 on the publisher round-up; a source pass 1 missed entirely, and the one that names
          the structural device most precisely.
      - name: "Parent/family blogs (Little Village, Can We Read, Macaroni Kid)"
        reviewer_type: parent
        url: "https://littlevillagemag.com/book-review-endlessly-ever-after-by-laurel-snyder-ill-by-dan-santat/"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["reread value called out by kids wanting more paths", "humor offsets dark beats"]
        negative_signals:
          - multiple parents flag some endings as surprisingly dark/tragic for a picture book
          - one parent filtered storylines reading with a 4-year-old
