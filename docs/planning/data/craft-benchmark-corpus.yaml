        reviewer_type: reader
        url: "https://www.amazon.com/Youre-Hero-Adventure-Lily-Murray/dp/1782409939"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["build-your-own-story concept and art praised", "sustains interest across repeat reads"]
        negative_signals: ["one reviewer liked the idea but found the execution a little simple"]
