  - id: the-cave-of-time
    title: "The Cave of Time (Choose Your Own Adventure #1)"
    author: "Edward Packard"
    isbn_or_asin: "9780553269659 (common reissue; 100+ editions exist with different ISBNs)"
    publisher: "Originally Bantam (1979); series now Chooseco LLC"
    age_band_claimed: "Grades 4-7 / ages 7-12 depending on retailer"
    band_group: "8-10"
    format: cyoa_novel
    sources:
      - name: "Goodreads"
        reviewer_type: reader
        url: "https://www.goodreads.com/book/show/190917.The_Cave_of_Time"
        confidence: high
        positive_signals: ["strong nostalgia; a childhood-favorite entry point into the series", "high replay value, explicit ending-hunting", "the second-person format still cited as appealing decades later"]
        negative_signals: ["choices sometimes read as arbitrary rather than meaningful", "no unifying story; disconnected vignettes sharing only a premise and opening"]
        evidence_paraphrase: "Ratings cluster high-3s to low-4s/5 across editions (largest single-edition sample 3.88, n=1417); occasional notes that choices feel random."
      - name: "These Heterogeneous Tasks (interactive-fiction craft blog)"
        reviewer_type: critic
        url: "https://heterogenoustasks.wordpress.com/2011/08/05/cyoa-structures-the-cave-of-time/"
        confidence: high
        positive_signals: ["identified as the archetypal Time Cave structure: near-choice-every-page, heavy branching, strong second-person identification", "structure deliberately encourages replay"]
        negative_signals: ["no unifying story: many short disconnected stories sharing an opening and style, not one throughline", "prose has an accelerated, plot-summary feel rather than fully realized scenes"]
        evidence_paraphrase: "A structural critic names it the template Time Cave pattern: broad, non-reconverging branching, at the cost of narrative coherence."
      - name: "50 Years of Text Games (Aaron A. Reed)"
        reviewer_type: critic
        url: "https://if50.substack.com/p/1979-the-cave-of-time"
        confidence: high
        positive_signals: ["deliberate structural craft: Packard hand-designed the branch diagram to a fixed page budget", "39 choice points and 40 endings (18 good / 16 bad / 6 ambiguous) across 114 pages, an intentional balance, not randomness"]
        negative_signals: []
        evidence_paraphrase: "A historical account crediting Packard with hand-solving the branching-narrative math, with a counted good/bad/ambiguous ending split."
      - name: "Amazon"
        reviewer_type: reader
        url: "https://www.amazon.com/Cave-Choose-Adventure-Retro-Editions/dp/1933390794"
        confidence: medium
        positive_signals: ["good for reluctant readers", "accessible even to a strong 1st-grade reader"]
        negative_signals: []
        evidence_paraphrase: "Reviewers emphasize accessibility for younger/reluctant readers over craft critique."
    craft_labels:
      choice_meaningfulness: mixed
      character_depth_change: weak
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: weak
      age_fit: strong
    notes: >
      No Common Sense Media page exists for this title; no StoryGraph entry for the original book
      (only for its sequel "Return to the Cave of Time"). No professional trade review (Kirkus,
      SLJ, PW) exists either, unsurprising for a 1979 mass-market paperback of its category. The
      counted 18/16/6 ending split from the if50.substack.com history piece is the single most
      concrete, quantified craft data point found across all ten titles this session and is worth
      treating as a template for what "good sourcing" looks like for the rest of the eventual
      30-title corpus.

  - id: meanwhile
