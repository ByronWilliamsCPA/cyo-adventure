# Craft-review benchmark corpus: sourced entries.
#
# Companion data file to docs/planning/craft-review-benchmark-corpus.md (UW-N11 in
# unscheduled-work-register.md). Each entry stores title/author/ISBN/source/URL plus a short
# internally-authored label and paraphrase, never full review text, per that doc's copyright
# posture.
#
# Provenance and a caveat that applies to every entry below: sourced 2026-08-13 via parallel
# research agents using WebSearch plus attempted WebFetch. WebFetch was blocked by this
# environment's network egress policy for every review-site domain attempted (kirkusreviews.com,
# goodreads.com, commonsensemedia.org, slj.com, thestorygraph.com, amazon.com, and others), on
# every single agent run. All findings below are therefore reconstructed from WebSearch's
# snippet-level synthesis of those pages, not a first-hand page read. That is real signal (each
# agent independently corroborated specific claims, e.g. Kirkus's stated criticisms of "The
# Citadel of Whispers" matched an initial manual WebSearch check word-for-word in substance
# before any agent ran), but it is not equivalent to opening the page directly, so per-source
# `confidence` below is capped at "medium" wherever only a search snippet was available, and only
# raised to "high" where multiple independent snippets converged on the same specific claim.
# Re-verify with a direct browser session before treating any single-source claim as final.
#
# confidence values: high (multiple independent sources converge, or a direct fetch worked),
# medium (single source, snippet-only), low (secondary/tertiary source, thin coverage).
# craft_labels values: strong / mixed / weak / not_reported (source never addressed it).

schema_version: 1
sourced_date: "2026-08-13"
sourcing_method: "WebSearch snippet synthesis via parallel research agents; WebFetch egress-blocked for all review domains this session"

titles:
