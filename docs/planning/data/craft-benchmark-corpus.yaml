      different endings or inserting a real child's name/photo, so "personalized" in the original
      proposal's description is a partial fit at best.

  - id: the-cave-of-time
    title: "The Cave of Time (Choose Your Own Adventure #1)"
    author: "Edward Packard"
    isbn_or_asin: "9780553269659 (common reissue; 100+ editions exist with different ISBNs)"
    publisher: "Originally Bantam (1979); series now Chooseco LLC"
    age_band_claimed: "Grades 4-7 / ages 7-12 depending on retailer"
    band_group: "8-10"
    format: cyoa_novel
    sources:
      - name: "Goodreads"
        reviewer_type: reader
        url: "https://www.goodreads.com/book/show/190917.The_Cave_of_Time"
        confidence: high
        verification_method: websearch_snippet
        positive_signals:
          - strong nostalgia; a childhood-favorite entry point into the series
          - high replay value, explicit ending-hunting
          - the second-person format still cited as appealing decades later
        negative_signals:
          - choices sometimes read as arbitrary rather than meaningful
          - no unifying story; disconnected vignettes sharing only a premise and opening
        evidence_paraphrase: >-
          Ratings cluster high-3s to low-4s/5 across editions (largest single-edition sample 3.88, n=1417);
          occasional notes that choices feel random.
      - name: "These Heterogeneous Tasks (interactive-fiction craft blog)"
        reviewer_type: critic
        url: "https://heterogenoustasks.wordpress.com/2011/08/05/cyoa-structures-the-cave-of-time/"
        confidence: high
        verification_method: primary_source_fetch
        positive_signals:
          - 'called the classic CYOA structure: a choice almost every page, heavy branching'
          - high replayability treated as part of that resemblance
        negative_signals:
          - 'states the book does not really have a unifying story: a number of different stories sharing a general style and some early content'
          - small text blocks and frequent leaps between situations produce a fragmentary reading experience
        evidence_paraphrase: >-
          A structural critic reads it as the template branching pattern, broad and largely non-reconverging,
          at the cost of narrative coherence.
        verification_note: >
          Read directly 2026-08-30. The substance holds, the label does not: this 2011 post calls
          the pattern "the classic CYOA structure", not "Time Cave". The Time Cave name comes from
          the same author's later taxonomy (Standard Patterns in Choice-Based Games, 2015), so
          pass 1 attributed a 2015 coinage to a 2011 post. Corrected to the post's own wording.
      - name: "50 Years of Text Games (Aaron A. Reed)"
        reviewer_type: critic
        url: "https://if50.substack.com/p/1979-the-cave-of-time"
        confidence: medium
        verification_method: primary_source_fetch
        positive_signals:
          - >-
            deliberate structural craft: describes Packard sketching the branch diagram by hand in a spiral
            notebook from 1969 and working the structural problems of branching narrative out from first
            principles
          - forty different endings
          - rarely more than two pages pass without a choice
        negative_signals: []
        evidence_paraphrase: >-
          A historical account crediting Packard with hand-solving the branching-narrative math, and stating a
          forty-ending count.
        verification_note: >
          PARTIALLY FALSIFIED 2026-08-30 by a direct read, and this matters because pass 1 promoted
          this row as the batch's most quantified craft data point and the companion doc held it up
          as the model for good sourcing. What the page supports: forty endings, the hand-drawn
          1969 branch diagram, and a choice roughly every two pages. What the page does NOT state:
          the "39 choice points" figure, the "114 pages" figure, and the counted "18 good / 16 bad
          / 6 ambiguous" split. The article shows a flowchart and describes it only as having
          roughly an even number of good, bad, and neutral endings. Those three numbers are
          withdrawn rather than deleted, so the withdrawal is on the record: they may come from a
          section not rendered to an unauthenticated read, or pass 1 may have manufactured
          precision from the flowchart's qualitative description. Confidence drops from high to
          medium until someone reads the article with a subscription and settles it. The lesson
          the companion doc drew from this row (that a counted, quantified craft datum is what good
          sourcing looks like) survives; the claim that this row IS one does not.
      - name: "Amazon"
        reviewer_type: reader
        url: "https://www.amazon.com/Cave-Choose-Adventure-Retro-Editions/dp/1933390794"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["good for reluctant readers", "accessible even to a strong 1st-grade reader"]
        negative_signals: []
        evidence_paraphrase: "Reviewers emphasize accessibility for younger/reluctant readers over craft critique."
    craft_labels:
      choice_meaningfulness: mixed
      character_depth_change: weak
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: weak
      age_fit: strong
    notes: >
      No Common Sense Media page exists for this title; no StoryGraph entry for the original book
      (only for its sequel "Return to the Cave of Time"). No professional trade review (Kirkus,
      SLJ, PW) exists either, unsurprising for a 1979 mass-market paperback of its category. The
      counted 18/16/6 ending split that pass 1 attributed to the if50.substack.com history piece
      was WITHDRAWN in pass 2: a direct read finds forty endings stated and the good/bad/neutral
      balance described only qualitatively, with no numeric split, no choice-point count, and no
      page count on the page (see that source row's verification_note). Pass 1 held this up as the
      single most concrete quantified craft datum in the batch and as the template for what good
      sourcing looks like. The aspiration was right and the example was not: a quantified,
      countable craft datum IS what this corpus most wants, which is exactly why a fabricated one
      is the most damaging thing it can carry. Nothing else in the batch reaches that standard
      either, so the honest position is that the 30-title target has no sourcing exemplar yet.

  - id: meanwhile
    title: "Meanwhile"
    author: "Jason Shiga"
    isbn_or_asin: "9780810984233"
    publisher: "Amulet Books (Abrams)"
    age_band_claimed: "8-12 publisher-listed; one parent/librarian reviewer recommends 10+"
    band_group: "8-10"
    format: graphic_gamebook
    sources:
      - name: Kirkus Reviews
        reviewer_type: professional
        url: "https://www.kirkusreviews.com/book-reviews/jason-shiga-2/meanwhile/"
        confidence: high
        verification_method: primary_source_fetch
        verification_note: >-
          Read directly 2026-08-30, and the closest match in the batch: the review reads 'This is a truly
          ingenious graphic novel in its construction' and 'The plots for some adventures can be shallow,
          confusing or frustratingly circular, leading readers back to the same spot.' No star.
        positive_signals:
          - construction called truly ingenious
          - story lines called unpredictable, ranging from the unremarkable to the end of the world
        negative_signals: ["some branch plots are shallow, confusing, or frustratingly circular, looping readers back to the same spot"]
        evidence_paraphrase: "Praises structural ingenuity but flags that individual paths can feel thin or repetitive."
      - name: "Goodreads (aggregate)"
        reviewer_type: reader
        url: "https://www.goodreads.com/book/show/7229730-meanwhile"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["3.94 average, 4251 ratings, 483 reviews (41% 5-star)", "praised by cartoonist Gene Luen Yang as a genre landmark"]
        negative_signals: ["some readers call it dark/twisted in tone", "demanding to navigate; appeals most to puzzle/logic-minded readers"]
        evidence_paraphrase: >-
          Solidly positive aggregate; sentiment splits between delight at the puzzle format and reports it's
          demanding or tonally dark.
      - name: "Publisher/retailer copy"
        reviewer_type: retailer
        url: "https://www.amazon.com/Meanwhile-Path-Possibilities-Graphic-Novels/dp/0810984237"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["markets true replay value; 3,856 story possibilities as the headline feature"]
        negative_signals: []
        evidence_paraphrase: "Publisher copy foregrounds replayability and finding the best path as the central hook."
      - name: "TV Tropes (fan-analysis synthesis)"
        reviewer_type: reader
        url: "https://tvtropes.org/pmwiki/pmwiki.php/ComicBook/Meanwhile"
        confidence: low
        verification_method: websearch_snippet
        positive_signals: ["branches genuinely diverge in outcome: death, time loops, or a dark-secret discovery, not cosmetic variation"]
        negative_signals:
          - the one fully happy ending is reachable only by breaking the intended navigation, undercutting a straightforward sense of earned payoff
          - character depth secondary to puzzle-logic construction
        evidence_paraphrase: "Choices lead to structurally distinct outcomes, but the most satisfying ending sits outside normal play."
    craft_labels:
      choice_meaningfulness: strong
      character_depth_change: weak
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: weak
      age_fit: mixed
    notes: >
      Consensus across sources: the tab/tube navigation mechanism is treated as a real structural
      innovation with outcomes that meaningfully diverge, but character/dialogue depth is
      explicitly and repeatedly traded for puzzle-logic ingenuity. That trade-off, named
      explicitly by multiple independent sources for the same book, is the strongest single
      cross-source finding in this batch.

  - id: traitors-in-space
    title: "Traitors in Space: A Pick-Your-Own-Path Adventure"
    author: "Tim Collins (illustrated by Steven Wood)"
    isbn_or_asin: "9781665977623 (US, Aladdin/Simon & Schuster); UK ed. Buster Books 9781837250455"
    publisher: "Aladdin (Simon & Schuster) / Buster Books (UK)"
    age_band_claimed: "Ages 8-12 / Grades 3-6"
    band_group: "8-10"
    format: illustrated_gamebook
    sources:
      - name: Kirkus Reviews
        reviewer_type: professional
        url: "https://www.kirkusreviews.com/book-reviews/tim-collins/traitors-in-space/"
        confidence: high
        verification_method: primary_source_fetch
        positive_signals:
          - says the tale will invite readers to return again and again
          - more than 45 possible endings, some deadly
          - closes by calling it a cosmic journey that will have young adventurers rocketing back for further missions
        negative_signals: ["states that scene-setting and character development take a back seat to rollicking side quests"]
        evidence_paraphrase: >-
          A fast-paced branching adventure where character work is secondary to side quests, but which the
          reviewer expects readers to replay.
        verification_note: >
          CORRECTION 2026-08-30, from a direct read. Pass 1 recorded a Kirkus "starred review" at
          confidence high. THE PAGE SHOWS NO STAR. The claim is struck, not softened. The same read
          also relocates a detail: the "45+ endings" figure is Kirkus's ("more than 45 possible
          endings (some deadly)"), and pass 1 attributed it to School Library Journal. The
          criticism paraphrase itself was accurate, which is the awkward part: a row can carry a
          correct summary and a fabricated accolade at the same confidence, so accolades need
          checking independently of substance.
      - name: School Library Journal
        reviewer_type: professional
        url: "https://www.slj.com/review/traitors-in-space-a-pickyourownpath-adventure-100005929"
        confidence: low
        verification_method: unverified
        positive_signals: ["puzzle-solving and trust decisions framed as core engagement drivers", "grades 3-6 recommendation"]
        negative_signals: []
        evidence_paraphrase: "Describes a structure built around choices, puzzles, and trust decisions."
        verification_note: >
          Could not be re-verified: slj.com returns HTTP 403 to an unauthenticated fetch, and no
          publisher round-up quoting this review was located. The "45+ endings" signal has been
          moved to the Kirkus row above, where a direct read found it. What remains here is
          pass-1 snippet synthesis with its distinguishing detail removed, so confidence drops to
          low and the method to unverified. Retained rather than deleted so a later curator with
          SLJ access knows exactly which claim to settle.
      - name: "Goodreads (aggregate)"
        reviewer_type: reader
        url: "https://www.goodreads.com/book/show/225128825-traitors-in-space"
        confidence: medium
        verification_method: websearch_snippet
        positive_signals: ["~4.08/5 (small sample, 13 ratings)", "readers report wanting to reread with different choices"]
        negative_signals: ["at least one reader calls the underlying plot predictable, though still enjoyable for the format"]
        evidence_paraphrase: "Small but positive rating; comments emphasize reread fun, with one note that the plot itself is fairly predictable."
    craft_labels:
      choice_meaningfulness: mixed
      character_depth_change: weak
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: mixed
      age_fit: strong
    notes: >
      The original proposal's framing ("praised for replayability and numerous endings, character
      development secondary to side quests") holds up almost exactly against Kirkus's actual
      review, confirmed by direct read 2026-08-30. Pass 1 called that the strongest confirmation
      of source fidelity in the batch and, on substance, it still is. But pass 1 also attached a
      Kirkus "starred review" to the same row that the page does not show, so this entry is
      simultaneously the batch's best evidence that snippet synthesis reproduces a review's
      SUBSTANCE faithfully and its best evidence that snippet synthesis invents ACCOLADES. Those
      are separable failure modes and the corpus should check them separately.

  - id: samurai-vs-ninja
    title: "Adventuregame Comics: Samurai vs. Ninja (Book 3)"
    author: "Jason Shiga"
    isbn_or_asin: "9781419757839"
    publisher: "Abrams Fanfare"
