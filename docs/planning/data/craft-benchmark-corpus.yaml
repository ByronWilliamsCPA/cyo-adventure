        negative_signals: []
        evidence_paraphrase: "Starred review calling the choice-driven structure adaptable to different readers."
      - name: "The Horn Book"
        reviewer_type: professional
        url: "https://www.hbook.com/story/review-of-endlessly-ever-after-pick-your-path-to-countless-fairy-tale-endings-may22"
