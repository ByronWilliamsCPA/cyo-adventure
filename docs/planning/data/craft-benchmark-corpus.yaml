    craft_labels:
      choice_meaningfulness: strong
      character_depth_change: not_reported
      ending_payoff: mixed
      replayability: strong
      dialogue_prose_craft: strong
      age_fit: mixed
    notes: >
      Real title confirmed (hardcover, April 2022, 88pp). A 2023 sequel "Endlessly Ever After:
      Endlessly Adventures" (9781797239118) exists and is a distinct title, easy to conflate in
      search. Age-fit signals genuinely conflict across sources (SLJ's PreS-Gr3 vs. Horn Book's
      one-on-one-only caution), which is itself a useful data point: this project's own band
      system would have to pick a lane the published reviewers didn't agree on.

