# Status: Active | Source of truth for phase and rung vocabulary | Updated 2026-08-01
#
# plan-manifest.toml
#
# The machine-readable spine of the plan. Three things live here and nowhere else:
#
#   1. The closed vocabulary of phase tokens. `scripts/check_work_linkage.py` derives its
#      phase vocabulary from this file rather than hardcoding it, and validates that
#      `roadmap.md`'s own headings declare exactly this set. Before this file existed the
#      vocabulary was duplicated: a hardcoded Python frozenset AND a scrape of the roadmap
#      headings, so a phase change meant editing two places, one of them code.
#
#   2. The phase-to-rung mapping. The release ladder is an OVERLAY on the phase plan, not a
#      continuation of it: each rung adds phases to the one below. The single most
#      load-bearing dependency fact in the plan is that Phase 7 gates R3 and explicitly does
#      NOT gate R2, which means TestFlight can ship before the compliance work finishes.
#      That fact used to live in prose, in two documents, in slightly different words, where
#      nothing could check it. Here it is data, and `check_work_linkage.py` asserts it.
#
#   3. The two-axis status model. `shipped` answers "did the code merge"; `usable` answers
#      "can a real person do the thing". Those two questions diverged repeatedly on this
#      project, which is the honest reason the roadmap invented the phrase "substantially
#      delivered". One column was being asked to answer both. The roadmap's prose vocabulary
#      is now DERIVED from these two fields (see [status_vocabulary] below) and the checker
#      verifies the prose matches, so the words and the data cannot drift apart.
#
# Editing rules:
#   - Adding a phase means adding it here first, then adding the matching roadmap heading.
#     The checker fails if the two disagree, in either direction.
#   - `usable` is the honest field. Resist the urge to set it to "yes" because the PR merged;
#     that is precisely the conflation this model exists to prevent.
#   - Every phase whose `usable` is not "yes" should carry a `gaps` entry naming what is
#     missing. The gap text is prose and is not machine-checked, but an empty `gaps` list on
#     a partial phase is a smell.

schema_version = 1
updated = "2026-08-01"

# ---------------------------------------------------------------------------------------
# Validation provenance
# ---------------------------------------------------------------------------------------
# Until 2026-08-01 every status in this file was derived from planning-document prose. That
# is circular: the roadmap asserted a status, this manifest recorded it, and a reader
# checking one against the other found agreement without either being grounded in code.
#
# On 2026-08-01 all fourteen phases were re-validated against the repository by eleven
# parallel agents, each forbidden from reading roadmap.md, PROJECT-PLAN.md, the capability
# register, or this file. Their evidence universe was source, tests, migrations, and
# workflows only, and every claim had to carry a file path and symbol name or be reported as
# "no evidence found". Each agent was given its phase's then-current claim as an allegation
# to falsify rather than a summary to confirm.
#
# Outcome: no (shipped, usable) pair changed. The two-axis model held. The GAP LISTS did
# not: two Phase 5 gaps were already closed in code, one was half closed, and Phases 3, 6,
# 7 and 9 each carried real gaps the manifest did not admit. Gaps rot in one direction,
# because nobody returns to a planning document after fixing something. Re-validate gap
# lists at least as often as feature status.
[validation]
last_validated = "2026-08-01"
method = "eleven parallel code-only agents, planning docs excluded from their evidence universe"
result = "no status pair changed; nine of fourteen phases had incorrect gap lists"
# Re-anchored 2026-08-02 onto a main that had advanced eight commits (through the
# v0.59.0 release) since the validation base. Five files carrying gap-list locators had
# changed; the three affected gap claims (Phase 2b generation_provider validator, Phase 3
# send-back persistence, Phase 4d erasure-cascade test) were re-checked and all three are
# still open. Four line numbers had drifted and were corrected.
#
# #ASSUME: data integrity: a path:line locator here is only as fresh as last_validated;
# code moves and a citation that still resolves can silently point at the wrong symbol.
# #VERIFY: scripts/check_work_linkage.py checks structure, not locators. Before trusting a
# locator after main has moved, re-resolve it by SYMBOL (grep the marker text), not by line.
locator_basis = "resolved against main at v0.59.0 on 2026-08-02; all 31 path:line refs in range"

# ---------------------------------------------------------------------------------------
# Status vocabulary
# ---------------------------------------------------------------------------------------
# The roadmap writes phase status as prose. These entries define the prose term each
# (shipped, usable) pair maps to, so the checker can verify the roadmap's words against the
# manifest's data. `shipped` and `usable` each take one of: "yes", "partial", "no".

[status_vocabulary]
"yes/yes" = "delivered"
"yes/partial" = "substantially delivered"
"yes/no" = "shipped but unusable"
"partial/partial" = "partially delivered"
"partial/no" = "partially delivered"
"no/no" = "not started"

# ---------------------------------------------------------------------------------------
# Release rungs
# ---------------------------------------------------------------------------------------
# Each rung lists every phase it requires, including those inherited from the rung below.
# `gates` on a phase is derived from these lists: a phase gates the lowest rung that
# requires it.

[rungs.R1]
name = "Internal release, web only"
description = "The web PWA run for the maintainer's own family. No native app, no outside users."
requires_phases = ["0", "1", "2", "2b", "3", "4a", "4b", "4c", "4d", "5"]
alpha_phases = ["0", "1", "2", "2b", "3", "4a"]
alpha_shipped = "2026-07-03"
alpha_live = "2026-07-05"
status = "alpha live, full rung not signed off"

[rungs.R2]
name = "Limited release, TestFlight iOS"
description = "Capacitor iOS shell plus public guardian authentication, distributed over TestFlight to a controlled group."
requires_phases = ["0", "1", "2", "2b", "3", "4a", "4b", "4c", "4d", "5", "6", "8"]
estimate = "6 to 9 weeks after R1"
status = "Phase 6 substantially built, Phase 8 not started"
# The load-bearing exclusion. Phase 7 is deliberately absent: the compliance checklist gates
# the public store submission, not the TestFlight build. `check_work_linkage.py` asserts
# this exclusion explicitly rather than inferring it, because silently dropping it would
# reorder the critical path without failing anything.
excludes_phases = ["7", "9"]

[rungs.R3]
name = "Public launch, App Store"
description = "The full product under Kids Category rules: verifiable parental consent, account deletion, private cover storage, hosted infrastructure, curated public catalog, live moderation."
requires_phases = [
  "0", "1", "2", "2b", "3", "4a", "4b", "4c", "4d", "5", "6", "7", "8", "9",
]
estimate = "5 to 8 weeks after R2, partially overlapping"
status = "Phase 7 partial, Phase 9 not started"

