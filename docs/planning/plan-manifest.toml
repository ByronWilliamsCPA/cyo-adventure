# Status: Active | Source of truth for phase and rung vocabulary | Updated 2026-08-01
#
# plan-manifest.toml
#
# The machine-readable spine of the plan. Four things live here and nowhere else:
#
#   1. The closed vocabulary of phase tokens. `scripts/check_work_linkage.py` derives its
#      phase vocabulary from this file rather than hardcoding it, and validates that
#      `roadmap.md`'s own headings declare exactly this set. Before this file existed the
#      vocabulary was duplicated: a hardcoded Python frozenset AND a scrape of the roadmap
#      headings, so a phase change meant editing two places, one of them code.
#
#   2. The phase-to-rung mapping. The release ladder is an OVERLAY on the phase plan, not a
#      continuation of it: each rung adds phases to the one below. The single most
#      load-bearing dependency fact in the plan is that Phase 7 gates R3 and explicitly does
#      NOT gate R2, which means TestFlight can ship before the compliance work finishes.
#      That fact used to live in prose, in two documents, in slightly different words, where
#      nothing could check it. Here it is data, and `check_work_linkage.py` asserts it.
#
#   3. The two-axis status model. `shipped` answers "did the code merge"; `usable` answers
#      "can a real person do the thing". Those two questions diverged repeatedly on this
#      project, which is the honest reason the roadmap invented the phrase "substantially
#      delivered". One column was being asked to answer both. The roadmap's prose vocabulary
#      is now DERIVED from these two fields (see [status_vocabulary] below) and the checker
#      verifies the prose matches, so the words and the data cannot drift apart.
#
#   4. The closed set of ID namespaces (`[namespaces]` below). Every register that mints its
#      own id prefix (UW-, debt ids, AL-, capability ids, SQ-) used to have its row-id and
#      citation regexes hardcoded as Python module-level constants in `check_work_linkage.py`.
#      That was the same class of duplication phase tokens used to be: a namespace change, or
#      a new namespace such as SQ-*, meant editing code rather than data. The checker now
#      resolves every namespace's pattern from here, and fails loudly rather than silently
#      accepting anything when a namespace it needs is not declared.
#
#      One qualification on "and nowhere else", for this item only: the *patterns* live here
#      alone, but the *set* of namespace names, and which fields each one must carry, is
#      mirrored by `_NAMESPACE_REGISTRY_CONTRACT` in `check_work_linkage.py`. A name is only a
#      key in this file, and an unread key is invisible, so a typo'd table name would define a
#      namespace nothing consumes while the namespace the checker wanted resolved to a
#      match-nothing pattern. The checker compares the two sets in both directions on every
#      run, which is what makes the mirror safe to have: adding a namespace here without
#      adding it there (or the reverse) is a reported failure, not a silent no-op.
#
# Editing rules:
#   - Adding a phase means adding it here first, then adding the matching roadmap heading.
#     The checker fails if the two disagree, in either direction.
#   - `usable` is the honest field. Resist the urge to set it to "yes" because the PR merged;
#     that is precisely the conflation this model exists to prevent.
#   - Every phase whose `usable` is not "yes" should carry a `gaps` entry naming what is
#     missing. The gap text is prose and is not machine-checked, but an empty `gaps` list on
#     a partial phase is a smell.

schema_version = 1
updated = "2026-09-05"

# ---------------------------------------------------------------------------------------
# Validation provenance
# ---------------------------------------------------------------------------------------
# Until 2026-08-01 every status in this file was derived from planning-document prose. That
# is circular: the roadmap asserted a status, this manifest recorded it, and a reader
# checking one against the other found agreement without either being grounded in code.
#
# On 2026-08-01 all fourteen phases were re-validated against the repository by eleven
# parallel agents, each forbidden from reading roadmap.md, PROJECT-PLAN.md, the capability
# register, or this file. Their evidence universe was source, tests, migrations, and
# workflows only, and every claim had to carry a file path and symbol name or be reported as
# "no evidence found". Each agent was given its phase's then-current claim as an allegation
# to falsify rather than a summary to confirm.
#
# Outcome: no (shipped, usable) pair changed. The two-axis model held. The GAP LISTS did
# not: two Phase 5 gaps were already closed in code, one was half closed, and Phases 3, 6,
# 7 and 9 each carried real gaps the manifest did not admit. Gaps rot in one direction,
# because nobody returns to a planning document after fixing something. Re-validate gap
# lists at least as often as feature status.
[validation]
last_validated = "2026-08-01"
method = "eleven parallel code-only agents, planning docs excluded from their evidence universe"
result = "no status pair changed; nine of fourteen phases had incorrect gap lists"
# Re-anchored 2026-08-02 onto a main that had advanced eight commits (through the
# v0.59.0 release) since the validation base. Five files carrying gap-list locators had
# changed; the three affected gap claims (Phase 2b generation_provider validator, Phase 3
# send-back persistence, Phase 4d erasure-cascade test) were re-checked and all three are
# still open. Four line numbers had drifted and were corrected.
#
# #ASSUME: data integrity: a path:line locator here is only as fresh as last_validated;
# code moves and a citation that still resolves can silently point at the wrong symbol.
# #VERIFY: scripts/check_work_linkage.py checks structure, not locators. Before trusting a
# locator after main has moved, re-resolve it by SYMBOL (grep the marker text), not by line.
locator_basis = "resolved against main at v0.59.0 on 2026-08-02; all 36 path:line refs in range"
# Re-validated 2026-09-05 (v0.88.0) by six Sonnet code-verification agents, one slice each, planning
# docs admitted only as the allegations to falsify. Status pairs changed for ONE phase: 9 moves from
# no/no to partial/no because the catalog mechanism, family quotas, non-local live-review enforcement,
# and the production Supabase pipeline all exist. Gap lists changed for Phases 5, 6, 7 and 9, in the
# same direction as 2026-08-01: closures the documents had not recorded. Path:line locators below were
# NOT re-resolved in this pass; treat them as symbol hints and re-grep before citing.
revalidated = "2026-09-05"

# ---------------------------------------------------------------------------------------
# Status vocabulary
# ---------------------------------------------------------------------------------------
# The roadmap writes phase status as prose. These entries define the prose term each
# (shipped, usable) pair maps to, so the checker can verify the roadmap's words against the
# manifest's data. `shipped` and `usable` each take one of: "yes", "partial", "no".

[status_vocabulary]
"yes/yes" = "delivered"
"yes/partial" = "substantially delivered"
"yes/no" = "shipped but unusable"
"partial/partial" = "partially delivered"
"partial/no" = "partially delivered"
"no/no" = "not started"

# ---------------------------------------------------------------------------------------
# ID namespaces
# ---------------------------------------------------------------------------------------
# Every id prefix `check_work_linkage.py` validates a register row against. Each entry:
#
#   prefix            - the id's letter prefix, for a human reading this table. Row validation
#                        runs off `pattern`/`citation_pattern`, not this field; the checker only
#                        requires it to be present and non-empty.
#   source            - repo-relative path to the register or document the namespace's rows live
#                        in. Checked to resolve to a real file, so moving a register fails here.
#   pattern           - the anchored regex a row's own ID cell must fully match.
#   citation_pattern  - optional. A looser regex for finding a *mention* of an id from this
#                        namespace inside another document's prose (used by the cross-register
#                        linkage checks). Omitted when the namespace is never cited from another
#                        document, only validated within its own table (uw, sq): `pattern`
#                        already serves that single purpose. Must begin with `(?<![-\\w])` AND end
#                        with `(?![-\\w])`; the checker rejects it otherwise. `\\b` is NOT
#                        sufficient at either end, because a hyphen is a word boundary on both
#                        sides: `\\b[KGAS]\\d+\\b` matched `K16` inside `UW-K16` (18 phantom
#                        capability ids in roadmap.md, 25 phantom debt ids in the register), and
#                        the same trailing `\\b` read `P9` out of `P9-05`, which is
#                        PROJECT-PLAN.md's task numbering rather than a debt id.
#
# debt and AL deliberately keep their citation pattern looser than their row pattern (AL rows
# are `AL-\d{3}$`, zero-padded to three digits, but a citation may reasonably be written
# `AL-1`), so the two are declared separately rather than one derived from the other.

# uw's pattern carries a named `cluster` group because the checker needs more than a yes/no
# match from it: every UW row is also checked against the cluster table it was found in, and
# that letter used to be read as a fixed offset (`entry_id[3]`) in Python. A named group keeps
# the whole id layout here rather than splitting it between this file and a magic index.
[namespaces.uw]
prefix = "UW"
source = "docs/planning/unscheduled-work-register.md"
# Extended A-M to A-N on 2026-08-05 to admit Cluster N (external scope-comparison findings),
# the first new cluster added since the manifest's 2026-08-01 baseline. Extend the letter
# range again, deliberately, the next time a new cluster is opened; do not widen it further
# than the clusters that actually exist.
#
# TWO SITES, and they fail asymmetrically. This pattern is one of two copies of the cluster
# letter range; the other is `_CLUSTER_HEADING_RE` in `scripts/check_work_linkage.py`, which
# decides which `## Cluster <letter>:` headings the checker even discovers. Widen BOTH.
# Widening only the heading regex fails loudly (the new rows are validated and report errors
# against a namespace that rejects them). Widening only this pattern is the silent path: the
# checker never discovers the new cluster's table, so its rows are never validated and the run
# still exits 0 with a lower cluster count. `test_cluster_heading_re_covers_every_manifest_uw_cluster`
# in `tests/unit/test_check_work_linkage.py` fails when the two drift apart.
# Digits widened 2 -> 2-3 on 2026-08-09: Cluster C crossed 99 in a single change. It stood at
# UW-C79 before the 2026-08-09 work, PR #661 took it to UW-C83, and this batch appends 40 more to
# reach UW-C123, because the authoring-lessons linkage cluster grows one row per open lesson and the
# skeleton/diversity review contributed those 40 at once. Three digits admit UW-C100..C999, a range
# description rather than a row reference; existing two-digit ids remain valid.
pattern = "^UW-(?P<cluster>[A-N])\\d{2,3}$"

[namespaces.debt]
prefix = "debt"
source = "docs/planning/r1-deferred-debt-register.md"
pattern = "^(?:C\\d+|GS\\d+|U\\d+|T\\d+|P\\d+|SL\\d+)$"
citation_pattern = "(?<![-\\w])(?:C\\d+|GS\\d+|U\\d+|T\\d+|P\\d+|SL\\d+)(?![-\\w])"

[namespaces.al]
prefix = "AL"
source = "docs/planning/authoring-lessons-log.md"
pattern = "^AL-\\d{3}$"
citation_pattern = "(?<![-\\w])AL-\\d+(?![-\\w])"

[namespaces.cap]
prefix = "cap"
source = "docs/planning/capability-register.md"
pattern = "^[KGAS]\\d+$"
citation_pattern = "(?<![-\\w])[KGAS]\\d+(?![-\\w])"

[namespaces.sq]
prefix = "SQ"
source = "docs/planning/story-structure-improvement-plan.md"
pattern = "^SQ-\\d{2}$"

