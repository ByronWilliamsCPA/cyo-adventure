<?xml version="1.0" encoding="UTF-8"?>
<!--
  CYO Adventure favicon: an open book, in the app's own brand palette
  (design-system/src/tokens.css --color-amber-deep / --color-parchment /
  --color-ink), hand-coded to match the flat, outlined style of the kid
  surface's Mascot glyph (src/kid/Mascot.tsx) rather than a stock icon.

  Kept as one deliberately simple, bold silhouette (cover + pages + spine +
  a bookmark ribbon) so it stays legible at the 16x16 size browsers actually
  render a tab favicon at; a design with finer detail washes out at that
  scale. Colors are hardcoded hex (not CSS custom properties): a favicon
  file is loaded outside the page's cascade, so var(--color-*) would not
  resolve. Single light-brand color set (no prefers-color-scheme swap),
  matching the PWA manifest icons' same reasoning in vite.config.ts: the
  amber-on-transparent glyph reads clearly against both light and dark
  browser tab chrome, so there's no separate dark variant to keep in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CYO Adventure">
  <!-- Covers -->
  <path d="M16 7 C11.5 4.6 6.5 4.4 4 6.2 L4 25.6 C6.5 23.9 11.5 24.1 16 26.4 Z" fill="#c17b2a" />
  <path d="M16 7 C20.5 4.6 25.5 4.4 28 6.2 L28 25.6 C25.5 23.9 20.5 24.1 16 26.4 Z" fill="#c17b2a" />
  <!-- Pages -->
  <path d="M16 9.4 C12.2 7.5 8.2 7.4 6.4 8.7 L6.4 23.4 C8.2 22.1 12.2 22.2 16 24.1 Z" fill="#f8f3e8" />
  <path d="M16 9.4 C19.8 7.5 23.8 7.4 25.6 8.7 L25.6 23.4 C23.8 22.1 19.8 22.2 16 24.1 Z" fill="#f8f3e8" />
  <!-- Spine -->
  <line x1="16" y1="7" x2="16" y2="26.4" stroke="#2c1a0e" stroke-width="1.3" stroke-linecap="round" />
  <!-- Bookmark ribbon -->
  <path d="M14.8 2 L17.2 2 L17.2 9 L16 7.4 L14.8 9 Z" fill="#2c1a0e" />
</svg>
