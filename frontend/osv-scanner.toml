# OSV-Scanner exceptions for the frontend lockfile.
#
# osv-scanner applies the config that sits next to the lockfile it is scanning, so
# these cannot live in the repo-root osv-scanner.toml (an ignore there matches only
# uv.lock and is reported as unused).
#
# No active [[IgnoredVulns]] entries. The three that used to live here are gone:
#   - minimatch (GHSA-g3hv-75wg-m249) and glob (GHSA-3g3m-2fjr-6pw4) are fixed by the
#     package.json overrides (minimatch 11.0.x, glob 14.0.x).
#   - deepmerge (GHSA-gcqx-w48m-w2h4, prototype poisoning in mergeObject) was WITHDRAWN
#     upstream on 2026-11-16. osv-scanner stopped reporting it and then failed the
#     Security Analysis job with "unused ignores", so the entry was removed. deepmerge
#     4.3.1 is still in the lockfile (build-time only, via workbox-build).
#
# #ASSUME: security: a withdrawn advisory stays withdrawn. If OSV ever un-withdraws it,
# osv-scanner reports it again and this file needs a real suppression block (build-time
# only transitive of vite-plugin-pwa/workbox-build, repo-controlled input).
# #VERIFY: the security-analysis.yml `osv-scanner` job is the standing check; `npm ls
# deepmerge` should still show only the workbox-build parent.
