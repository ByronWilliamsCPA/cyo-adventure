# OSV-Scanner exceptions for the frontend lockfile.
#
# osv-scanner applies the config that sits next to the lockfile it is scanning, so
# these cannot live in the repo-root osv-scanner.toml (an ignore there matches only
# uv.lock and is reported as unused).
#
# Build-time-only transitive with no upstream fix (2026-11-07). deepmerge is reachable
# only through workbox-build (vite-plugin-pwa), which runs on a developer or CI machine
# against repo-controlled input. It is not bundled into the shipped app. The minimatch
# (GHSA-g3hv-75wg-m249) and glob (GHSA-3g3m-2fjr-6pw4) advisories that used to be listed
# here are fixed by the package.json overrides (minimatch 11.0.x, glob 14.0.x).
#
# #ASSUME: security: these packages never process attacker-controlled input.
# #VERIFY: `npm ls deepmerge` shows only the workbox-build parent. Revisit by ignoreUntil; drop each entry as soon as upstream
# ships a fix inside the declared range.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-01
reason = """deepmerge mergeObject() prototype poisoning; 4.3.1 is the last release and no fix \
exists. Pulled in by @rollup/plugin-node-resolve inside workbox-build, merging only the \
repo's own static build options at build time."""
