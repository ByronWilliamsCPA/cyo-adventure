<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback, declared after the SVG deliberately: a browser that
         understands `image/svg+xml` picks the vector one, and a browser that
         does not (older Safari/iOS) ignores the unrecognized type and falls
         back to this. Reuses the existing PWA icon rather than adding an
         asset. Note the pre-existing favicon (/vite.svg) was SVG-only too,
         so this closes a gap that predates the favicon swap. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Personalized choose-your-own-adventure storybooks for kids 4 to 13. Your child picks the path; you approve every page. Free during early access."
    />
    <!-- Canonical + social preview tags. Originally added for link-preview
         correctness on a private family deployment (a guardian pasting the
         URL into a family chat); with the landing page now doubling as the
         product's sales funnel (2026-08 redesign), the copy also has to sell.
         Hardcoded to the one real production origin rather than computed
         from window.location, matching how the rest of this static shell
         (title, description) is already origin-agnostic markup filled in
         with real values, not templated per-deploy. -->
    <link rel="canonical" href="https://cyo.williamshome.family/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CYO Adventure" />
    <!-- The headline, not the bare brand: the likeliest share is a parent
         pasting the URL into a family or school chat, where an unknown brand
         name sells nothing and the pitch line does the work. -->
    <meta property="og:title" content="They pick the path. You approve every page." />
    <meta
      property="og:description"
      content="Personalized choose-your-own-adventure storybooks for kids 4 to 13. Your child picks the path; you approve every page."
    />
    <meta property="og:url" content="https://cyo.williamshome.family/" />
    <!-- public/og-image.png is a real 1200x630 landscape card, captured from
         the BUILT hero (headline, lede, both CTAs, the sample shelf and Pip)
         rather than drawn separately, so it cannot drift from the page it
         advertises. It replaces the square PWA icon, which every preview
         surface cropped into a thumbnail instead of showing as a banner.
         Regenerate it whenever the hero's copy or art changes: build, serve
         the build, and screenshot the hero region at 1200x630 in the light
         palette (the capture hides the sticky topbar and centres the hero in
         the frame). -->
    <meta property="og:image" content="https://cyo.williamshome.family/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Three sample storybook covers fanned beside Pip the fox, above the headline: they pick the path, you approve every page."
    />
    <!-- summary_large_image, now that the asset is genuinely landscape: with
         a square image this rendered a stretched or letterboxed banner, which
         is why it was previously the smaller `summary` card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="They pick the path. You approve every page." />
    <meta
      name="twitter:description"
      content="Personalized choose-your-own-adventure storybooks for kids 4 to 13. Your child picks the path; you approve every page."
    />
    <meta name="twitter:image" content="https://cyo.williamshome.family/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Three sample storybook covers fanned beside Pip the fox, above the headline: they pick the path, you approve every page."
    />
    <!-- Structured data: minimal WebApplication entry so a link preview or
         AI crawler that parses JSON-LD gets a correct, machine-readable
         description instead of none at all. EducationalApplication fits a
         kids' reading app better than the schema.org default (a generic
         'Application' subtype). Offers/price fields are still intentionally
         omitted: subscriptions are planned (Track 2 Phase 8, ADR-008) but
         nothing is sold today, and Offer markup for an unpriced plan would
         be a false claim; add it when real prices ship. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CYO Adventure",
        "description": "Personalized choose-your-own-adventure storybooks for kids 4 to 13. Your child picks the path; you approve every page.",
        "url": "https://cyo.williamshome.family/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (installable PWA)"
      }
    </script>
    <!-- W4.3: corrected from a leftover navy (#1d3557) to the parchment/amber
         palette (design-system/src/tokens.css). Two scheme-scoped tags, not
         one: a manifest's theme_color has no per-color-scheme variant (see
         vite.config.ts, which carries only the light-mode value below), but
         a <meta name="theme-color"> tag can use `media` and browsers that
         support it pick whichever matches the OS's prefers-color-scheme.
         This tracks the OS preference only, same as this app's OWN dark-mode
         default (see the inline script below): there is no existing wiring
         anywhere in this codebase that updates a theme-color meta tag from
         the in-app light/dark ThemeToggle, so there is nothing further to
         "keep consistent with" beyond mirroring that same OS-preference
         source of truth. Light value matches vite.config.ts's manifest
         theme_color (amber-deep); dark value is tokens.css's dark-palette
         amber-deep, kept as the same brand accent rather than switching to
         the dark background color. -->
    <meta name="theme-color" content="#c17b2a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#905c1f" media="(prefers-color-scheme: dark)" />
    <!-- Default before the theme script below runs (and the no-JS/no-storage
         fallback): native form controls follow the OS. Once data-theme is
         stamped, tokens.css's :root[data-theme] blocks pin color-scheme to
         match the resolved theme (see design-system/src/tokens.css). -->
    <meta name="color-scheme" content="light dark" />
    <title>CYO Adventure</title>
    <!-- Stamps the resolved theme (stored preference, or the OS's if the
         preference is 'system'/unset) onto <html> before first paint, so
         there is no flash of the wrong theme while src/main.tsx's bundle
         loads. Mirrors src/theme/theme.ts's readStoredMode/resolveTheme
         exactly; ThemeProvider re-applies the same result once it mounts, so
         this is belt-and-suspenders, not a second source of truth. Kept
         inline (not a module) so it runs synchronously, and wrapped in
         try/catch since localStorage can throw in private-mode Safari. -->
    <script>
      ;(function () {
        // Read the stored preference in its OWN try: if localStorage throws
        // (private-mode Safari, disabled-storage policy), fall through to the
        // OS preference below instead of skipping it and defaulting to light.
        // This mirrors src/theme/theme.ts, where readStoredMode() returning
        // 'system' on a storage throw still resolves via matchMedia.
        var stored = null
        try {
          stored = localStorage.getItem('cyo-theme')
        } catch (e) {
          // Storage blocked; stored stays null and the OS preference wins.
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
