<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A choose-your-own-adventure reading app for kids" />
    <!-- W4.3: corrected from a leftover navy (#1d3557) to the parchment/amber
         palette (design-system/src/tokens.css). Two scheme-scoped tags, not
         one: a manifest's theme_color has no per-color-scheme variant (see
         vite.config.ts, which carries only the light-mode value below), but
         a <meta name="theme-color"> tag can use `media` and browsers that
         support it pick whichever matches the OS's prefers-color-scheme.
         This tracks the OS preference only, same as this app's OWN dark-mode
         default (see the inline script below): there is no existing wiring
         anywhere in this codebase that updates a theme-color meta tag from
         the in-app light/dark ThemeToggle, so there is nothing further to
         "keep consistent with" beyond mirroring that same OS-preference
         source of truth. Light value matches vite.config.ts's manifest
         theme_color (amber-deep); dark value is tokens.css's dark-palette
         amber-deep, kept as the same brand accent rather than switching to
         the dark background color. -->
    <meta name="theme-color" content="#c17b2a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#905c1f" media="(prefers-color-scheme: dark)" />
    <!-- Default before the theme script below runs (and the no-JS/no-storage
         fallback): native form controls follow the OS. Once data-theme is
         stamped, tokens.css's :root[data-theme] blocks pin color-scheme to
         match the resolved theme (see design-system/src/tokens.css). -->
    <meta name="color-scheme" content="light dark" />
    <title>CYO Adventure</title>
    <!-- Stamps the resolved theme (stored preference, or the OS's if the
         preference is 'system'/unset) onto <html> before first paint, so
         there is no flash of the wrong theme while src/main.tsx's bundle
         loads. Mirrors src/theme/theme.ts's readStoredMode/resolveTheme
         exactly; ThemeProvider re-applies the same result once it mounts, so
         this is belt-and-suspenders, not a second source of truth. Kept
         inline (not a module) so it runs synchronously, and wrapped in
         try/catch since localStorage can throw in private-mode Safari. -->
    <script>
      (function () {
        // Read the stored preference in its OWN try: if localStorage throws
        // (private-mode Safari, disabled-storage policy), fall through to the
        // OS preference below instead of skipping it and defaulting to light.
        // This mirrors src/theme/theme.ts, where readStoredMode() returning
        // 'system' on a storage throw still resolves via matchMedia.
        var stored = null
        try {
          stored = localStorage.getItem('cyo-theme')
        } catch (e) {
          // Storage blocked; stored stays null and the OS preference wins.
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
