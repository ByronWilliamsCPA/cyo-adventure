# Trivy configuration for the CYO Adventure container image scan.
#
# Trivy auto-discovers `trivy.yaml` in its working directory, which for the
# Container Security workflow is the checked-out repository root. That is the
# same mechanism by which `.trivyignore` has always been picked up: the
# reusable workflow (ByronWilliamsCPA/.github/.github/workflows/
# python-container-security.yml) passes neither `--ignorefile` nor
# `--ignore-policy` to aquasecurity/trivy-action, so both are supplied here
# rather than upstream. No change to the org workflow is required.
#
# Precedence is CLI flag > TRIVY_* env var > this file. The action sets
# TRIVY_SEVERITY / TRIVY_EXIT_CODE / TRIVY_FORMAT and friends from its own
# inputs, so the keys below must stay disjoint from those to take effect;
# verified against Trivy 0.70.0, the version the action pins.
#
# #ASSUME: external resources: the action continues to invoke Trivy with the
# repository root as its working directory. If a future action release runs
# Trivy from elsewhere, this file stops being read and the scan goes RED with
# every suppressed finding at once, which is a loud failure rather than a
# silent one.
# #VERIFY: a scan whose output omits a CVE listed in `.trivyignore.yaml`
# while that CVE exists in the feed proves this file was read.

# ignorefile: per-CVE acceptances, each with its own `statement`, `expired_at`
# and reachability assessment. Trivy's built-in default is the plain-text
# `.trivyignore` and it does NOT auto-detect the YAML variant, so naming it here
# is what makes local runs match CI, where the reusable workflow passes the same
# path via `trivyignores`.
#
# There is deliberately no `ignore-policy` any more. The package-scoped Rego
# rule for `linux-libc-dev` was removed on 2026-10-02 because the base image
# stopped shipping that package; see docs/known-vulnerabilities.md, "Resolution
# detail: `linux-libc-dev` package-scoped acceptance".
ignorefile: .trivyignore.yaml
